<!-- Version 1.2 | shipment-doc-types.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doc Types — Sample Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #fdf8f2; --border: #f0e8da; --accent: #c47a2b;
      --text: #1a1a1a; --muted: #8a7060; --error: #c0392b; --success: #2e7d52;
      --font-mono: 'IBM Plex Mono', monospace; --font-sans: 'Inter', sans-serif;
      --radius: 4px; --transition: 160ms ease; --nav-h: 52px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
    .nav { position: sticky; top: 0; z-index: 100; height: var(--nav-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; }
    .nav-brand { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 0.25rem; flex: 1; }
    .nav-links a { font-size: 0.82rem; color: var(--muted); text-decoration: none; padding: 0.35rem 0.75rem; border-radius: 5px; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); font-weight: 500; }
    .nav-user { font-size: 0.78rem; color: var(--muted); cursor: pointer; padding: 0.35rem 0.75rem; }
    .page { max-width: 800px; margin: 0 auto; padding: 2rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; }
    .page-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 0.75rem; }
    .card-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .card-label { font-size: 0.88rem; font-weight: 500; flex: 1; min-width: 120px; }
    .card-key { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
    .badge { display: inline-block; font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 2px; white-space: nowrap; }
    .badge-active   { background: #edf7f0; color: #1e6640; }
    .badge-inactive { background: #f0f0f0; color: #888; }
    .badge-required { background: rgba(192,57,43,0.1); color: var(--error); border: 1px solid rgba(192,57,43,0.2); }
    .badge-optional { background: #f0f0f0; color: #888; }
    .badge-extracts { background: rgba(26,92,168,0.08); color: #1a5ca8; border: 1px solid rgba(26,92,168,0.2); }
    .card-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--accent); color: #fff; border: none; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.45rem 0.85rem; cursor: pointer; border-radius: var(--radius); transition: opacity 0.15s; white-space: nowrap; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-sm { font-size: 0.65rem; padding: 0.3rem 0.6rem; }
    .btn-danger { background: transparent; color: var(--error); border: 1px solid rgba(192,57,43,0.3); }
    .btn-danger:hover:not(:disabled) { border-color: var(--error); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem; }
    .modal-error { font-size: 0.78rem; color: var(--error); min-height: 1.2rem; margin-bottom: 0.5rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .field { margin-bottom: 0.85rem; }
    .field label { display: block; font-size: 0.72rem; font-family: var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
    .field input[type=text], .field input[type=email] { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.82rem; font-family: var(--font-sans); background: var(--bg); color: var(--text); }
    .field input:focus { outline: none; border-color: var(--accent); }
    .toggle-row { display: flex; align-items: center; gap: 0.75rem; font-size: 0.82rem; margin-bottom: 0.85rem; }
    .toggle-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
    .sort-hint { font-size: 0.72rem; color: var(--muted); font-family: var(--font-mono); }
    .empty { text-align: center; padding: 3rem 1rem; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
    .loading { text-align: center; padding: 4rem; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; font-family: var(--font-mono); font-size: 0.78rem; padding: 0.6rem 1.2rem; border-radius: var(--radius); opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 300; }
    .toast.show { opacity: 1; }
    .inactive-row { opacity: 0.5; }
  </style>
</head>
<body>

<nav class="nav">
  <span class="nav-brand" id="nav-brand">Sample Tracker</span>
  <div class="nav-links">
    <a href="shipments.html">Shipments</a>
    <a href="shipment-doc-types.html" class="active">Doc Types</a>
  </div>
  <span class="nav-user" id="nav-user"></span>
</nav>

<!-- Edit/Create Modal — must be before script -->
<div class="modal-overlay" id="modal-doctype">
  <div class="modal">
    <div class="modal-title" id="modal-doctype-title">Add Doc Type</div>
    <div class="modal-error" id="modal-doctype-error"></div>
    <input type="hidden" id="dt-id" />

    <div class="field">
      <label>Key <span style="color:var(--error)">*</span> <span class="sort-hint">short code, no spaces e.g. BOL, ISF</span></label>
      <input type="text" id="dt-key" placeholder="e.g. BOL" />
    </div>
    <div class="field">
      <label>Label <span style="color:var(--error)">*</span></label>
      <input type="text" id="dt-label" placeholder="e.g. Bill of Lading" />
    </div>
    <div class="field">
      <label>Sort Order <span class="sort-hint">lower = shown first in modal</span></label>
      <input type="text" inputmode="numeric" id="dt-sort" placeholder="e.g. 1" />
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="dt-default-required" />
      <label for="dt-default-required" style="cursor:pointer">
        <strong>Required by default</strong>
        <span style="color:var(--muted);font-size:0.75rem;display:block">Pre-ticked as Required when sending a doc request. Staff can still change per shipment.</span>
      </label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="dt-extracts" />
      <label for="dt-extracts" style="cursor:pointer">
        <strong>Supports extraction (⚡)</strong>
        <span style="color:var(--muted);font-size:0.75rem;display:block">Shows Extract button in staff Docs modal. Use for BOL and Packing Slip only.</span>
      </label>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-dt-cancel">Cancel</button>
      <button class="btn" id="btn-dt-save">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Shipment Doc Types</div>
      <div class="page-sub">Manage the document types available when sending a doc request to suppliers. Changes take effect on the next doc request sent.</div>
    </div>
    <button class="btn" id="btn-add-doctype">+ Add Doc Type</button>
  </div>
  <div id="doctype-list"><div class="loading">Loading...</div></div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
// Version 1.2 | shipment-doc-types.html
// v1.2: Diagnostic console.logs removed (root cause was corrupt sheet data, not JS).
// v1.1: openModal find uses String() comparison. Click handler passes raw attribute.
// Staff-managed shipment doc type settings page.
// Linked from Docs modal on shipments.html.
// Actions: getDocTypesPage, saveDocType, toggleDocTypeActive
if (typeof APP_CONFIG === 'undefined') throw new Error('config.js not loaded');
if (typeof Auth     === 'undefined') throw new Error('auth.js not loaded');
if (typeof API      === 'undefined') throw new Error('api.js not loaded');
if (typeof UI       === 'undefined') throw new Error('ui.js not loaded');

var PAGE_DATA = { doc_types: [] };

function esc(v) {
  return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
(async function() {
  const session = Auth.getSession();
  if (!session) { Auth.logout(); return; }
  document.getElementById('nav-brand').textContent = (session.company && session.company.company_name) || 'Sample Tracker';
  document.getElementById('nav-user').textContent  = session.user ? session.user.name : '';
  document.getElementById('nav-user').onclick = function() { Auth.logout(); };

  try {
    var data = await API.post({ action: 'getDocTypesPage', session_token: Auth.getToken() });
    PAGE_DATA.doc_types = data.doc_types || [];
    renderList();
  } catch (e) {
    document.getElementById('doctype-list').innerHTML =
      '<div class="empty" style="color:var(--error)">Failed to load: ' + esc(e.message || 'error') + '</div>';
  }
})();

// ─── Render ───────────────────────────────────────────────────────────────────
function renderList() {
  var list = document.getElementById('doctype-list');
  var types = PAGE_DATA.doc_types || [];

  if (!types.length) {
    list.innerHTML = '<div class="empty">No doc types yet. Add your first one above.</div>';
    return;
  }

  list.innerHTML = types.map(function(dt) {
    var activeBadge  = dt.is_active
      ? '<span class="badge badge-active">Active</span>'
      : '<span class="badge badge-inactive">Inactive</span>';
    var reqBadge     = dt.default_required
      ? '<span class="badge badge-required">Required</span>'
      : '<span class="badge badge-optional">Optional</span>';
    var extBadge     = dt.extracts
      ? '<span class="badge badge-extracts">⚡ Extract</span>'
      : '';
    var toggleLabel  = dt.is_active ? 'Deactivate' : 'Activate';
    var toggleColor  = dt.is_active ? 'color:var(--error)' : 'color:var(--success)';

    return '<div class="card' + (dt.is_active ? '' : ' inactive-row') + '">' +
      '<div class="card-row">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="card-label">' + esc(dt.label) + ' ' + activeBadge + '</div>' +
          '<div class="card-key">' + esc(dt.key) + ' &nbsp;·&nbsp; Order: ' + (dt.sort_order || '—') +
            ' &nbsp;·&nbsp; ' + reqBadge + (extBadge ? ' &nbsp;' + extBadge : '') +
          '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn btn-ghost btn-sm" data-edit="' + dt.doc_type_id + '">Edit</button>' +
          '<button class="btn btn-ghost btn-sm" data-toggle="' + dt.doc_type_id + '" data-active="' + dt.is_active + '" style="' + toggleColor + '">' + toggleLabel + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ─── Event delegation ─────────────────────────────────────────────────────────
document.addEventListener('click', function(e) {
  var editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    openModal(editBtn.getAttribute('data-edit'));
    return;
  }
  var toggleBtn = e.target.closest('[data-toggle]');
  if (toggleBtn) {
    var id       = toggleBtn.getAttribute('data-toggle');
    var isActive = toggleBtn.getAttribute('data-active') === 'true';
    doToggle(id, !isActive);
    return;
  }
});

document.getElementById('btn-add-doctype').onclick = function() { openModal(null); };

// ─── Modal ────────────────────────────────────────────────────────────────────
function openModal(docTypeId) {
  var dt = docTypeId != null
    ? (PAGE_DATA.doc_types || []).find(function(x) { return String(x.doc_type_id) === String(docTypeId); })
    : null;

  document.getElementById('modal-doctype-title').textContent = dt ? 'Edit Doc Type' : 'Add Doc Type';
  document.getElementById('modal-doctype-error').textContent = '';
  document.getElementById('dt-id').value             = dt ? dt.doc_type_id : '';
  document.getElementById('dt-key').value            = dt ? dt.key        : '';
  document.getElementById('dt-label').value          = dt ? dt.label      : '';
  document.getElementById('dt-sort').value           = dt ? dt.sort_order : (PAGE_DATA.doc_types.length + 1);
  document.getElementById('dt-default-required').checked = dt ? dt.default_required : false;
  document.getElementById('dt-extracts').checked         = dt ? dt.extracts         : false;

  // Key is readonly on edit — key is used as foreign key in existing slots
  document.getElementById('dt-key').readOnly = !!dt;
  document.getElementById('dt-key').style.opacity = dt ? '0.6' : '1';

  document.getElementById('modal-doctype').classList.add('open');
  if (!dt) document.getElementById('dt-key').focus();
  else      document.getElementById('dt-label').focus();
}

document.getElementById('btn-dt-cancel').onclick = function() {
  document.getElementById('modal-doctype').classList.remove('open');
};

document.getElementById('btn-dt-save').onclick = async function() {
  var errEl  = document.getElementById('modal-doctype-error');
  var key    = document.getElementById('dt-key').value.trim();
  var label  = document.getElementById('dt-label').value.trim();
  var sort   = parseInt(document.getElementById('dt-sort').value, 10) || 0;
  var defReq = document.getElementById('dt-default-required').checked;
  var extr   = document.getElementById('dt-extracts').checked;
  var dtId   = document.getElementById('dt-id').value || null;

  errEl.textContent = '';
  if (!key)   { errEl.textContent = 'Key is required.';   return; }
  if (!label) { errEl.textContent = 'Label is required.'; return; }

  // Key format: alphanumeric only, no spaces
  if (!/^[A-Za-z0-9_]+$/.test(key)) {
    errEl.textContent = 'Key must be alphanumeric (letters, numbers, underscores only).';
    return;
  }

  var btn = document.getElementById('btn-dt-save');
  var originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    var data = await API.post({
      action:           'saveDocType',
      session_token:    Auth.getToken(),
      doc_type_id:      dtId,
      key:              key,
      label:            label,
      sort_order:       sort,
      default_required: defReq,
      extracts:         extr
    });
    PAGE_DATA.doc_types = data.doc_types || PAGE_DATA.doc_types;
    document.getElementById('modal-doctype').classList.remove('open');
    renderList();
    showToast(dtId ? 'Doc type updated.' : 'Doc type added.', 'success');
  } catch (e) {
    errEl.textContent = e.message || 'Save failed. Please try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
};

// ─── Toggle active ────────────────────────────────────────────────────────────
async function doToggle(docTypeId, isActive) {
  try {
    var data = await API.post({
      action:        'toggleDocTypeActive',
      session_token: Auth.getToken(),
      doc_type_id:   docTypeId,
      is_active:     isActive
    });
    PAGE_DATA.doc_types = data.doc_types || PAGE_DATA.doc_types;
    renderList();
    showToast(isActive ? 'Doc type activated.' : 'Doc type deactivated.', 'success');
  } catch (e) {
    showToast(e.message || 'Failed.', 'error');
  }
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type === 'error' ? 'var(--error)' : '#1a1a1a';
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}
</script>
</body>
</html>
