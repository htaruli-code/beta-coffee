<script>
// Version 3.4 | drawdowns.html
// v3.3: Approve modal — filters 0-qty bins (already dispatched); shows received_bags vs qty_bags.
// v3.1: Bin allocation section in Approve modal.
//       Bins saved via saveDrawdownLineBins before status update.
//       Lot panel shows allocated bins on Approved/Dispatched drawdowns.
// v3.0: Multi-line drawdown modal. lines[] array submit.
if (typeof APP_CONFIG === 'undefined') throw new Error('config.js not loaded');
if (typeof Auth    === 'undefined') throw new Error('auth.js not loaded');
if (typeof API     === 'undefined') throw new Error('api.js not loaded');
if (!Auth.requireAuth()) throw new Error('Unauthenticated');

const fmtDate = v => UI.formatDate(v);

let expandedRows = new Set();
let currentPage  = 1;
const PAGE_SIZE  = 20;
let PAGE_DATA = {
  drawdowns: [], contracts: [], buyers: [],
  inventory_lots: [], drawdown_statuses: [], lot_substitutions: []
};

(async () => {
  const user    = Auth.getUser();
  const company = Auth.getCompany();
  /* nav brand handled by nav.js */
  /* nav user handled by nav.js */
  /* nav brand/user/logout handled by nav.js */
  try {
    const data = await API.post({ action: 'getDrawdownsPage' });
    PAGE_DATA = data;
    populateFilters();
    renderTable();
    initContractSearch();   // v3.12: wire the New Drawdown contract typeahead
  } catch (e) { showToast('Failed to load.', 'error'); }
})();

// ── Filters ───────────────────────────────────────────────────────────────────

function populateFilters() {
  const fs = document.getElementById('filter-status');
  PAGE_DATA.drawdown_statuses.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    fs.appendChild(o);
  });
  // v3.15: buyer filter is a typeahead (long buyer list). Build the distinct buyer set
  // that appears in drawdowns, then wire the search picker. Hidden #filter-buyer holds the id.
  const fbSeen = new Set();
  const fbBuyers = [];
  PAGE_DATA.drawdowns.forEach(d => {
    const con = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(d.contract_id));
    if (!con || fbSeen.has(String(con.buyer_id))) return;
    fbSeen.add(String(con.buyer_id));
    const buyer = PAGE_DATA.buyers.find(b => String(b.buyer_id) === String(con.buyer_id));
    if (buyer) fbBuyers.push(buyer);
  });
  fbBuyers.sort((a, b) => String(a.company_name).localeCompare(String(b.company_name)));
  initBuyerFilterSearch(fbBuyers);
  fs.onchange = function() { currentPage = 1; renderTable(); };
}

// Typeahead for the buyer filter (mirrors the contract/replacement-lot pickers).
function initBuyerFilterSearch(buyers) {
  const input  = document.getElementById('fb-search-input');
  const drop   = document.getElementById('fb-search-drop');
  const hidden = document.getElementById('filter-buyer');
  const clear  = document.getElementById('fb-search-clear');
  if (!input || !drop || !hidden) return;

  function apply() { currentPage = 1; renderTable(); }

  function showDrop(items) {
    if (!items.length) { drop.classList.remove('open'); drop.innerHTML = ''; return; }
    drop.innerHTML = items.map(b =>
      '<div class="ddc-item" data-id="' + b.buyer_id + '">' + esc(b.company_name) + '</div>'
    ).join('');
    drop.classList.add('open');
    drop.querySelectorAll('.ddc-item').forEach(el => {
      el.onmousedown = e => { e.preventDefault(); pick(String(el.dataset.id), el.textContent); };
    });
  }
  function pick(id, name) {
    hidden.value = id;
    input.value  = name;
    drop.classList.remove('open');
    if (clear) clear.classList.add('show');
    apply();
  }
  function clearSel() {
    hidden.value = '';
    input.value  = '';
    drop.classList.remove('open');
    if (clear) clear.classList.remove('show');
    apply();
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    hidden.value = '';
    if (clear) clear.classList.remove('show');
    // typing with empty box = "All Buyers" (no filter)
    if (!q) { drop.classList.remove('open'); apply(); return; }
    const matches = buyers.filter(b => b.company_name.toLowerCase().includes(q)).slice(0, 15);
    showDrop(matches);
  });

  input.addEventListener('keydown', e => {
    const items  = drop.querySelectorAll('.ddc-item');
    const active = drop.querySelector('.ddc-active');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = active ? (active.nextElementSibling || items[0]) : items[0];
      if (active) active.classList.remove('ddc-active');
      if (next) next.classList.add('ddc-active');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = active ? (active.previousElementSibling || items[items.length-1]) : items[items.length-1];
      if (active) active.classList.remove('ddc-active');
      if (prev) prev.classList.add('ddc-active');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active) pick(active.dataset.id, active.textContent);
    } else if (e.key === 'Escape') {
      drop.classList.remove('open');
    }
  });

  input.addEventListener('blur', () => { setTimeout(() => drop.classList.remove('open'), 150); });
  if (clear) clear.onclick = clearSel;
}

// ── Table render ──────────────────────────────────────────────────────────────

function renderTable() {
  const sf = document.getElementById('filter-status').value;
  const bf = document.getElementById('filter-buyer').value;

  let dds = PAGE_DATA.drawdowns.slice();

  if (sf) dds = dds.filter(d => d.status === sf);
  if (bf) {
    const matchContracts = PAGE_DATA.contracts
      .filter(c => String(c.buyer_id) === String(bf))
      .map(c => String(c.contract_id));
    dds = dds.filter(d => matchContracts.includes(String(d.contract_id)));
  }

  // Sort newest → oldest by drawdown_id (incremental — reliable proxy for creation order)
  dds.sort((a, b) => (b.drawdown_id || 0) - (a.drawdown_id || 0));

  const total      = dds.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = dds.slice(start, start + PAGE_SIZE);

  const wrap    = document.getElementById('dd-wrap');
  const pgBar   = document.getElementById('dd-pagination');
  const pgInfo  = document.getElementById('pg-info');
  const pgPrev  = document.getElementById('pg-prev');
  const pgNext  = document.getElementById('pg-next');

  if (!total) {
    wrap.innerHTML = '<div class="empty">No drawdowns found.</div>';
    pgBar.style.display = 'none';
    return;
  }

  pgInfo.textContent  = 'Page ' + currentPage + ' of ' + totalPages + ' (' + total + ' total)';
  pgPrev.disabled     = currentPage <= 1;
  pgNext.disabled     = currentPage >= totalPages;
  pgBar.style.display = totalPages > 1 ? 'flex' : 'none';

  const rows = page.map(d => {
    const con    = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(d.contract_id));
    const buyer  = con ? PAGE_DATA.buyers.find(b => String(b.buyer_id) === String(con.buyer_id)) : null;

    // Compute total bags from drawdown.lines[] (Lines column removed — bags still shown)
    const ddLines = d.lines || [];
    let totalBags;
    if (ddLines.length > 0) {
      totalBags = ddLines.reduce((s, l) => s + (l.requested_bags || 0), 0);
    } else {
      totalBags = d.requested_bags || 0;
    }

    // Sample name for Bags column tooltip / screen reader context (not shown as column)
    const badgeKey = d.status.toLowerCase();
    const NEXT = { Pending: ['Approved','Cancelled'], Approved: ['Dispatched','Cancelled'], Dispatched: ['Delivered'] };
    const next = NEXT[d.status] || [];

    const firstLineId = ddLines.length > 0
      ? (ddLines[0].contract_line_id || '')
      : (d.contract_line_id || '');

    let actions = next.map(s =>
      `<button class="btn btn-ghost btn-sm" onclick="openStatusModal(${d.drawdown_id},'${d.contract_id}','${firstLineId}','${s}')">${s}</button>`
    ).join('');
    if (d.status === 'Approved' || d.status === 'Dispatched') {
      actions += `<button class="btn btn-ghost btn-sm" onclick="resendDrawdownEmail(${d.drawdown_id})" title="Resend warehouse notification">📧 Resend</button>`;
    }

    const lotSummary = buildDrawdownLotSummary(d);
    const isExpanded = expandedRows.has(String(d.drawdown_id));
    const lotToggle  = lotSummary.lines.length
      ? `<button class="lot-toggle" onclick="toggleDdRow(${d.drawdown_id})">${isExpanded ? '▲' : '▼'} ${lotSummary.lines.length} lot${lotSummary.lines.length !== 1 ? 's' : ''}</button>`
      : '<span style="font-family:var(--font-mono);font-size:0.68rem;color:var(--muted)">—</span>';
    const colCount = 10;  // Lines column removed; Drawdown # added

    let html = `<tr>
      <td><span class="badge badge-${badgeKey}">${esc(d.status)}</span></td>
      <td>${buyer ? esc(buyer.company_name) : '—'}</td>
      <td>${con  ? esc(con.contract_number) : '—'}</td>
      <td style="font-family:var(--font-mono);font-size:0.75rem">${d.drawdown_number ? esc(d.drawdown_number) : '—'}</td>
      <td style="text-align:right;font-family:var(--font-mono)">${fmtBags(totalBags)}</td>
      <td>${lotToggle}</td>
      <td>${fmtDate(d.shipping_date)}</td>
      <td>${fmtDate(d.drawdown_date || d.created_at)}</td>
      <td>${d.outbound_id ? '<a href="outbound.html" style="font-family:var(--font-mono);font-size:0.75rem">OUT-' + d.outbound_id + '</a>' : '—'}</td>
      <td><div class="action-group">${actions}</div></td>
    </tr>`;

    if (isExpanded && lotSummary.lines.length) {
      html += `<tr class="lot-expand-row"><td colspan="${colCount}">
        <div class="lot-panel">
          ${lotSummary.lines.map(line => {
            let lotHtml =
              '<div class="lot-panel-row">' +
                (line.is_sub ? '<span class="lot-sub-tag">SUB</span>' : '') +
                '<span class="lp-bags">' + fmtBags(line.bags) + ' bags' + fmtWeight(line.bags, line.bag_size, line.bag_size_unit) + '</span>' +
                '<span style="color:var(--muted)">·</span>' +
                '<span class="lp-lot">' + esc(line.lot_name) + '</span>' +
                (line.lot_number ? '<span style="color:var(--muted)">Lot ' + esc(line.lot_number) + '</span>' : '') +
                (line.location   ? '<span style="color:var(--muted)">· ' + esc(line.location) + '</span>' : '') +
              '</div>';
            if (line.bin_allocations && line.bin_allocations.length) {
              line.bin_allocations.forEach(function(ba) {
                lotHtml +=
                  '<div class="lp-bin-row">' +
                    '<span style="color:var(--muted)">↳</span>' +
                    '<span class="lp-bin-label">' + esc(ba.bin_label || ('Bin ' + ba.bin_id)) + '</span>' +
                    (ba.bin_location ? '<span style="color:var(--muted)">@ ' + esc(ba.bin_location) + '</span>' : '') +
                    '<span class="lp-bin-bags">' + fmtBags(ba.allocated_bags) + ' bags' + fmtWeight(ba.allocated_bags, line.bag_size, line.bag_size_unit) + '</span>' +
                  '</div>';
              });
            }
            return lotHtml;
          }).join('')}
        </div>
      </td></tr>`;
    }

    return html;
  }).join('');

  wrap.innerHTML = `<table class="dd-table">
    <thead><tr>
      <th>Status</th><th>Buyer</th><th>Contract</th><th>Drawdown #</th>
      <th style="text-align:right">Bags</th><th>Lots</th><th>Ship Date</th><th>Created</th><th>Outbound</th><th>Actions</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function changePage(dir) {
  currentPage += dir;
  renderTable();
  document.getElementById('dd-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Status modal ──────────────────────────────────────────────────────────────

// ── Bin allocation state (v3.1) ───────────────────────────────────────────────
// keyed by drawdown_line_id (or contract_line_id for legacy): { requested_bags, drawdown_line_id, bins[] }
var binAllocState = {};

function renderBinAllocSection(drawdownId) {
  const wrap = document.getElementById('ds-bin-alloc');
  const dd   = PAGE_DATA.drawdowns.find(function(d) { return String(d.drawdown_id) === String(drawdownId); });
  if (!dd) { wrap.style.display = 'none'; return; }

  const ddLines = dd.lines || [];
  const linesToRender = ddLines.length > 0 ? ddLines : (
    dd.contract_line_id ? [{
      drawdown_line_id: '',
      contract_line_id: dd.contract_line_id,
      requested_bags:   dd.requested_bags || 0,
      inventory_lot_id: dd.contract_line ? (dd.contract_line.inventory_lot_id || '') : '',
      contract_line:    dd.contract_line || null,
      bin_allocations:  []
    }] : []
  );

  // Show section only if at least one line has bins configured on its lot
  var anyBins = linesToRender.some(function(dl) {
    const lotId = dl.inventory_lot_id || (dl.contract_line ? dl.contract_line.inventory_lot_id : '');
    const lot   = lotId ? PAGE_DATA.inventory_lots.find(function(l) { return String(l.lot_id) === String(lotId); }) : null;
    return lot && lot.bins && lot.bins.length > 0;
  });
  if (!anyBins) { wrap.style.display = 'none'; return; }

  wrap.style.display = '';
  var html = '<div class="bin-alloc-title">📦 Bin Allocation</div>';

  linesToRender.forEach(function(dl) {
    const lotId = dl.inventory_lot_id || (dl.contract_line ? dl.contract_line.inventory_lot_id : '');
    const lot   = lotId ? PAGE_DATA.inventory_lots.find(function(l) { return String(l.lot_id) === String(lotId); }) : null;
    const bins  = (lot && lot.bins) ? lot.bins : [];
    const lineId = String(dl.drawdown_line_id || dl.contract_line_id);
    const cl     = dl.contract_line;
    const needed = dl.requested_bags || 0;

    // Initialise state — pre-populate from existing bin_allocations if present
    if (!binAllocState[lineId]) {
      const existingAllocs = dl.bin_allocations || [];
      binAllocState[lineId] = {
        requested_bags:   needed,
        drawdown_line_id: dl.drawdown_line_id || '',
        bins: bins
          .filter(function(b) { return b.qty_bags > 0; })  // hide 0-qty bins (already dispatched)
          .map(function(b) {
            const ex = existingAllocs.find(function(a) { return String(a.bin_id) === String(b.bin_id); });
            return { bin_id: b.bin_id, bin_label: b.bin_label, location_name: b.location_name || '', qty_bags: b.qty_bags, received_bags: b.received_bags || b.qty_bags, allocated_bags: ex ? ex.allocated_bags : 0 };
          })
      };
    }

    if (!bins.length) {
      html += '<div class="bin-alloc-group">' +
        '<div class="bin-alloc-group-label">' + esc(cl ? cl.sample_name : lineId) + ' — ' + fmtBags(needed) + ' bags</div>' +
        '<div class="bin-alloc-no-bins">No bins configured — allocation skipped</div>' +
        '</div>';
      return;
    }

    const allocTotal = binAllocState[lineId].bins.reduce(function(s, b) { return s + (b.allocated_bags || 0); }, 0);
    const ok         = Math.abs(allocTotal - needed) <= 0.0001;

    html += '<div class="bin-alloc-group">' +
      '<div class="bin-alloc-group-label">' + esc(cl ? cl.sample_name : lineId) + ' — ' + fmtBags(needed) + ' bags needed</div>';

    binAllocState[lineId].bins.forEach(function(b, i) {
      const availLabel = b.received_bags && b.received_bags !== b.qty_bags
        ? fmtBags(b.qty_bags) + ' avail <span style="color:var(--muted);font-size:0.65rem">of ' + fmtBags(b.received_bags) + ' orig</span>'
        : fmtBags(b.qty_bags) + ' avail';
      html +=
        '<div class="bin-alloc-row">' +
          '<span class="bin-alloc-label">' + esc(b.bin_label || ('Bin ' + b.bin_id)) +
            (b.location_name ? ' <span style="color:var(--muted);font-weight:400">@ ' + esc(b.location_name) + '</span>' : '') +
          '</span>' +
          '<span class="bin-alloc-avail">' + availLabel + '</span>' +
          '<input type="text" inputmode="decimal" class="bin-alloc-input" data-max="' + b.qty_bags + '" ' +
            'value="' + (b.allocated_bags || 0) + '" ' +
            'data-line-id="' + lineId + '" data-bin-idx="' + i + '" ' +
            'oninput="onBinAllocInput(this)" />' +
        '</div>';
    });

    html +=
      '<div class="bin-alloc-total" id="bin-alloc-total-' + lineId + '">' +
        '<span class="' + (ok ? 'bin-alloc-ok' : 'bin-alloc-bad') + '">' +
          Number(allocTotal.toFixed(4)) + ' / ' + Number(needed.toFixed(4)) + ' bags allocated' + (ok ? ' ✓' : '') +
        '</span>' +
      '</div></div>';
  });

  wrap.innerHTML = html;
}

function onBinAllocInput(input) {
  const lineId = input.dataset.lineId;
  const binIdx = parseInt(input.dataset.binIdx);
  var   val    = parseFloat(input.value) || 0;
  if (!binAllocState[lineId]) return;

  const maxBags = binAllocState[lineId].bins[binIdx].qty_bags;
  if (val > maxBags) { val = maxBags; input.value = val; }
  if (val < 0)       { val = 0;       input.value = 0;  }

  binAllocState[lineId].bins[binIdx].allocated_bags = val;

  const needed     = binAllocState[lineId].requested_bags;
  const allocTotal = binAllocState[lineId].bins.reduce(function(s, b) { return s + (b.allocated_bags || 0); }, 0);
  const ok         = Math.abs(allocTotal - needed) <= 0.0001;
  const totalEl    = document.getElementById('bin-alloc-total-' + lineId);
  if (totalEl) {
    totalEl.innerHTML =
      '<span class="' + (ok ? 'bin-alloc-ok' : 'bin-alloc-bad') + '">' +
        Number(allocTotal.toFixed(4)) + ' / ' + Number(needed.toFixed(4)) + ' bags allocated' + (ok ? ' ✓' : '') +
      '</span>';
  }
  checkBinAllocComplete();
  const saveBtn = document.getElementById('btn-ds-save');
  if (saveBtn) saveBtn.disabled = !checkBinAllocComplete();
}
function checkBinAllocComplete() {
  // Returns true if all lines with configured bins are exactly allocated
  return Object.keys(binAllocState).every(function(lineId) {
    const state = binAllocState[lineId];
    if (!state.bins.length) return true; // no bins on lot — skip
    const allocTotal = state.bins.reduce(function(s, b) { return s + (b.allocated_bags || 0); }, 0);
    return Math.abs(allocTotal - state.requested_bags) <= 0.0001;
  });
}

let pendingSubstitutions = [];

function openStatusModal(drawdownId, contractId, lineId, presetStatus) {
  pendingSubstitutions = [];
  binAllocState = {}; // reset bin state for each modal open
  document.getElementById('ds-drawdown-id').value = drawdownId;
  document.getElementById('ds-contract-id').value = contractId;
  document.getElementById('ds-line-id').value     = lineId;

  const ALLOWED = { Pending: ['Approved','Cancelled'], Approved: ['Dispatched','Cancelled'], Dispatched: ['Delivered'] };
  const dd      = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const options = dd ? (ALLOWED[dd.status] || []) : PAGE_DATA.drawdown_statuses;
  document.getElementById('ds-status').innerHTML = options
    .map(s => `<option value="${s}" ${s === presetStatus ? 'selected' : ''}>${s}</option>`)
    .join('');

  const ctx     = document.getElementById('ds-inventory-context');
  const subForm = document.getElementById('ds-sub-form');

  if (presetStatus === 'Approved' && dd) {
    // v3.0: Show inventory context for all drawn lines
    const ddLines = dd.lines || [];
    const con     = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(contractId));

    // Build per-line check using the first short line for the sub form
    let html = '<strong style="color:var(--text)">Inventory check</strong><br>';
    let firstShortLine = null;
    let firstShortLot  = null;

    ddLines.forEach(dl => {
      const cl  = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(dl.contract_line_id)) : null;
      const lot = cl && cl.inventory_lot_id
        ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(cl.inventory_lot_id))
        : null;
      const requested    = dl.requested_bags || 0;
      const primaryAvail = lot ? (lot.available_bags || 0) : 0;
      const existingSubs = (PAGE_DATA.lot_substitutions || [])
        .filter(s => String(s.drawdown_id) === String(drawdownId) && String(s.contract_line_id) === String(dl.contract_line_id));
      const subTotal     = existingSubs.reduce((s, x) => s + (x.bags_count || 0), 0);
      const total        = primaryAvail + subTotal;
      const ok           = total >= requested - 0.0001;

      html += '<div style="margin-top:0.3rem">';
      html += '<span style="font-weight:600">' + esc(cl ? cl.sample_name : dl.contract_line_id) + '</span>';
      html += ' — ' + fmtBags(requested) + ' bags req · ';
      if (ok) {
        html += '<strong style="color:var(--success)">' + fmtBags(total) + ' avail ✓</strong>';
      } else {
        html += '<strong style="color:var(--error)">short by ' + fmtBags(requested - total) + '</strong>';
        if (!firstShortLine) { firstShortLine = dl; firstShortLot = lot; }
      }
      html += '</div>';
    });

    const allOk = !firstShortLine;
    ctx.innerHTML = html;
    ctx.style.display     = 'block';
    ctx.style.borderColor = allOk ? 'rgba(46,125,82,0.3)' : 'rgba(192,57,43,0.3)';
    ctx.style.background  = allOk ? 'rgba(46,125,82,0.05)' : 'rgba(192,57,43,0.05)';

    if (!allOk && firstShortLine) {
      document.getElementById('ds-line-id').value = firstShortLine.contract_line_id;
      document.getElementById('ds-original-lot-id').value = firstShortLot ? firstShortLot.lot_id : '';
      subForm.style.display = 'block';
      const existingSubs = (PAGE_DATA.lot_substitutions || [])
        .filter(s => String(s.drawdown_id) === String(drawdownId) && String(s.contract_line_id) === String(firstShortLine.contract_line_id));
      const requested    = firstShortLine.requested_bags || 0;
      const primaryAvail = firstShortLot ? (firstShortLot.available_bags || 0) : 0;
      refreshSubForm(drawdownId, firstShortLine.contract_line_id, firstShortLot, requested, primaryAvail, existingSubs);
    } else {
      subForm.style.display = 'none';
    }

    // Legacy drawdown (no lines[]): fall back to single-line check
    if (ddLines.length === 0 && lineId) {
      const cl  = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
      const lot = cl && cl.inventory_lot_id
        ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(cl.inventory_lot_id))
        : null;
      document.getElementById('ds-original-lot-id').value = lot ? lot.lot_id : '';
      const requested    = dd.requested_bags || 0;
      const primaryAvail = lot ? (lot.available_bags || 0) : 0;
      const existingSubs = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.drawdown_id) === String(drawdownId));
      const subTotal     = existingSubs.reduce((s, x) => s + (x.bags_count || 0), 0);
      const total        = primaryAvail + subTotal;
      const ok           = total >= requested - 0.0001;
      let legacyHtml = '<strong>Inventory check — ' + requested + ' bags requested</strong><br>';
      if (lot) legacyHtml += 'Primary: ' + esc(lot.sample_name) + ' · <strong>' + primaryAvail + '</strong> avail<br>';
      legacyHtml += ok
        ? '<strong style="color:var(--success)">' + total + ' bags ✓</strong>'
        : '<strong style="color:var(--error)">' + total + ' — short by ' + (requested - total) + '</strong>';
      ctx.innerHTML = html || legacyHtml;
      ctx.style.display     = 'block';
      ctx.style.borderColor = ok ? 'rgba(46,125,82,0.3)' : 'rgba(192,57,43,0.3)';
      ctx.style.background  = ok ? 'rgba(46,125,82,0.05)' : 'rgba(192,57,43,0.05)';
      if (!ok) {
        subForm.style.display = 'block';
        refreshSubForm(drawdownId, lineId, lot, requested, primaryAvail, existingSubs);
      } else {
        subForm.style.display = 'none';
      }
    }
  } else {
    ctx.style.display     = 'none';
    subForm.style.display = 'none';
    document.getElementById('ds-bin-alloc').style.display = 'none';
  }

  // v3.1: Render bin allocation section for Approved; manage save button state
  const saveBtn = document.getElementById('btn-ds-save');
  if (presetStatus === 'Approved') {
    renderBinAllocSection(drawdownId);
    // Disable save if bins are not yet fully allocated
    saveBtn.disabled = !checkBinAllocComplete();
  } else {
    saveBtn.disabled = false;
  }

  document.getElementById('modal-status-title').textContent = 'Move to: ' + presetStatus;
  clearModalError('modal-status');
  document.getElementById('modal-status').classList.add('open');
}

function refreshSubForm(drawdownId, lineId, primaryLot, requested, primaryAvail, existingSubs) {
  const pendingTotal   = pendingSubstitutions.reduce((s, x) => s + (x.bags_count || 0), 0);
  const existingTotal  = existingSubs.reduce((s, x) => s + (x.bags_count || 0), 0);
  const alreadyCovered = primaryAvail + existingTotal + pendingTotal;
  const gap            = Math.max(0, requested - alreadyCovered);
  const origLotId      = document.getElementById('ds-original-lot-id').value;

  const listEl = document.getElementById('ds-sub-list');
  listEl.innerHTML = pendingSubstitutions.map((s, i) => {
    const lot = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
    return '<div class="sub-list-row">' +
      '<span class="sub-bags">' + s.bags_count + ' bags</span>' +
      '<span>from ' + (lot ? esc(lot.sample_name) : 'Lot ' + s.replacement_lot_id) + '</span>' +
      (s.reason ? '<span>— ' + esc(s.reason) + '</span>' : '') +
      '<button class="sub-del" onclick="removePendingSub(' + i + ',\'' + drawdownId + '\',\'' + lineId + '\')" title="Remove">✕</button>' +
    '</div>';
  }).join('');

  const hintEl = document.getElementById('ds-sub-bags-hint');
  hintEl.textContent = gap > 0 ? '(gap: ' + gap + ')' : '';
  document.getElementById('ds-sub-bags').value = '';
  document.getElementById('ds-sub-bags').max   = gap;
  document.getElementById('ds-sub-reason').value = '';

  // v3.13: replacement-lot typeahead (mirrors contract search). Lists candidate lots
  // (not the original, with availability) searchable by SKU + product name + lot number;
  // each row shows SKU · product · qty avail. On select, writes lot_id to hidden #ds-sub-lot
  // and applies the per-lot max (min of available_bags and the remaining gap) to the bags input.
  initReplacementLotSearch(origLotId, gap);
}

function initReplacementLotSearch(origLotId, gap) {
  const input  = document.getElementById('dsl-search-input');
  const drop   = document.getElementById('dsl-search-drop');
  const hidden = document.getElementById('ds-sub-lot');
  const clear  = document.getElementById('dsl-search-clear');
  const bagsEl = document.getElementById('ds-sub-bags');
  const hintEl = document.getElementById('ds-sub-bags-hint');
  if (!input || !drop || !hidden) return;

  // reset
  input.value = ''; hidden.value = '';
  drop.classList.remove('open'); drop.innerHTML = '';
  if (clear) clear.classList.remove('show');

  function candidates() {
    return PAGE_DATA.inventory_lots
      .filter(l => String(l.lot_id) !== String(origLotId) && (l.available_bags || 0) > 0);
  }
  function rowLabel(l) {
    return (l.sku_code ? l.sku_code + ' · ' : '') + (l.sample_name || ('Lot ' + l.lot_id));
  }

  function showDrop(items) {
    if (!items.length) { drop.classList.remove('open'); drop.innerHTML = ''; return; }
    drop.innerHTML = items.map(l =>
      '<div class="ddc-item" data-id="' + l.lot_id + '">' +
        (l.sku_code ? '<span style="color:var(--accent);font-weight:600">' + esc(l.sku_code) + '</span> · ' : '') +
        esc(l.sample_name || ('Lot ' + l.lot_id)) +
        '<div class="ddc-item-sub">' + (l.lot_number ? esc(l.lot_number) + ' · ' : '') +
          fmtBags(l.available_bags) + ' avail</div>' +
      '</div>'
    ).join('');
    drop.classList.add('open');
    drop.querySelectorAll('.ddc-item').forEach(el => {
      el.onmousedown = e => { e.preventDefault(); pick(String(el.dataset.id)); };
    });
  }

  function pick(id) {
    const l = PAGE_DATA.inventory_lots.find(x => String(x.lot_id) === String(id));
    if (!l) return;
    hidden.value = id;
    input.value  = rowLabel(l) + ' · ' + fmtBags(l.available_bags) + ' avail';
    drop.classList.remove('open');
    if (clear) clear.classList.add('show');
    const effectiveMax = Math.min(parseFloat(l.available_bags) || 0, gap);
    bagsEl.max = effectiveMax;
    if (hintEl) hintEl.textContent = effectiveMax > 0 ? '(max ' + fmtBags(effectiveMax) + ')' : '';
  }

  function clearSel() {
    hidden.value = ''; input.value = '';
    drop.classList.remove('open');
    if (clear) clear.classList.remove('show');
    bagsEl.max = gap;
    if (hintEl) hintEl.textContent = gap > 0 ? '(gap: ' + fmtBags(gap) + ')' : '';
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    hidden.value = '';
    if (clear) clear.classList.remove('show');
    if (!q) { drop.classList.remove('open'); return; }
    const matches = candidates().filter(l =>
      ((l.sku_code || '') + ' ' + (l.sample_name || '') + ' ' + (l.lot_number || '')).toLowerCase().includes(q)
    ).slice(0, 15);
    showDrop(matches);
  });

  input.addEventListener('keydown', e => {
    const items  = drop.querySelectorAll('.ddc-item');
    const active = drop.querySelector('.ddc-active');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = active ? (active.nextElementSibling || items[0]) : items[0];
      if (active) active.classList.remove('ddc-active');
      if (next) next.classList.add('ddc-active');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = active ? (active.previousElementSibling || items[items.length-1]) : items[items.length-1];
      if (active) active.classList.remove('ddc-active');
      if (prev) prev.classList.add('ddc-active');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active) pick(active.dataset.id);
    } else if (e.key === 'Escape') {
      drop.classList.remove('open');
    }
  });

  input.addEventListener('blur', () => { setTimeout(() => drop.classList.remove('open'), 150); });
  if (clear) clear.onclick = clearSel;
}

function removePendingSub(idx, drawdownId, lineId) {
  pendingSubstitutions.splice(idx, 1);
  const dd         = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const con        = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(dd && dd.contract_id));
  const ddLine     = (dd && dd.lines || []).find(l => String(l.contract_line_id) === String(lineId));
  const cl         = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
  const lot        = cl && cl.inventory_lot_id ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(cl.inventory_lot_id)) : null;
  const requested  = ddLine ? (ddLine.requested_bags || 0) : (dd ? (dd.requested_bags || 0) : 0);
  const existingSubs = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.drawdown_id) === String(drawdownId) && String(s.contract_line_id) === String(lineId));
  refreshSubForm(drawdownId, lineId, lot, requested, lot ? (lot.available_bags || 0) : 0, existingSubs);
}

function refreshApproveContext(drawdownId, lineId) {
  const dd    = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const con   = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(dd && dd.contract_id));
  const cl    = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
  const lot   = cl && cl.inventory_lot_id ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(cl.inventory_lot_id)) : null;
  const ddLine = (dd && dd.lines || []).find(l => String(l.contract_line_id) === String(lineId));
  const requested = ddLine ? (ddLine.requested_bags || 0) : (dd ? (dd.requested_bags || 0) : 0);
  const existing  = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.drawdown_id) === String(drawdownId) && String(s.contract_line_id) === String(lineId));
  const pending   = pendingSubstitutions.reduce((s, x) => s + (x.bags_count || 0), 0);
  const existTotal = existing.reduce((s, x) => s + (x.bags_count || 0), 0);
  const primaryAvail = lot ? (lot.available_bags || 0) : 0;
  const total     = primaryAvail + existTotal + pending;
  const ok        = total >= requested;
  const ctx       = document.getElementById('ds-inventory-context');
  const subForm   = document.getElementById('ds-sub-form');

  let html = '<strong style="color:var(--text)">Line: ' + esc(cl ? cl.sample_name : lineId) + '</strong> — ' + requested + ' bags<br>';
  if (lot) html += 'Primary: ' + esc(lot.sample_name) + ' · <strong>' + primaryAvail + '</strong> avail<br>';
  existing.forEach(s => {
    const rl = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
    html += '↳ Sub (saved): ' + (rl ? esc(rl.sample_name) : 'Lot ' + s.replacement_lot_id) + ' · <strong>' + s.bags_count + ' bags</strong><br>';
  });
  pendingSubstitutions.forEach(s => {
    const rl = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
    html += '<span style="color:var(--accent)">↳ Sub (pending):</span> ' + (rl ? esc(rl.sample_name) : 'Lot ' + s.replacement_lot_id) + ' · <strong>' + s.bags_count + ' bags</strong><br>';
  });
  html += ok
    ? '<strong style="color:var(--success)">' + total + ' bags ✓</strong>'
    : '<strong style="color:var(--error)">' + total + ' — short by ' + (requested - total) + '</strong>';
  ctx.innerHTML = html;
  ctx.style.borderColor = ok ? 'rgba(46,125,82,0.3)' : 'rgba(192,57,43,0.3)';
  ctx.style.background  = ok ? 'rgba(46,125,82,0.05)' : 'rgba(192,57,43,0.05)';
  subForm.style.display = ok ? 'none' : 'block';
}

document.getElementById('btn-ds-add-sub').onclick = function() {
  const lotSel = document.getElementById('ds-sub-lot');
  const lotId  = lotSel.value;
  const bags   = parseFloat(document.getElementById("ds-sub-bags").value);
  const reason = document.getElementById('ds-sub-reason').value.trim();
  const max    = parseFloat(document.getElementById("ds-sub-bags").max) || 0;
  if (!lotId)                  { showModalError('modal-status', 'Select a replacement lot.'); return; }
  if (isNaN(bags) || bags <= 0) { showModalError('modal-status', 'Bags must be greater than zero.'); return; }
  if (bags > max + 0.0001)     { showModalError('modal-status', 'Bags (' + fmtBags(bags) + ') exceed maximum (' + fmtBags(max) + ').'); return; }
  clearModalError('modal-status');
  pendingSubstitutions.push({ replacement_lot_id: lotId, bags_count: bags, reason: reason });
  const drawdownId = document.getElementById('ds-drawdown-id').value;
  const lineId     = document.getElementById('ds-line-id').value;
  const dd         = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const con        = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(dd && dd.contract_id));
  const cl         = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
  const lot        = cl && cl.inventory_lot_id ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(cl.inventory_lot_id)) : null;
  const ddLine     = (dd && dd.lines || []).find(l => String(l.contract_line_id) === String(lineId));
  const requested  = ddLine ? (ddLine.requested_bags || 0) : (dd ? (dd.requested_bags || 0) : 0);
  const existingSubs = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.drawdown_id) === String(drawdownId) && String(s.contract_line_id) === String(lineId));
  refreshSubForm(drawdownId, lineId, lot, requested, lot ? (lot.available_bags || 0) : 0, existingSubs);
  refreshApproveContext(drawdownId, lineId);
};

document.getElementById('btn-ds-cancel').onclick = () => {
  document.getElementById('modal-status').classList.remove('open');
  document.getElementById('btn-ds-save').disabled = false;
};

document.getElementById('btn-ds-save').onclick = async () => {
  const btn        = document.getElementById('btn-ds-save'); btn.disabled = true;
  const status     = document.getElementById('ds-status').value;
  const drawdownId = document.getElementById('ds-drawdown-id').value;
  const lineId     = document.getElementById('ds-line-id').value;
  const origLotId  = document.getElementById('ds-original-lot-id').value;
  clearModalError('modal-status');

  try {
    // ── v3.1: Save bin allocations first (Approved only) ──────────────────────
    if (status === 'Approved' && Object.keys(binAllocState).length > 0) {
      // Final client-side validation before sending
      if (!checkBinAllocComplete()) {
        showModalError('modal-status', 'Bin allocation incomplete — allocate exactly the requested bags for each line before approving.');
        btn.disabled = false;
        return;
      }
      for (const lineId of Object.keys(binAllocState)) {
        const state = binAllocState[lineId];
        if (!state.bins.length) continue; // no bins on lot — skip
        const binsPayload = state.bins
          .filter(function(b) { return b.allocated_bags > 0; })
          .map(function(b) { return { bin_id: b.bin_id, allocated_bags: b.allocated_bags }; });
        if (!binsPayload.length) continue;
        await API.post({
          action:           'saveDrawdownLineBins',
          drawdown_id:      drawdownId,
          drawdown_line_id: state.drawdown_line_id,
          bins:             binsPayload
        });
      }
    }

    // ── Save pending substitutions (Approved only) ────────────────────────────
    if (status === 'Approved' && pendingSubstitutions.length > 0) {
      for (const sub of pendingSubstitutions) {
        const subData = await API.post({
          action:             'saveLotSubstitution',
          contract_line_id:   lineId,
          original_lot_id:    origLotId,
          replacement_lot_id: sub.replacement_lot_id,
          bags_count:         sub.bags_count,
          reason:             sub.reason || '',
          drawdown_id:        drawdownId
        });
        if (subData.drawdown_subs) {
          subData.drawdown_subs.forEach(s => {
            const idx = PAGE_DATA.lot_substitutions.findIndex(x => String(x.substitution_id) === String(s.substitution_id));
            if (idx >= 0) PAGE_DATA.lot_substitutions[idx] = s; else PAGE_DATA.lot_substitutions.push(s);
          });
        }
        if (subData.original_lot)    mergeLot(subData.original_lot);
        if (subData.replacement_lot) mergeLot(subData.replacement_lot);
      }
      pendingSubstitutions = [];
    }

    const data = await API.post({ action: 'updateDrawdownStatus', drawdown_id: drawdownId, status });
    if (data.drawdowns) {
      data.drawdowns.forEach(d => {
        const idx = PAGE_DATA.drawdowns.findIndex(x => String(x.drawdown_id) === String(d.drawdown_id));
        if (idx >= 0) PAGE_DATA.drawdowns[idx] = d; else PAGE_DATA.drawdowns.push(d);
      });
    }
    if (data.contract_lines) {
      data.contract_lines.forEach(cl => {
        if (!cl) return;
        PAGE_DATA.contracts.forEach(con => {
          if (!con.lines) return;
          const li = con.lines.findIndex(l => String(l.contract_line_id) === String(cl.contract_line_id));
          if (li >= 0) con.lines[li] = cl;
        });
      });
    }
    if (data.inventory_lots) data.inventory_lots.forEach(l => l && mergeLot(l));

    document.getElementById('modal-status').classList.remove('open');
    renderTable();
    const warns = [];
    if (data.invoice_warning) warns.push('Invoice: ' + data.invoice_warning);
    if (data.bin_warning)     warns.push('Bins: ' + data.bin_warning);
    if (data.email_warning)   warns.push('Email: ' + data.email_warning);
    if (warns.length) showToast('Status updated. ' + warns.join(' · '), 'error');
    else showToast('Status updated.', 'success');
  } catch (e) {
    showModalError('modal-status', e.message || 'Update failed.');
    btn.disabled = !checkBinAllocComplete();
  }
};

function mergeLot(updatedLot) {
  if (!updatedLot) return;
  const idx = PAGE_DATA.inventory_lots.findIndex(l => String(l.lot_id) === String(updatedLot.lot_id));
  if (idx >= 0) {
    // Preserve bins[] from existing lot — server lot updates don't re-attach bins
    const existingBins = PAGE_DATA.inventory_lots[idx].bins;
    PAGE_DATA.inventory_lots[idx] = Object.assign({}, updatedLot, {
      bins: updatedLot.bins || existingBins || []
    });
  }
}

// ── New Drawdown Modal — v3.0 multi-line ─────────────────────────────────────

// Internal state: array of line blocks { idx, contract_line_id, requested_bags }
let ddLineCounter = 0;

// FRACTIONAL BAGS: multi-line kg/lb helper — reads bag_size from the selected product option
// (data-bagsize) in the same block, divides weight, writes fractional bags (4dp display).
function ddLineWeightToBags(idx, rawWeight) {
  const wt  = parseFloat(rawWeight);
  const sel = document.querySelector('.line-sel[data-idx="' + idx + '"]');
  const opt = sel && sel.options[sel.selectedIndex];
  const size = opt ? parseFloat(opt.dataset.bagsize) : NaN;
  if (!isFinite(wt) || !isFinite(size) || size <= 0) return; // pick a product (bag size) first
  const input = document.querySelector('.line-bags[data-idx="' + idx + '"]');
  if (input) input.value = Number((wt / size).toFixed(4));
}

function buildLineBlock(idx) {
  const div = document.createElement('div');
  div.className     = 'dd-line-block';
  div.dataset.idx   = idx;
  div.innerHTML = `
    <div class="dd-line-label">Line ${idx + 1}</div>
    <button class="remove-line-btn" type="button" onclick="removeLineBlock(${idx})" title="Remove line">×</button>
    <div class="field-row">
      <div class="field">
        <label>Product <span style="color:var(--error)">*</span></label>
        <select class="line-sel" data-idx="${idx}">
          <option value="">— Select product —</option>
        </select>
      </div>
      <div class="field" style="max-width:200px">
        <label class="line-bags-label-${idx}">Bags <span style="color:var(--error)">*</span></label>
        <div style="display:flex;gap:0.35rem;align-items:center">
          <input type="text" inputmode="decimal" class="line-bags" data-idx="${idx}" placeholder="0" style="width:70px" />
          <input type="text" inputmode="decimal" class="line-wt" data-idx="${idx}" placeholder="or kg/lb" title="Enter weight to auto-fill bags" oninput="ddLineWeightToBags(${idx}, this.value)" style="width:80px;font-size:0.7rem;opacity:0.8" />
        </div>
      </div>
    </div>`;
  return div;
}

function populateLineSelects(contractId) {
  const con = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(contractId));
  const lines = con && con.lines ? con.lines : [];
  document.querySelectorAll('.line-sel').forEach(sel => {
    const idx = sel.dataset.idx;
    sel.innerHTML = '<option value="">— Select product —</option>' +
      lines.map(l => {
        const available = (l.contracted_bags || 0) - (l.drawn_bags || 0);
        if (available <= 0) return '';
        return '<option value="' + l.contract_line_id + '" data-available="' + available + '" data-bagsize="' + (l.bag_size || '') + '" data-bagunit="' + (l.bag_size_unit || 'kg') + '">' +
          esc(l.sample_name) + ' · ' + available + ' bags avail</option>';
      }).join('');

    sel.onchange = function() {
      const opt    = sel.options[sel.selectedIndex];
      const label  = document.querySelector('.line-bags-label-' + idx);
      const input  = document.querySelector('.line-bags[data-idx="' + idx + '"]');
      input.value  = '';
      if (!sel.value || !opt.dataset.available) {
        if (label) label.innerHTML = 'Bags <span style="color:var(--error)">*</span>';
        input.removeAttribute('max');
        return;
      }
      const avail   = parseFloat(opt.dataset.available);
      const bagSize = opt.dataset.bagsize;
      const bagUnit = opt.dataset.bagunit;
      input.max     = avail;
      if (label) label.innerHTML = 'Bags <span style="color:var(--error)">*</span> ' +
        '<span style="color:var(--accent);font-size:0.65rem">(max ' + avail + (bagSize ? ' · ' + bagSize + ' ' + bagUnit + '/bag' : '') + ')</span>';
    };
  });
}

function addLineBlock() {
  const contractId = document.getElementById('new-dd-contract').value;
  if (!contractId) return;

  const wrap = document.getElementById('new-dd-lines-wrap');
  const idx  = ddLineCounter++;
  const block = buildLineBlock(idx);
  wrap.appendChild(block);

  // Populate line select for this block
  const con   = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(contractId));
  const lines = con && con.lines ? con.lines : [];
  const sel   = block.querySelector('.line-sel');
  sel.innerHTML = '<option value="">— Select product —</option>' +
    lines.map(l => {
      const available = (l.contracted_bags || 0) - (l.drawn_bags || 0);
      if (available <= 0) return '';
      return '<option value="' + l.contract_line_id + '" data-available="' + available + '" data-bagsize="' + (l.bag_size || '') + '" data-bagunit="' + (l.bag_size_unit || 'kg') + '">' +
        esc(l.sample_name) + ' · ' + available + ' bags avail</option>';
    }).join('');

  sel.onchange = function() {
    const opt   = sel.options[sel.selectedIndex];
    const label = block.querySelector('.line-bags-label-' + idx);
    const input = block.querySelector('.line-bags[data-idx="' + idx + '"]');
    input.value = '';
    if (!sel.value || !opt.dataset.available) {
      if (label) label.innerHTML = 'Bags <span style="color:var(--error)">*</span>';
      input.removeAttribute('max');
      return;
    }
    const avail   = parseFloat(opt.dataset.available);
    const bagSize = opt.dataset.bagsize;
    const bagUnit = opt.dataset.bagunit;
    input.max     = avail;
    if (label) label.innerHTML = 'Bags <span style="color:var(--error)">*</span> ' +
      '<span style="color:var(--accent);font-size:0.65rem">(max ' + avail + (bagSize ? ' · ' + bagSize + ' ' + bagUnit + '/bag' : '') + ')</span>';
  };

  renumberLineLabels();
}

function removeLineBlock(idx) {
  const block = document.querySelector('.dd-line-block[data-idx="' + idx + '"]');
  if (block) block.remove();
  renumberLineLabels();
}

function renumberLineLabels() {
  document.querySelectorAll('.dd-line-block').forEach((block, i) => {
    const label = block.querySelector('.dd-line-label');
    if (label) label.textContent = 'Line ' + (i + 1);
    const removeBtn = block.querySelector('.remove-line-btn');
    if (removeBtn) removeBtn.style.display = document.querySelectorAll('.dd-line-block').length > 1 ? '' : 'none';
  });
}

document.getElementById('btn-new-drawdown').onclick = function() {
  clearModalError('modal-new-dd');
  ddLineCounter = 0;
  document.getElementById('new-dd-buyer-info').classList.remove('show');
  document.getElementById('new-dd-date').value   = '';
  document.getElementById('new-dd-number').value = '';
  var seqPrev = document.getElementById('new-dd-seq-preview'); if (seqPrev) seqPrev.textContent = '';
  document.getElementById('new-dd-notes').value  = '';
  document.getElementById('new-dd-lines-wrap').innerHTML = '';
  document.getElementById('btn-add-line').disabled = true;

  // v3.12: contract picker is now a typeahead (mirrors New Contracts buyer search).
  // Reset it on each open; selection writes contract_id to the hidden #new-dd-contract
  // and fires its onchange (which loads buyer info, line blocks, seq preview).
  if (window._ddcSearch && window._ddcSearch._clear) window._ddcSearch._clear();

  document.getElementById('modal-new-dd').classList.add('open');
};

// Typeahead driver for the contract picker. Filters active contracts by
// (contract_number + buyer company_name), renders a clickable dropdown, and on
// select writes the id to the hidden field + fires its onchange. Keyboard: ↑/↓/Enter/Esc.
function initContractSearch() {
  const input  = document.getElementById('ddc-search-input');
  const drop   = document.getElementById('ddc-search-drop');
  const hidden = document.getElementById('new-dd-contract');
  const clear  = document.getElementById('ddc-search-clear');
  const tag    = document.getElementById('ddc-search-tag');
  if (!input || !drop || !hidden) return;

  function activeContracts() {
    return PAGE_DATA.contracts.filter(c => c.status === 'Active' || c.status === 'Partially Drawn');
  }
  function buyerName(c) {
    const b = PAGE_DATA.buyers.find(x => String(x.buyer_id) === String(c.buyer_id));
    return b ? b.company_name : '';
  }

  function showDrop(items) {
    if (!items.length) { drop.classList.remove('open'); drop.innerHTML = ''; return; }
    drop.innerHTML = items.map(c =>
      '<div class="ddc-item" data-id="' + c.contract_id + '">' +
        esc(c.contract_number) +
        '<div class="ddc-item-sub">' + esc(buyerName(c) || '—') + ' · ' + esc(c.status) + '</div>' +
      '</div>'
    ).join('');
    drop.classList.add('open');
    drop.querySelectorAll('.ddc-item').forEach(el => {
      el.onmousedown = e => { e.preventDefault(); pick(String(el.dataset.id)); };
    });
  }

  function pick(id) {
    const c = PAGE_DATA.contracts.find(x => String(x.contract_id) === String(id));
    if (!c) return;
    hidden.value = id;
    input.value  = c.contract_number + (buyerName(c) ? ' · ' + buyerName(c) : '');
    drop.classList.remove('open');
    if (clear) clear.classList.add('show');
    if (tag) { tag.textContent = 'Selected: ' + c.contract_number; tag.className = 'ddc-selected-tag'; }
    hidden.onchange();   // fire existing downstream logic
  }

  function clearSel() {
    hidden.value = '';
    input.value  = '';
    drop.classList.remove('open');
    if (clear) clear.classList.remove('show');
    if (tag) { tag.textContent = 'No contract selected'; tag.className = 'ddc-selected-tag empty'; }
    hidden.onchange();
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    hidden.value = '';
    if (clear) clear.classList.remove('show');
    if (tag) { tag.textContent = 'No contract selected'; tag.className = 'ddc-selected-tag empty'; }
    if (!q) { drop.classList.remove('open'); return; }
    const matches = activeContracts().filter(c =>
      ((c.contract_number || '') + ' ' + buyerName(c)).toLowerCase().includes(q)
    ).slice(0, 15);
    showDrop(matches);
  });

  input.addEventListener('keydown', e => {
    const items  = drop.querySelectorAll('.ddc-item');
    const active = drop.querySelector('.ddc-active');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = active ? (active.nextElementSibling || items[0]) : items[0];
      if (active) active.classList.remove('ddc-active');
      if (next) next.classList.add('ddc-active');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = active ? (active.previousElementSibling || items[items.length-1]) : items[items.length-1];
      if (active) active.classList.remove('ddc-active');
      if (prev) prev.classList.add('ddc-active');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active) pick(active.dataset.id);
    } else if (e.key === 'Escape') {
      drop.classList.remove('open');
    }
  });

  input.addEventListener('blur', () => { setTimeout(() => drop.classList.remove('open'), 150); });
  if (clear) clear.onclick = clearSel;

  window._ddcSearch = { _clear: clearSel, _pick: pick };
}

document.getElementById('new-dd-contract').onchange = function() {
  const contractId = this.value;
  const buyerInfo  = document.getElementById('new-dd-buyer-info');
  const addBtn     = document.getElementById('btn-add-line');
  document.getElementById('new-dd-lines-wrap').innerHTML = '';
  ddLineCounter = 0;

  buyerInfo.classList.remove('show');
  addBtn.disabled = !contractId;

  if (!contractId) return;

  const con   = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(contractId));
  const buyer = con ? PAGE_DATA.buyers.find(b => String(b.buyer_id) === String(con.buyer_id)) : null;

  if (buyer && con) {
    buyerInfo.innerHTML =
      'On behalf of: <strong>' + esc(buyer.company_name) + '</strong>' +
      (buyer.contact_person ? ' · ' + esc(buyer.contact_person) : '') +
      '<br>Contract: <strong>' + esc(con.contract_number) + '</strong>' +
      ' · Status: <strong>' + esc(con.status) + '</strong>';
    buyerInfo.classList.add('show');
  }

  // Auto-add first line block
  addLineBlock();

  // v3.10: show the next auto-sequence so staff can confirm it matches the third-party
  // (UnleashedSoftware) before saving. Mirrors the server: count this contract's
  // non-cancelled drawdowns + [seq:N] offset from contract notes.
  updateSeqPreview(con);
};

// Reads [seq:N] from contract notes (offset), counts existing non-cancelled drawdowns
// for the contract, and shows "Next auto #: …/N". Display-only; the server is authoritative.
function updateSeqPreview(con) {
  const el = document.getElementById('new-dd-seq-preview');
  if (!el) return;
  if (!con) { el.textContent = ''; return; }

  // Mirror server getDrawdownNumber + saveDrawdownWithLines exactly:
  //   ref     = drawdown_prefix + (contract_number minus contract_prefix)
  //   count   = existing non-cancelled drawdowns on this contract + [seq:N] offset
  //   number  = count === 0 ? ref : ref + '/' + count   (NO +1; no suffix when 0)
  const m      = con.notes ? String(con.notes).match(/\[seq:\s*(\d+)\s*\]/i) : null;
  const offset = m ? (parseInt(m[1]) || 0) : 0;
  const localCount = (PAGE_DATA.drawdowns || []).filter(function(d) {
    return String(d.contract_id) === String(con.contract_id) && d.status !== 'Cancelled';
  }).length;
  const count = localCount + offset;

  // Build the drawdown reference: replace the contract-number's prefix with the
  // drawdown prefix. Works when contract_prefix is known (exact strip); falls back
  // to stripping the leading alphabetic prefix if only drawdown_prefix is available.
  const cPrefix = con.contract_prefix || '';
  const dPrefix = con.drawdown_prefix || '';
  const cNum    = String(con.contract_number || '');
  let ref = '';
  if (dPrefix) {
    let base = '';
    if (cPrefix && cNum.indexOf(cPrefix) === 0) {
      base = cNum.slice(cPrefix.length);              // exact strip (matches server)
    } else {
      const mm = cNum.match(/^[A-Za-z]+(.*)$/);       // strip leading letters as prefix
      if (mm) base = mm[1];
    }
    // dPrefix may carry a trailing separator (e.g. "DSSNZ-") and base may start with
    // one too (e.g. "-00004017") → avoid a doubled separator.
    if (base && /[-_/ ]$/.test(dPrefix) && /^[-_/ ]/.test(base)) base = base.slice(1);
    if (base) ref = dPrefix + base;
  }

  if (!ref) {
    // drawdown_prefix unavailable — show suffix only, honestly
    el.innerHTML = 'Next auto #: <strong>/' + (count === 0 ? '(none)' : count) + '</strong>'
      + (offset ? ' <span style="color:var(--accent)">(offset +' + offset + ' from Unleashed)</span>' : '')
      + ' — leave blank to auto-number, or type to override.';
    return;
  }

  const number = (count === 0) ? ref : ref + '/' + count;
  el.innerHTML = 'Next auto #: <strong>' + esc(number) + '</strong>'
    + (offset ? ' <span style="color:var(--accent)">(offset +' + offset + ' from Unleashed)</span>' : '')
    + ' — leave blank to use this, or type to override.';
}

document.getElementById('btn-add-line').onclick = addLineBlock;

document.getElementById('btn-new-dd-cancel').onclick = () => {
  document.getElementById('modal-new-dd').classList.remove('open');
};

document.getElementById('btn-new-dd-save').onclick = async function() {
  const btn        = this;
  const contractId = document.getElementById('new-dd-contract').value;
  clearModalError('modal-new-dd');

  if (!contractId) { showModalError('modal-new-dd', 'Please select a contract.'); return; }

  // Collect and validate all line blocks
  const lineBlocks = document.querySelectorAll('.dd-line-block');
  if (!lineBlocks.length) { showModalError('modal-new-dd', 'Add at least one line.'); return; }

  const lines = [];
  let valid   = true;

  lineBlocks.forEach((block, i) => {
    if (!valid) return;
    const sel   = block.querySelector('.line-sel');
    const input = block.querySelector('.line-bags');
    const bags  = parseFloat(input.value);

    if (!sel.value) {
      showModalError('modal-new-dd', 'Line ' + (i + 1) + ': Please select a product.');
      valid = false; return;
    }
    if (isNaN(bags) || bags <= 0) {
      showModalError('modal-new-dd', 'Line ' + (i + 1) + ': Bags must be greater than zero.');
      valid = false; return;
    }
    const available = sel.options[sel.selectedIndex].dataset.available;
    if (available && bags > parseFloat(available) + 0.0001) {
      showModalError('modal-new-dd', 'Line ' + (i + 1) + ': Bags (' + bags + ') exceed available (' + available + ').');
      valid = false; return;
    }
    lines.push({ contract_line_id: sel.value, requested_bags: bags });
  });

  if (!valid) return;

  // Check for duplicate contract lines in the same submission
  const lineIds = lines.map(l => String(l.contract_line_id));
  const uniqueIds = new Set(lineIds);
  if (uniqueIds.size !== lineIds.length) {
    showModalError('modal-new-dd', 'The same product line cannot be added more than once. Combine bags in a single row.');
    return;
  }

  // v3.4: Ship date is required.
  const shipDate = document.getElementById('new-dd-date').value;
  if (!shipDate) { showModalError('modal-new-dd', 'Ship date is required.'); return; }

  btn.disabled = true;
  try {
    const data = await API.post({
      action:        'saveDrawdown',
      contract_id:   contractId,
      lines:         lines,
      shipping_date: shipDate,
      drawdown_number: document.getElementById('new-dd-number').value.trim() || '',
      notes:         document.getElementById('new-dd-notes').value || '',
      status:        'Pending'
    });

    // Merge refreshed drawdowns into PAGE_DATA
    if (data.drawdowns) {
      data.drawdowns.forEach(d => {
        const idx = PAGE_DATA.drawdowns.findIndex(x => String(x.drawdown_id) === String(d.drawdown_id));
        if (idx >= 0) PAGE_DATA.drawdowns[idx] = d; else PAGE_DATA.drawdowns.unshift(d);
      });
    }
    // Merge updated contract lines into their contracts
    if (data.contract_lines) {
      data.contract_lines.forEach(cl => {
        if (!cl) return;
        PAGE_DATA.contracts.forEach(con => {
          if (!con.lines) return;
          const li = con.lines.findIndex(l => String(l.contract_line_id) === String(cl.contract_line_id));
          if (li >= 0) con.lines[li] = cl;
        });
      });
    }

    document.getElementById('modal-new-dd').classList.remove('open');
    renderTable();
    showToast('Drawdown created.', 'success');
  } catch (e) { showModalError('modal-new-dd', e.message || 'Failed to create drawdown.'); }
  finally { btn.disabled = false; }
};

// ── Lot summary ───────────────────────────────────────────────────────────────

function buildDrawdownLotSummary(drawdown) {
  if (drawdown.status === 'Cancelled') return { lines: [] };
  const lines = [];

  // v3.0: use drawdown.lines[] child rows; fall back to legacy header for old data
  const ddLines = drawdown.lines || [];
  const linesToProcess = ddLines.length > 0
    ? ddLines.map(dl => ({
        contract_line_id: dl.contract_line_id,
        requested_bags:   dl.requested_bags || 0,
        inventory_lot_id: dl.inventory_lot_id || (dl.contract_line ? dl.contract_line.inventory_lot_id : ''),
        bin_allocations:  dl.bin_allocations || []  // v3.1
      }))
    : (drawdown.contract_line_id
        ? [{ contract_line_id: drawdown.contract_line_id, requested_bags: drawdown.requested_bags || 0, inventory_lot_id: drawdown.contract_line ? drawdown.contract_line.inventory_lot_id : '', bin_allocations: [] }]
        : []);

  const drawdownIdStr = String(drawdown.drawdown_id);

  linesToProcess.forEach(ltp => {
    // v3.6: resolve bag_size + unit from the contract line (authoritative) for weight display
    let clBagSize = 0, clBagUnit = 'kg';
    for (const c of (PAGE_DATA.contracts || [])) {
      const cl = (c.lines || []).find(l => String(l.contract_line_id) === String(ltp.contract_line_id));
      if (cl) { clBagSize = cl.bag_size || 0; clBagUnit = cl.bag_size_unit || 'kg'; break; }
    }
    const primaryLot = ltp.inventory_lot_id
      ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(ltp.inventory_lot_id))
      : null;

    const drawdownSubs = (PAGE_DATA.lot_substitutions || []).filter(s =>
      s.drawdown_id && String(s.drawdown_id) === drawdownIdStr && String(s.contract_line_id) === String(ltp.contract_line_id)
    );
    const legacySubs = drawdownSubs.length === 0 && ddLines.length === 0
      ? (PAGE_DATA.lot_substitutions || []).filter(s => !s.drawdown_id && String(s.contract_line_id) === String(ltp.contract_line_id))
      : [];
    const subs     = drawdownSubs.length > 0 ? drawdownSubs : legacySubs;
    const subTotal = subs.reduce((s, x) => s + (x.bags_count || 0), 0);
    const primaryBags = Math.max(0, ltp.requested_bags - subTotal);

    // v3.1: Enrich bin_allocations with bin_label from the lot's bins[]
    // v3.22: also carry each bin's LOCATION NAME. The backend (DataService_Contracts v4.9)
    //   now denormalises location_name onto every lot bin, so we read it directly from the
    //   bin row here (the drawdowns page payload has no locations[] to look up, which is why
    //   the earlier PAGE_DATA.locations attempt always resolved blank).
    const lotBinsForLoc = (primaryLot && primaryLot.bins) ? primaryLot.bins : [];
    const enrichedBinAllocs = (ltp.bin_allocations || []).map(function(ba) {
      const binRow = lotBinsForLoc.find(function(b) { return String(b.bin_id) === String(ba.bin_id); });
      const label  = ba.bin_label || (binRow ? binRow.bin_label : ('Bin ' + ba.bin_id));
      const locName = binRow ? (binRow.location_name || '') : '';
      return Object.assign({}, ba, { bin_label: label, bin_location: locName });
    });

    if (primaryLot && primaryBags > 0) {
      lines.push({ is_sub: false, bags: primaryBags, bag_size: clBagSize, bag_size_unit: clBagUnit, lot_name: primaryLot.sample_name || '—', lot_number: primaryLot.lot_number || '', location: primaryLot.location_name || primaryLot.warehouse_name || '', bin_allocations: enrichedBinAllocs });
    } else if (!primaryLot && primaryBags > 0) {
      lines.push({ is_sub: false, bags: primaryBags, bag_size: clBagSize, bag_size_unit: clBagUnit, lot_name: 'No lot linked', lot_number: '', location: '', bin_allocations: [] });
    }

    subs.forEach(s => {
      const replLot = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
      lines.push({ is_sub: true, bags: s.bags_count, bag_size: clBagSize, bag_size_unit: clBagUnit, lot_name: replLot ? replLot.sample_name : 'Lot ' + s.replacement_lot_id, lot_number: replLot ? (replLot.lot_number || '') : '', location: replLot ? (replLot.location_name || replLot.warehouse_name || '') : '', bin_allocations: [] });
    });
  });

  return { lines };
}

function toggleDdRow(drawdownId) {
  const k = String(drawdownId);
  if (expandedRows.has(k)) expandedRows.delete(k); else expandedRows.add(k);
  renderTable();
}

async function resendDrawdownEmail(drawdownId) {
  if (!confirm('Resend warehouse notification email for this drawdown?')) return;
  try {
    const res = await API.post({ action: 'resendDrawdownEmail', drawdown_id: drawdownId });
    showToast((res && res.message) ? res.message : 'Notification email resent.', 'success');
  } catch (e) { showToast(e.message || 'Failed to resend email.', 'error'); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// v3.6: fractional bag display + weight. fmtBags rounds to 4dp, trims trailing zeros (10→"10", 0.0833→"0.0833").
// fmtWeight shows bags×bag_size with its unit, e.g. "2 bags (118 kg)". Weight uses full precision then
// rounds the displayed result to 2dp; omitted when bag_size is unknown/zero.
function fmtBags(n) { return String(Math.round((parseFloat(n)||0) * 10000) / 10000); }
function fmtWeight(bags, bagSize, unit) {
  const b = parseFloat(bags), s = parseFloat(bagSize);
  if (!isFinite(b) || !isFinite(s) || s <= 0) return '';
  const w = Math.round(b * s * 100) / 100;
  return ' <span class="lp-weight">(' + w + ' ' + esc(unit || 'kg') + ')</span>';
}

function showModalError(modalId, message) {
  const errEl = document.querySelector('#' + modalId + ' .modal-error');
  if (!errEl) return;
  errEl.textContent = String(message || 'An error occurred.');
  errEl.classList.add('show');
}
function clearModalError(modalId) {
  const errEl = document.querySelector('#' + modalId + ' .modal-error');
  if (errEl) errEl.classList.remove('show');
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type || '');
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}
