<!DOCTYPE html>
<!-- Version 3.26 | drawdowns.html -->
<!-- v3.26: RESEND now available on Dispatched drawdowns too (was Approved-only) — a silently-failed approval email often gets Dispatched before staff notice, so the 📧 Resend button now shows for Approved AND Dispatched. Resend toast shows the backend message (including any skip reason) instead of a hardcoded "resent". Pairs with Code_Contracts v4.6 (resend guard widened + returns skip reason). -->
<!-- Version 3.25 | drawdowns.html -->
<!-- v3.25: status toast now also surfaces email_warning (Code_Contracts v4.6) — fires on Approve when the warehouse notification email did NOT go out (no warehouse email on file, no fulfillable lines, missing lot, or a send error). The approval still succeeds; the toast tells staff why the email was skipped so they can fix the cause and use Resend. Same pattern as invoice_warning / bin_warning. -->
<!-- Version 3.24 | drawdowns.html -->
<!-- v3.24: Approve/status modal widened 50% (max-width 560px → 840px) via inline override on that modal only — base .modal class untouched, so other modals keep their width. Gives the bin-allocation rows (label + @ location + avail + input) more room so long bin labels and location names don't wrap. Layout only. -->
<!-- Version 3.23 | drawdowns.html -->
<!-- v3.23: APPROVE MODAL bin-allocation rows now show each bin's LOCATION as "<bin_label> @ <location>" beside the label, so staff can't pick a wrong-location bin when a lot has bins in multiple locations (same-labelled bins across locations were indistinguishable in the picker). Reads bin.location_name supplied by DataService_Contracts v4.9 (already denormalised onto lot.bins); carried into binAllocState and rendered. Display-only on the client; requires backend v4.9. -->
<!-- Version 3.22 | drawdowns.html -->
<!-- v3.22: TRACEABILITY FIX — the v3.21 location display resolved blank because the drawdowns page payload has no locations[] array to look up (getDrawdownsPage never returned one; that's inventory.html's payload). Now the backend (DataService_Contracts v4.9) denormalises location_name onto each lot bin, and this page reads bin.location_name directly. The expanded lot panel's per-bin rows show "↳ <bin_label> @ <location> N bags", disambiguating same-labelled bins across locations. Display-only on the client; requires backend v4.9. -->
<!-- Version 3.21 | drawdowns.html -->
<!-- v3.21: TRACEABILITY — the expanded lot panel's per-bin allocation rows now show the bin's LOCATION (resolved from the bin's location_id via PAGE_DATA.locations) as "↳ <bin_label> @ <location> N bags". Fixes the ambiguity when one lot has two bins sharing the same ICO label in different locations (e.g. Continental Terminals NJ vs OPAL South Gate CA) — previously the bin row was indistinguishable between them. Display-only; reuses lot.bins[].location_id + existing locations list. No API/backend/schema change. -->
<!-- Version 3.20 | drawdowns.html -->
<!-- v3.20: status-update toast now also surfaces bin_warning (Code_Contracts v4.4) alongside invoice_warning — fires when a dispatch decremented no bins or the decrement failed. The new DISPATCH allocation guard (BINS_NOT_ALLOCATED) already displays via the existing catch→showModalError path ("Allocate bins before dispatching"), so no extra handling needed there. -->
<!-- Version 3.19 | drawdowns.html -->
<!-- v3.18: prefix-swap fallback handles hyphenated prefixes (e.g. drawdown_prefix "DSSNZ-" + base "-00004017") by dropping the doubled separator. NOTE: if preview still shows "/N" suffix-only, drawdown_prefix is empty in the payload — likely stale getDrawdownsPage cache (4.8 deployed but cached payload predates it) or no drawdown_prefix on the warehouse; see DiagnoseDrawdownPrefix.gs. -->
<!-- v3.17: preview prefix swap now works with drawdown_prefix ALONE — if contract_prefix is present it strips it exactly (matches server); otherwise it strips the leading alphabetic prefix from contract_number and prepends drawdown_prefix. Suffix-only fallback now only when drawdown_prefix itself is absent (needs DataService 4.8 in the payload). -->
<!-- v3.16: FIX Next-auto-# preview was wrong (showed contract prefix DSONZ not drawdown prefix DSSNZ, and count+1 instead of count). Now mirrors server getDrawdownNumber exactly: ref = drawdown_prefix + contract_number-minus-contract_prefix; number = count===0 ? ref : ref+/count (no +1, no suffix at 0). Uses drawdown_prefix/contract_prefix from the v4.8 payload; falls back to suffix-only if prefixes absent. -->
<!-- v3.15: All Buyers filter (drawdowns list toolbar) converted from a plain select to a typeahead search picker (same ddc- pattern) — searchable by buyer name, clickable dropdown, keyboard nav, clear button. Empty box = All Buyers. Selection writes buyer_id to hidden #filter-buyer and re-renders; renderTable unchanged. Pure client-side, no GS change. -->
<!-- v3.14: New Drawdown line block — kg/lb weight input now sits BESIDE the Bags input (flex row) instead of stacked below it, so each Line N block is shorter. Bags 70px + weight 80px side by side; field max-width 200px. Layout only. -->
<!-- v3.13: Add Lot Substitution → Replacement Lot is now a typeahead (same ddc- pattern as the contract picker) instead of a long select. Searchable by SKU + product name + lot number; each row shows SKU · product · qty avail (was product + qty only). Selection writes lot_id to hidden #ds-sub-lot and applies per-lot max (min of available_bags and gap) to the bags input. Add-sub max check now uses 0.0001 tolerance + fmtBags. Pure client-side, no GS change. -->
<!-- v3.12: New Drawdown contract picker rebuilt as a typeahead matching the New Contracts buyer-search pattern (initContractSearch): text input + clickable dropdown of results (contract # with buyer/status subtitle), keyboard nav (↑/↓/Enter/Esc), clear button, selected tag, blur-to-close. Filters active/partially-drawn contracts by contract # + buyer name. Selection writes contract_id to the hidden #new-dd-contract and fires its existing onchange, so all downstream logic (buyer info, line blocks, seq preview, save) is unchanged. Replaces the v3.11 hide-options-in-select approach. Pure client-side, no GS change. -->
<!-- v3.10: New Drawdown modal shows a live "Next auto #" preview when a contract is selected — computes contract/(localCount + [seq:N] offset + 1), mirroring the server, so staff can confirm it matches UnleashedSoftware before saving (or override via the # field). Display-only; offset read from contract notes [seq:N] tag. -->
<!-- v3.9: Drawdown # is now an OPTIONAL editable field in New Drawdown modal. Third-party system is authoritative for numbering and cannot be integrated, so staff enter the third-party number at creation to keep them in sync; left blank = auto-number as before. Server collision-checks a manual number against existing non-cancelled drawdowns. -->
<!-- v3.8: Approve/status modal + bin-alloc now display fractional bags via fmtBags (needed, requested, total avail, short-by, bin avail labels) and the inventory-check ok test uses 0.0001 tolerance (was exact total>=requested). Display+compare only. NOTE: drawdowns SAVED on pre-3.7 (DEV 3.4) stored requested_bags as parseInt(0.5)=0 — those rows show "0 bags needed'; they must be recreated or repaired in the sheet, the display cannot recover a value that was stored as 0. -->
<!-- v3.7: fixed substitution-modal max truncation — effectiveMax used parseInt(dataset.max), zeroing a fractional available (e.g. 0.274→0) and blocking valid sub bags. Now parseFloat. NOTE: the multi-line "Line N: Bags must be greater than zero'" error on fractional input comes from an OLDER deployed 3.x drawdowns; THIS file (multi-line read = parseFloat, input = text/inputmode=decimal) already accepts 0.274. Deploy this to resolve. -->
<!-- v3.6: drawdown lot/bin display now shows FRACTIONAL bags (fmtBags 4dp, trailing zeros trimmed) AND weight next to bag count (fmtWeight = bags×bag_size with unit, e.g. "2 bags (118 kg)"). bag_size+unit resolved from the contract line; weight omitted if bag_size unknown. Applies to Bags column, lot summary rows, and bin-allocation rows. Display-only. -->
<!-- v3.5: FRACTIONAL BAGS merged onto DEV 3.4 — multi-line + substitution + bin-alloc bag inputs text+inputmode=decimal; all bag parseInt→parseFloat; bin-allocation completeness uses 0.0001 tolerance (was exact ===); ceilings parseFloat+tolerance; multi-line kg/lb helper (ddLineWeightToBags) reads per-line data-bagsize; alloc totals display 4dp. Keeps DEV multi-line modal + bin allocation suite. -->
<!-- v3.4: New Drawdown modal — Ship Date now required (label marked *, validated before submit).
     v3.0: Multi-line drawdown support.
     New drawdown modal: repeatable line+bags rows (+ Add Line / × Remove).
     Submit sends lines[] array — one API call per form submit.
     Table: Sample column shows all lines summary; Bags column shows total.
     buildDrawdownLotSummary: loops all drawdown.lines[] child rows.
     Status modal inventory context: loops all drawn lines.
     openStatusModal: passes first line id for substitution form compatibility.
     Response handling: merges drawdowns[] + contract_lines[] arrays from server. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawdowns — Sample Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #fdf8f2; --border: #f0e8da; --accent: #c47a2b;
      --text: #1a1a1a; --muted: #8a7060; --error: #c0392b; --success: #2e7d52;
      --font-mono: 'IBM Plex Mono', monospace; --font-sans: 'Inter', sans-serif;
      --radius: 4px; --transition: 160ms ease; --nav-h: 52px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
    .page { max-width: 1300px; margin: 0 auto; padding: 2rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; }
    .page-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
    .toolbar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--accent); color: #fff; border: none; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 1rem; cursor: pointer; border-radius: var(--radius); transition: background var(--transition); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.7rem; }
    .btn-danger { background: var(--error); color: #fff; }
    select, input { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.5rem 0.875rem; border-radius: var(--radius); outline: none; transition: border-color var(--transition); width: 100%; }
    select:focus, input:focus { border-color: var(--accent); }
    textarea { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.5rem 0.875rem; border-radius: var(--radius); outline: none; transition: border-color var(--transition); width: 100%; resize: vertical; min-height: 64px; }
    textarea:focus { border-color: var(--accent); }
    label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.3rem; font-family: var(--font-mono); }
    .field { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
    .field-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    /* ── Contract search typeahead (v3.12, mirrors New Contracts buyer search) ── */
    .ddc-search-wrap { position: relative; display: block; }
    .ddc-search-wrap input { width: 100%; }
    .ddc-search-drop {
      position: absolute; z-index: 300; top: calc(100% + 2px); left: 0;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      min-width: 100%; max-height: 240px; overflow-y: auto; display: none;
    }
    .ddc-search-drop.open { display: block; }
    .ddc-item {
      padding: 0.4rem 0.75rem; cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--text);
    }
    .ddc-item:last-child { border-bottom: none; }
    .ddc-item:hover, .ddc-item.ddc-active { background: var(--surface); }
    .ddc-item .ddc-item-sub { color: var(--muted); font-size: 0.68rem; }
    .ddc-clear { position: absolute; right: 0.5rem; top: 0.55rem;
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.95rem; padding: 0; line-height: 1; display: none; }
    .ddc-clear.show { display: block; }
    .ddc-selected-tag { display: inline-flex; align-items: center; gap: 0.35rem;
      font-family: var(--font-mono); font-size: 0.72rem; margin-top: 0.3rem;
      background: #edf7f0; color: #1e6640; padding: 0.15rem 0.5rem; border-radius: var(--radius); }
    .ddc-selected-tag.empty { background: transparent; color: var(--muted); padding-left: 0; }
    .dd-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .dd-table th { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0.4rem 0.75rem; border-bottom: 2px solid var(--border); text-align: left; white-space: nowrap; }
    .dd-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .dd-table tr:hover td { background: var(--surface); }
    .badge { display: inline-block; font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 2px; }
    .badge-pending    { background: #f0f0f0; color: #666; }
    .badge-approved   { background: #fef9ec; color: #854f0b; }
    .badge-dispatched { background: #eef4fd; color: #1a5ca8; }
    .badge-delivered  { background: #edf7f0; color: #1e6640; }
    .badge-cancelled  { background: #fdecea; color: #b00020; }
    .action-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .empty { text-align: center; padding: 3rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; width: 100%; max-width: 560px; margin: auto; }
    .modal-title { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; margin-bottom: 1.25rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.25rem; }
    .modal-error { display: none; background: rgba(192, 57, 43, 0.08); border: 1px solid var(--error); color: var(--error); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.65rem 0.85rem; border-radius: var(--radius); margin-bottom: 1rem; }
    .modal-error.show { display: block; }
    .modal-buyer-info { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.65rem 0.85rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.6; display: none; }
    .modal-buyer-info.show { display: block; }
    .modal-buyer-info strong { color: var(--text); }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; font-family: var(--font-mono); font-size: 0.78rem; padding: 0.75rem 1.25rem; border-radius: var(--radius); background: var(--text); color: #fff; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; } .toast.error { background: var(--error); } .toast.success { background: var(--success); }
    .loading { text-align: center; padding: 3rem; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }

    /* ── Pagination ──────────────────────────────────────────────────────────── */
    .pagination { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; font-family: var(--font-mono); font-size: 0.75rem; }
    .pagination button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.65rem; border-radius: var(--radius); cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; }
    .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
    .pagination button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pagination .pg-info { color: var(--muted); padding: 0 0.25rem; }
    .lot-expand-row td { background: #f0f7f4; padding: 0; }
    .lot-panel { padding: 0.45rem 0.75rem 0.55rem 0.75rem; font-family: var(--font-mono); font-size: 0.72rem; }
    .lot-panel-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.2rem 0; border-bottom: 1px dashed var(--border); color: var(--muted); }
    .lot-panel-row:last-child { border-bottom: none; }
    .lot-panel-row .lp-bags { color: var(--text); font-weight: 600; }
    .lot-panel-row .lp-lot  { color: var(--text); }
    .lot-sub-tag { font-size: 0.62rem; color: var(--accent); background: #fff3e0; padding: 0.1rem 0.35rem; border-radius: 2px; font-weight: 600; }
    .lot-toggle { font-family: var(--font-mono); font-size: 0.68rem; cursor: pointer; color: var(--accent); background: none; border: none; padding: 0; text-decoration: underline; white-space: nowrap; }

    /* ── Inline substitution form ───────────────────────────────────────────── */
    .sub-inline { background: var(--surface); border: 1px solid rgba(196,122,43,0.3); border-radius: var(--radius); padding: 0.75rem; margin-top: 0.75rem; }
    .sub-inline-title { font-family: var(--font-mono); font-size: 0.68rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; font-weight: 600; }
    .sub-inline .field-row { margin-bottom: 0.5rem; }
    .sub-inline label { font-size: 0.68rem; }
    .sub-inline input, .sub-inline select { font-size: 0.75rem; padding: 0.35rem 0.6rem; }
    .sub-inline .btn { width: auto; font-size: 0.7rem; padding: 0.35rem 0.75rem; }
    .sub-list { margin-top: 0.5rem; }
    .sub-list-row { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); padding: 0.2rem 0; border-bottom: 1px dashed var(--border); }
    .sub-list-row:last-child { border-bottom: none; }
    .sub-list-row .sub-bags { color: var(--text); font-weight: 600; }
    .sub-list-row .sub-del { background: none; border: none; color: var(--error); cursor: pointer; font-size: 0.8rem; padding: 0; margin-left: auto; }

    /* ── Bin allocation section ─────────────────────────────────────────────── */
    .bin-alloc-section { margin-top: 0.75rem; }
    .bin-alloc-title { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 0.5rem; }
    .bin-alloc-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.75rem; margin-bottom: 0.5rem; }
    .bin-alloc-group-label { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); margin-bottom: 0.4rem; }
    .bin-alloc-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.2rem 0; border-bottom: 1px dashed var(--border); }
    .bin-alloc-row:last-child { border-bottom: none; }
    .bin-alloc-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text); flex: 1; }
    .bin-alloc-avail { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
    .bin-alloc-input { width: 72px !important; min-width: 0; flex-shrink: 0; text-align: right; font-size: 0.75rem !important; padding: 0.25rem 0.45rem !important; }
    .bin-alloc-total { font-family: var(--font-mono); font-size: 0.72rem; margin-top: 0.35rem; text-align: right; }
    .bin-alloc-ok    { color: var(--success); font-weight: 600; }
    .bin-alloc-bad   { color: var(--error);   font-weight: 600; }
    .bin-alloc-no-bins { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-style: italic; padding: 0.3rem 0; }

    /* ── Lot panel allocated bins ────────────────────────────────────────────── */
    .lp-bin-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.15rem 0 0.15rem 1.2rem; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); border-bottom: 1px dashed var(--border); }
    .lp-bin-row:last-child { border-bottom: none; }
    .lp-bin-label { color: var(--text); }
    .lp-bin-bags  { color: var(--accent); font-weight: 600; white-space: nowrap; }
    .lp-weight    { color: var(--muted); font-weight: 400; font-size: 0.92em; }

    /* ── Multi-line rows inside new drawdown modal ──────────────────────────── */
    .dd-line-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.65rem; margin-bottom: 0.65rem; background: var(--surface); position: relative; }
    .dd-line-block .remove-line-btn { position: absolute; top: 0.45rem; right: 0.45rem; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0; line-height: 1; }
    .dd-line-block .remove-line-btn:hover { color: var(--error); }
    .dd-line-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.45rem; }
    .add-line-btn { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); background: none; border: 1px dashed rgba(196,122,43,0.4); border-radius: var(--radius); padding: 0.4rem 0.85rem; cursor: pointer; width: 100%; margin-bottom: 0.75rem; transition: border-color var(--transition); }
    .add-line-btn:hover { border-color: var(--accent); }

    /* ── Multi-line summary in table ────────────────────────────────────────── */
    .sample-multi { font-size: 0.72rem; line-height: 1.6; }
    .sample-multi-row { display: flex; align-items: baseline; gap: 0.35rem; }
    .sample-multi-bags { font-family: var(--font-mono); font-weight: 600; color: var(--text); white-space: nowrap; }
  </style>
</head>
<body>

<div id="app-nav"></div>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Drawdowns</div>
      <div class="page-sub">Approve and dispatch buyer delivery requests</div>
    </div>
    <button class="btn" id="btn-new-drawdown">+ New Drawdown</button>
  </div>
  <div class="toolbar">
    <select id="filter-status" style="width:auto"><option value="">All Statuses</option></select>
    <div class="ddc-search-wrap" id="fb-search-wrap" style="display:inline-block;width:200px;vertical-align:top">
      <input type="text" id="fb-search-input" placeholder="All Buyers — search…" autocomplete="off" />
      <button type="button" class="ddc-clear" id="fb-search-clear" title="Clear">×</button>
      <div class="ddc-search-drop" id="fb-search-drop"></div>
    </div>
    <input type="hidden" id="filter-buyer" value="" />
  </div>
  <div id="dd-wrap"><div class="loading">Loading drawdowns…</div></div>
  <div class="pagination" id="dd-pagination" style="display:none">
    <button id="pg-prev" onclick="changePage(-1)">← Prev</button>
    <span class="pg-info" id="pg-info"></span>
    <button id="pg-next" onclick="changePage(1)">Next →</button>
  </div>
</div>

<!-- ── Status Update Modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-status">
  <div class="modal" style="max-width:840px">
    <div class="modal-title" id="modal-status-title">Update Drawdown</div>
