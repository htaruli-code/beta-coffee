<!DOCTYPE html>
<!-- Version 2.1.4 | drawdowns.html -->
<!-- v2.1.4: Toolbar buyer filter — replaced dropdown with search input + results list (client-side, no extra API call).
             New Drawdown modal — contract dropdown replaced with search input + results list.
             Selected contract_id stored in hidden new-dd-contract-id; buyer info auto-shown on selection.
             Shared initSearch() helper wires both search controls.
   v2.0.5: Contract line dropdown now correctly populated from con.lines[].
   v2.0.4: Added "+ New Drawdown" button and modal. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawdowns — Sample Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #fdf8f2; --border: #f0e8da; --accent: #c47a2b;
      --text: #1a1a1a; --muted: #8a7060; --error: #c0392b; --success: #2e7d52;
      --font-mono: 'IBM Plex Mono', monospace; --font-sans: 'Inter', sans-serif;
      --radius: 4px; --transition: 160ms ease; --nav-h: 52px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
    .nav { position: sticky; top: 0; z-index: 100; height: var(--nav-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; }
    .nav-brand { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 0.25rem; flex: 1; }
    .nav-links a { font-size: 0.82rem; color: var(--muted); text-decoration: none; padding: 0.35rem 0.75rem; border-radius: 5px; transition: background var(--transition), color var(--transition); }
    .nav-links a:hover { background: var(--surface); color: var(--text); }
    .nav-links a.active { background: var(--surface2); color: var(--accent); font-weight: 500; }
    .nav-user { font-size: 0.78rem; color: var(--muted); cursor: pointer; padding: 0.35rem 0.75rem; border-radius: 5px; transition: color var(--transition); }
    .nav-user:hover { color: var(--accent); }
    .page { max-width: 1300px; margin: 0 auto; padding: 2rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; }
    .page-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
    .toolbar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--accent); color: #fff; border: none; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 1rem; cursor: pointer; border-radius: var(--radius); transition: background var(--transition); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.7rem; }
    select, input { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.5rem 0.875rem; border-radius: var(--radius); outline: none; transition: border-color var(--transition); width: 100%; }
    select:focus, input:focus { border-color: var(--accent); }
    textarea { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.5rem 0.875rem; border-radius: var(--radius); outline: none; transition: border-color var(--transition); width: 100%; resize: vertical; min-height: 64px; }
    textarea:focus { border-color: var(--accent); }
    label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.3rem; font-family: var(--font-mono); }
    .field { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
    .field-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .dd-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .dd-table th { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0.4rem 0.75rem; border-bottom: 2px solid var(--border); text-align: left; white-space: nowrap; }
    .dd-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .dd-table tr:hover td { background: var(--surface); }
    .badge { display: inline-block; font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 2px; }
    .badge-pending    { background: #f0f0f0; color: #666; }
    .badge-approved   { background: #fef9ec; color: #854f0b; }
    .badge-dispatched { background: #eef4fd; color: #1a5ca8; }
    .badge-delivered  { background: #edf7f0; color: #1e6640; }
    .badge-cancelled  { background: #fdecea; color: #b00020; }
    .action-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .empty { text-align: center; padding: 3rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; width: 100%; max-width: 480px; margin: auto; }
    .modal-title { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; margin-bottom: 1.25rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.25rem; }
    .modal-error { display: none; background: rgba(192, 57, 43, 0.08); border: 1px solid var(--error); color: var(--error); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.65rem 0.85rem; border-radius: var(--radius); margin-bottom: 1rem; }
    .modal-error.show { display: block; }
    /* v2.0.4: buyer info block inside new drawdown modal */
    .modal-buyer-info { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.65rem 0.85rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.6; display: none; }
    .modal-buyer-info.show { display: block; }
    .modal-buyer-info strong { color: var(--text); }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; font-family: var(--font-mono); font-size: 0.78rem; padding: 0.75rem 1.25rem; border-radius: var(--radius); background: var(--text); color: #fff; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; } .toast.error { background: var(--error); } .toast.success { background: var(--success); }
    .loading { text-align: center; padding: 3rem; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }

    /* ── Drawdown lot panel (v2.0.8) ──────────────────────────────────────── */
    .lot-expand-row td { background: #f0f7f4; padding: 0; }
    .lot-panel { padding: 0.45rem 0.75rem 0.55rem 0.75rem; font-family: var(--font-mono); font-size: 0.72rem; }
    .lot-panel-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.2rem 0; border-bottom: 1px dashed var(--border); color: var(--muted); }
    .lot-panel-row:last-child { border-bottom: none; }
    .lot-panel-row .lp-bags { color: var(--text); font-weight: 600; }
    .lot-panel-row .lp-lot  { color: var(--text); }
    .lot-sub-tag { font-size: 0.62rem; color: var(--accent); background: #fff3e0; padding: 0.1rem 0.35rem; border-radius: 2px; font-weight: 600; }
    .lot-toggle { font-family: var(--font-mono); font-size: 0.68rem; cursor: pointer; color: var(--accent); background: none; border: none; padding: 0; text-decoration: underline; white-space: nowrap; }

    /* ── Inline substitution form in Approve modal (v2.1) ──────────────────── */
    .sub-inline { background: var(--surface); border: 1px solid rgba(196,122,43,0.3); border-radius: var(--radius); padding: 0.75rem; margin-top: 0.75rem; }
    .sub-inline-title { font-family: var(--font-mono); font-size: 0.68rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; font-weight: 600; }
    .sub-inline .field-row { margin-bottom: 0.5rem; }
    .sub-inline label { font-size: 0.68rem; }
    .sub-inline input, .sub-inline select { font-size: 0.75rem; padding: 0.35rem 0.6rem; }
    .sub-inline .btn { width: auto; font-size: 0.7rem; padding: 0.35rem 0.75rem; }
    .sub-list { margin-top: 0.5rem; }
    .sub-list-row { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); padding: 0.2rem 0; border-bottom: 1px dashed var(--border); }
    .sub-list-row:last-child { border-bottom: none; }
    .sub-list-row .sub-bags { color: var(--text); font-weight: 600; }
    .sub-list-row .sub-del { background: none; border: none; color: var(--error); cursor: pointer; font-size: 0.8rem; padding: 0; margin-left: auto; }
    /* ── Generic search-with-dropdown (v2.1.4) ──────────────────────────────── */
    .srch-wrap { position: relative; }
    .srch-wrap input { width: 180px; }
    .srch-drop {
      position: absolute; z-index: 300; top: calc(100% + 2px); left: 0;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      min-width: 240px; max-height: 220px; overflow-y: auto; display: none;
    }
    .srch-drop.open { display: block; }
    .srch-item {
      padding: 0.4rem 0.75rem; cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--text);
    }
    .srch-item:last-child { border-bottom: none; }
    .srch-item:hover, .srch-item.srch-active { background: var(--surface); }
    .srch-item .srch-sub { font-size: 0.68rem; color: var(--muted); margin-top: 0.1rem; }
    .srch-clear { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.85rem; padding: 0; line-height: 1; display: none; }
    .srch-clear.show { display: block; }
    /* full-width variant for modals */
    .srch-wrap.srch-full { display: block; }
    .srch-wrap.srch-full input { width: 100%; }
    .srch-wrap.srch-full .srch-drop { min-width: 100%; }

  </style>
</head>

<script>
// Version 2.1.4 | drawdowns.html
// v2.1.4: Toolbar buyer filter — replaced dropdown with search input + results list (client-side, no extra API call).
//          New Drawdown modal — contract dropdown replaced with search input + results list.
//          Shared initSearch() helper; selectContract() extracted to handle buyer info + line population.
// v2.1.3: isNaN guards on bags fields. dates via UI.formatDate. page-width 1300px.
const fmtDate = v => UI.formatDate(v);
if (typeof APP_CONFIG === 'undefined') throw new Error('config.js not loaded');
if (typeof Auth    === 'undefined') throw new Error('auth.js not loaded');
if (typeof API     === 'undefined') throw new Error('api.js not loaded');
if (!Auth.requireAuth()) throw new Error('Unauthenticated');

let expandedRows = new Set();
let PAGE_DATA = { drawdowns: [], contracts: [], buyers: [], inventory_lots: [], drawdown_statuses: [], lot_substitutions: [] };

(async () => {
  const user = Auth.getUser(); const company = Auth.getCompany();
  document.getElementById('nav-brand').textContent = company ? company.company_name : 'Sample Tracker';
  document.getElementById('nav-user').textContent  = user ? user.name : '';
  document.getElementById('nav-user').onclick = () => { Auth.logout(); window.location = 'login.html'; };
  try {
    const data = await API.post({ action: 'getDrawdownsPage' });
    PAGE_DATA = data;
    populateFilters();
    renderTable();
  } catch (e) { showToast('Failed to load.', 'error'); }
})();

function populateFilters() {
  const fs = document.getElementById('filter-status');
  PAGE_DATA.drawdown_statuses.forEach(s => {
    const o = document.createElement('option'); o.value = s; o.textContent = s; fs.appendChild(o);
  });
  fs.onchange = renderTable;

  // Build buyer list from buyers who actually have drawdowns
  const activeBuyerIds = new Set();
  PAGE_DATA.drawdowns.forEach(d => {
    const con = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(d.contract_id));
    if (con) activeBuyerIds.add(String(con.buyer_id));
  });
  const buyerList = PAGE_DATA.buyers.filter(b => activeBuyerIds.has(String(b.buyer_id)));

  initSearch({
    inputId:  'filter-buyer-input',
    dropId:   'filter-buyer-drop',
    hiddenId: 'filter-buyer',
    clearId:  'filter-buyer-clear',
    items:    () => buyerList,
    label:    b => b.company_name,
    value:    b => String(b.buyer_id),
    onSelect: renderTable,
    onClear:  renderTable
  });
}

// ── Shared search-with-dropdown helper (v2.1.4) ───────────────────────────────
// opts: { inputId, dropId, hiddenId, clearId?, items(), label(), value(), subLabel?(), onSelect, onClear }
// items() called lazily so PAGE_DATA is always fresh.
function initSearch(opts) {
  const input    = document.getElementById(opts.inputId);
  const drop     = document.getElementById(opts.dropId);
  const hidden   = document.getElementById(opts.hiddenId);
  const clearBtn = opts.clearId ? document.getElementById(opts.clearId) : null;

  function renderDrop(list) {
    if (!list.length) { drop.classList.remove('open'); return; }
    drop.innerHTML = list.map(item =>
      '<div class="srch-item" data-val="' + esc(opts.value(item)) + '">' +
        esc(opts.label(item)) +
        (opts.subLabel ? '<div class="srch-sub">' + esc(opts.subLabel(item)) + '</div>' : '') +
      '</div>'
    ).join('');
    drop.classList.add('open');
    drop.querySelectorAll('.srch-item').forEach(el => {
      el.onmousedown = e => {
        e.preventDefault();
        selectItem(el.dataset.val, el.querySelector('.srch-item > :first-child')
          ? el.firstChild.textContent.trim()
          : el.textContent.trim());
      };
    });
  }

  function selectItem(val, label) {
    hidden.value = val;
    input.value  = label;
    drop.classList.remove('open');
    if (clearBtn) clearBtn.classList.add('show');
    if (opts.onSelect) opts.onSelect(val);
  }

  function clearItem() {
    hidden.value = '';
    input.value  = '';
    drop.classList.remove('open');
    if (clearBtn) clearBtn.classList.remove('show');
    if (opts.onClear) opts.onClear();
  }

  input.addEventListener('input', () => {
    hidden.value = '';
    if (clearBtn) clearBtn.classList.remove('show');
    const q = input.value.trim().toLowerCase();
    if (!q) { drop.classList.remove('open'); if (opts.onClear) opts.onClear(); return; }
    const matches = opts.items().filter(item => opts.label(item).toLowerCase().includes(q)).slice(0, 12);
    renderDrop(matches);
  });

  input.addEventListener('keydown', e => {
    const items  = drop.querySelectorAll('.srch-item');
    const active = drop.querySelector('.srch-active');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = active ? (active.nextElementSibling || items[0]) : items[0];
      if (active) active.classList.remove('srch-active');
      if (next)   next.classList.add('srch-active');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = active ? (active.previousElementSibling || items[items.length - 1]) : items[items.length - 1];
      if (active) active.classList.remove('srch-active');
      if (prev)   prev.classList.add('srch-active');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active) selectItem(active.dataset.val, active.textContent.trim());
    } else if (e.key === 'Escape') {
      drop.classList.remove('open');
    }
  });

  input.addEventListener('blur', () => { setTimeout(() => drop.classList.remove('open'), 150); });
  if (clearBtn) clearBtn.onclick = clearItem;

  // Expose for programmatic pre-fill
  input._selectItem = selectItem;
  input._clearItem  = clearItem;
}

function renderTable() {
  const sf = document.getElementById('filter-status').value;
  const bf = document.getElementById('filter-buyer').value;

  let dds = PAGE_DATA.drawdowns;
  if (sf) dds = dds.filter(d => d.status === sf);
  if (bf) {
    const matchContracts = PAGE_DATA.contracts.filter(c => String(c.buyer_id) === String(bf)).map(c => String(c.contract_id));
    dds = dds.filter(d => matchContracts.includes(String(d.contract_id)));
  }

  const wrap = document.getElementById('dd-wrap');
  if (!dds.length) { wrap.innerHTML = '<div class="empty">No drawdowns found.</div>'; return; }

  const rows = dds.map(d => {
    const con    = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(d.contract_id));
    const buyer  = con ? PAGE_DATA.buyers.find(b => String(b.buyer_id) === String(con.buyer_id)) : null;
    const line   = d.contract_line;
    const sample = line ? line.sample_name : '—';
    const badgeKey = d.status.toLowerCase();

    const NEXT = { 'Pending': ['Approved','Cancelled'], 'Approved': ['Dispatched','Cancelled'], 'Dispatched': ['Delivered'] };
    const next = NEXT[d.status] || [];
    let actions = next.map(s =>
      `<button class="btn btn-ghost btn-sm" onclick="openStatusModal(${d.drawdown_id}, '${d.contract_id}', '${d.contract_line_id}', '${s}')">${s}</button>`
    ).join('');
    // v2.1.1: Resend warehouse notification email for Approved drawdowns
    if (d.status === 'Approved') {
      actions += `<button class="btn btn-ghost btn-sm" onclick="resendDrawdownEmail(${d.drawdown_id})" title="Resend warehouse notification email">📧 Resend</button>`;
    }

    const lotSummary = buildDrawdownLotSummary(d);
    const isExpanded = expandedRows.has(String(d.drawdown_id));
    const lotToggle  = lotSummary.lines.length
      ? `<button class="lot-toggle" onclick="toggleDdRow(${d.drawdown_id})">${isExpanded ? '▲' : '▼'} ${lotSummary.lines.length} lot${lotSummary.lines.length !== 1 ? 's' : ''}</button>`
      : '<span style="font-family:var(--font-mono);font-size:0.68rem;color:var(--muted)">—</span>';
    const colCount   = 10;

    let html = `<tr>
      <td><span class="badge badge-${badgeKey}">${esc(d.status)}</span></td>
      <td>${buyer ? esc(buyer.company_name) : '—'}</td>
      <td>${con  ? esc(con.contract_number) : '—'}</td>
      <td>${esc(sample)}</td>
      <td style="text-align:right;font-family:var(--font-mono)">${d.requested_bags}</td>
      <td>${lotToggle}</td>
      <td>${fmtDate(d.shipping_date)}</td>
      <td>${fmtDate(d.drawdown_date || d.created_at)}</td>
      <td>${d.outbound_id ? '<a href="outbound.html" style="font-family:var(--font-mono);font-size:0.75rem">OUT-' + d.outbound_id + '</a>' : '—'}</td>
      <td><div class="action-group">${actions}</div></td>
    </tr>`;

    if (isExpanded && lotSummary.lines.length) {
      html += `<tr class="lot-expand-row"><td colspan="${colCount}">
        <div class="lot-panel">
          ${lotSummary.lines.map(line => `<div class="lot-panel-row">
            ${line.is_sub ? '<span class="lot-sub-tag">SUB</span>' : ''}
            <span class="lp-bags">${line.bags} bags</span>
            <span style="color:var(--muted)">·</span>
            <span class="lp-lot">${esc(line.lot_name)}</span>
            ${line.lot_number ? '<span style="color:var(--muted)">Lot ' + esc(line.lot_number) + '</span>' : ''}
            ${line.location ? '<span style="color:var(--muted)">· ' + esc(line.location) + '</span>' : ''}
          </div>`).join('')}
        </div>
      </td></tr>`;
    }

    return html;
  }).join('');

  wrap.innerHTML = `<table class="dd-table">
    <thead><tr>
      <th>Status</th><th>Buyer</th><th>Contract</th><th>Sample</th>
      <th style="text-align:right">Bags</th><th>Lots</th><th>Ship Date</th><th>Created</th><th>Outbound</th><th>Actions</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── Status update modal ───────────────────────────────────────────────────────

// Drawdown-level subs recorded in this session (before saving status)
// [{ replacement_lot_id, bags_count, reason }]
let pendingSubstitutions = [];

function openStatusModal(drawdownId, contractId, lineId, presetStatus) {
  pendingSubstitutions = [];
  document.getElementById('ds-drawdown-id').value   = drawdownId;
  document.getElementById('ds-contract-id').value   = contractId;
  document.getElementById('ds-line-id').value        = lineId;

  const ALLOWED = { 'Pending': ['Approved','Cancelled'], 'Approved': ['Dispatched','Cancelled'], 'Dispatched': ['Delivered'] };
  const dd      = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const options = dd ? (ALLOWED[dd.status] || []) : PAGE_DATA.drawdown_statuses;
  document.getElementById('ds-status').innerHTML = options.map(s =>
    `<option value="${s}" ${s === presetStatus ? 'selected' : ''}>${s}</option>`
  ).join('');

  // ── Inventory context — shown only when approving ──────────────────────────
  const ctx     = document.getElementById('ds-inventory-context');
  const subForm = document.getElementById('ds-sub-form');
  if (presetStatus === 'Approved' && dd) {
    const con  = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(contractId));
    const line = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
    const lot  = line && line.inventory_lot_id
      ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(line.inventory_lot_id))
      : null;

    // Store original lot id for substitution form
    document.getElementById('ds-original-lot-id').value = lot ? lot.lot_id : '';

    const requested    = dd.requested_bags || 0;
    const primaryAvail = lot ? (lot.available_bags || 0) : 0;
    // v2.1: subs filtered to THIS drawdown only
    const existingSubs = (PAGE_DATA.lot_substitutions || [])
      .filter(s => String(s.drawdown_id) === String(drawdownId));
    const subTotal     = existingSubs.reduce((s, x) => s + (x.bags_count || 0), 0) +
                         pendingSubstitutions.reduce((s, x) => s + (x.bags_count || 0), 0);
    const total        = primaryAvail + subTotal;
    const short        = Math.max(0, requested - total);
    const ok           = total >= requested;

    let html = '<strong style="color:var(--text)">Inventory check — ' + requested + ' bags requested</strong><br>';
    if (lot) {
      html += '<span style="color:var(--muted)">Primary lot:</span> ' + esc(lot.sample_name) +
        ' &nbsp;·&nbsp; <strong>' + primaryAvail + '</strong> available<br>';
    } else {
      html += '<span style="color:var(--muted)">Primary lot:</span> <span style="color:var(--error)">no lot linked</span><br>';
    }
    existingSubs.forEach(s => {
      const replLot = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
      html += '<span style="color:var(--muted)">↳ Sub (saved):</span> ' +
        (replLot ? esc(replLot.sample_name) : 'Lot ' + s.replacement_lot_id) +
        ' &nbsp;·&nbsp; <strong>' + s.bags_count + ' bags</strong><br>';
    });
    html += '<span style="color:var(--muted)">Total coverable:</span> ';
    if (ok) {
      html += '<strong style="color:var(--success)">' + total + ' bags ✓</strong>';
    } else {
      html += '<strong style="color:var(--error)">' + total + ' bags — short by ' + short + '</strong>';
    }
    ctx.innerHTML = html;
    ctx.style.display = 'block';
    ctx.style.borderColor = ok ? 'rgba(46,125,82,0.3)' : 'rgba(192,57,43,0.3)';
    ctx.style.background  = ok ? 'rgba(46,125,82,0.05)' : 'rgba(192,57,43,0.05)';

    // Show sub form if short, hide if covered
    if (!ok) {
      subForm.style.display = 'block';
      refreshSubForm(drawdownId, lineId, lot, requested, primaryAvail, existingSubs);
    } else {
      subForm.style.display = 'none';
    }
  } else {
    ctx.style.display     = 'none';
    subForm.style.display = 'none';
  }

  document.getElementById('modal-status-title').textContent = 'Move to: ' + presetStatus;
  clearModalError('modal-status');
  document.getElementById('modal-status').classList.add('open');
}

function refreshSubForm(drawdownId, lineId, primaryLot, requested, primaryAvail, existingSubs) {
  const pendingTotal   = pendingSubstitutions.reduce((s, x) => s + (x.bags_count || 0), 0);
  const existingTotal  = existingSubs.reduce((s, x) => s + (x.bags_count || 0), 0);
  const alreadyCovered = primaryAvail + existingTotal + pendingTotal;
  const gap            = Math.max(0, requested - alreadyCovered);
  const origLotId      = document.getElementById('ds-original-lot-id').value;

  // Pending sub list
  const listEl = document.getElementById('ds-sub-list');
  if (pendingSubstitutions.length) {
    listEl.innerHTML = pendingSubstitutions.map((s, i) => {
      const lot = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
      return '<div class="sub-list-row">' +
        '<span class="sub-bags">' + s.bags_count + ' bags</span>' +
        '<span>from ' + (lot ? esc(lot.sample_name) : 'Lot ' + s.replacement_lot_id) + '</span>' +
        (s.reason ? '<span>— ' + esc(s.reason) + '</span>' : '') +
        '<button class="sub-del" onclick="removePendingSub(' + i + ',\'' + drawdownId + '\',\'' + lineId + '\')" title="Remove">✕</button>' +
      '</div>';
    }).join('');
  } else {
    listEl.innerHTML = '';
  }

  // Replacement lot dropdown — exclude original lot, only lots with available bags
  const lotSel = document.getElementById('ds-sub-lot');
  lotSel.innerHTML = '<option value="">— Select lot —</option>' +
    PAGE_DATA.inventory_lots
      .filter(l => String(l.lot_id) !== String(origLotId) && (l.available_bags || 0) > 0)
      .map(l => {
        const effectiveMax = Math.min(l.available_bags, gap);
        return '<option value="' + l.lot_id + '" data-avail="' + l.available_bags + '" data-max="' + effectiveMax + '">' +
          esc(l.sample_name) + ' · ' + l.available_bags + ' avail' +
          '</option>';
      }).join('');

  // Bags hint
  const hintEl = document.getElementById('ds-sub-bags-hint');
  hintEl.textContent = gap > 0 ? '(gap: ' + gap + ')' : '';
  document.getElementById('ds-sub-bags').value = '';
  document.getElementById('ds-sub-bags').max   = gap;
  document.getElementById('ds-sub-reason').value = '';

  // Update lot onchange for per-lot max
  lotSel.onchange = function() {
    const opt = lotSel.options[lotSel.selectedIndex];
    const effectiveMax = opt && opt.dataset.max ? parseInt(opt.dataset.max) : gap;
    document.getElementById('ds-sub-bags').max = effectiveMax;
    hintEl.textContent = effectiveMax > 0 ? '(max ' + effectiveMax + ')' : '';
  };
}

function removePendingSub(idx, drawdownId, lineId) {
  pendingSubstitutions.splice(idx, 1);
  const dd      = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const con     = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(dd.contract_id));
  const line    = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
  const lot     = line && line.inventory_lot_id ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(line.inventory_lot_id)) : null;
  const existingSubs = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.drawdown_id) === String(drawdownId));
  const primaryAvail = lot ? (lot.available_bags || 0) : 0;
  refreshSubForm(drawdownId, lineId, lot, dd.requested_bags || 0, primaryAvail, existingSubs);
  refreshApproveContext(drawdownId, lineId);
}

document.getElementById('btn-ds-add-sub').onclick = function() {
  const lotSel  = document.getElementById('ds-sub-lot');
  const lotId   = lotSel.value;
  const bags    = parseInt(document.getElementById('ds-sub-bags').value);  // v2.1.3: no || 0
  const reason  = document.getElementById('ds-sub-reason').value.trim();
  const max     = parseInt(document.getElementById('ds-sub-bags').max) || 0;
  if (!lotId) { showModalError('modal-status', 'Select a replacement lot.'); return; }
  if (isNaN(bags) || bags <= 0) { showModalError('modal-status', 'Bags must be a whole number greater than zero.'); return; }
  if (bags > max) { showModalError('modal-status', 'Bags (' + bags + ') exceed maximum (' + max + ').'); return; }
  clearModalError('modal-status');
  pendingSubstitutions.push({ replacement_lot_id: lotId, bags_count: bags, reason: reason });
  const drawdownId = document.getElementById('ds-drawdown-id').value;
  const lineId     = document.getElementById('ds-line-id').value;
  const dd         = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const con        = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(dd.contract_id));
  const line       = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
  const lot        = line && line.inventory_lot_id ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(line.inventory_lot_id)) : null;
  const existingSubs = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.drawdown_id) === String(drawdownId));
  refreshSubForm(drawdownId, lineId, lot, dd.requested_bags || 0, lot ? (lot.available_bags || 0) : 0, existingSubs);
  refreshApproveContext(drawdownId, lineId);
};

function refreshApproveContext(drawdownId, lineId) {
  const dd       = PAGE_DATA.drawdowns.find(d => String(d.drawdown_id) === String(drawdownId));
  const con      = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(dd && dd.contract_id));
  const line     = con ? (con.lines || []).find(l => String(l.contract_line_id) === String(lineId)) : null;
  const lot      = line && line.inventory_lot_id ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(line.inventory_lot_id)) : null;
  const existing = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.drawdown_id) === String(drawdownId));
  const pending  = pendingSubstitutions.reduce((s, x) => s + (x.bags_count || 0), 0);
  const existTotal = existing.reduce((s, x) => s + (x.bags_count || 0), 0);
  const primaryAvail = lot ? (lot.available_bags || 0) : 0;
  const total    = primaryAvail + existTotal + pending;
  const requested = dd ? (dd.requested_bags || 0) : 0;
  const ok       = total >= requested;
  const ctx      = document.getElementById('ds-inventory-context');
  const subForm  = document.getElementById('ds-sub-form');

  let html = '<strong style="color:var(--text)">Inventory check — ' + requested + ' bags requested</strong><br>';
  if (lot) html += '<span style="color:var(--muted)">Primary lot:</span> ' + esc(lot.sample_name) + ' &nbsp;·&nbsp; <strong>' + primaryAvail + '</strong> available<br>';
  existing.forEach(s => {
    const rl = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
    html += '<span style="color:var(--muted)">↳ Sub (saved):</span> ' + (rl ? esc(rl.sample_name) : 'Lot ' + s.replacement_lot_id) + ' &nbsp;·&nbsp; <strong>' + s.bags_count + ' bags</strong><br>';
  });
  pendingSubstitutions.forEach(s => {
    const rl = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
    html += '<span style="color:var(--accent)">↳ Sub (pending):</span> ' + (rl ? esc(rl.sample_name) : 'Lot ' + s.replacement_lot_id) + ' &nbsp;·&nbsp; <strong>' + s.bags_count + ' bags</strong><br>';
  });
  html += '<span style="color:var(--muted)">Total coverable:</span> ';
  html += ok
    ? '<strong style="color:var(--success)">' + total + ' bags ✓</strong>'
    : '<strong style="color:var(--error)">' + total + ' — short by ' + (requested - total) + '</strong>';
  ctx.innerHTML = html;
  ctx.style.borderColor = ok ? 'rgba(46,125,82,0.3)' : 'rgba(192,57,43,0.3)';
  ctx.style.background  = ok ? 'rgba(46,125,82,0.05)' : 'rgba(192,57,43,0.05)';
  subForm.style.display = ok ? 'none' : 'block';
}

document.getElementById('btn-ds-cancel').onclick = () => document.getElementById('modal-status').classList.remove('open');

document.getElementById('btn-ds-save').onclick = async () => {
  const btn        = document.getElementById('btn-ds-save'); btn.disabled = true;
  const status     = document.getElementById('ds-status').value;
  const drawdownId = document.getElementById('ds-drawdown-id').value;
  const lineId     = document.getElementById('ds-line-id').value;
  const origLotId  = document.getElementById('ds-original-lot-id').value;
  clearModalError('modal-status');

  try {
    // v2.1: Save any pending substitutions first (drawdown-level, before approving)
    if (status === 'Approved' && pendingSubstitutions.length > 0) {
      for (const sub of pendingSubstitutions) {
        const subData = await API.post({
          action:             'saveLotSubstitution',
          contract_line_id:   lineId,
          original_lot_id:    origLotId,
          replacement_lot_id: sub.replacement_lot_id,
          bags_count:         sub.bags_count,
          reason:             sub.reason || '',
          drawdown_id:        drawdownId
        });
        // Merge new sub into PAGE_DATA.lot_substitutions
        if (subData.drawdown_subs) {
          subData.drawdown_subs.forEach(s => {
            const idx = PAGE_DATA.lot_substitutions.findIndex(x => String(x.substitution_id) === String(s.substitution_id));
            if (idx >= 0) PAGE_DATA.lot_substitutions[idx] = s; else PAGE_DATA.lot_substitutions.push(s);
          });
        }
        if (subData.original_lot)    mergeLot(subData.original_lot);
        if (subData.replacement_lot) mergeLot(subData.replacement_lot);
      }
      pendingSubstitutions = [];
    }

    // Now update the drawdown status
    const data = await API.post({
      action:       'updateDrawdownStatus',
      drawdown_id:  drawdownId,
      status:       status
    });
    data.drawdowns.forEach(d => {
      const idx = PAGE_DATA.drawdowns.findIndex(x => String(x.drawdown_id) === String(d.drawdown_id));
      if (idx >= 0) PAGE_DATA.drawdowns[idx] = d; else PAGE_DATA.drawdowns.push(d);
    });
    document.getElementById('modal-status').classList.remove('open');
    renderTable();
    showToast('Status updated.', 'success');
  } catch (e) { showModalError('modal-status', e.message || 'Update failed.'); }
  finally { btn.disabled = false; }
};

function mergeLot(updatedLot) {
  if (!updatedLot) return;
  const idx = PAGE_DATA.inventory_lots.findIndex(l => String(l.lot_id) === String(updatedLot.lot_id));
  if (idx >= 0) PAGE_DATA.inventory_lots[idx] = updatedLot;
}

// Called when a contract is chosen in the search (or cleared)
function selectContract(contractId) {
  const lineSel   = document.getElementById('new-dd-line');
  const buyerInfo = document.getElementById('new-dd-buyer-info');
  const bagsHint  = document.getElementById('new-dd-bags-hint');
  const bagsInput = document.getElementById('new-dd-bags');

  lineSel.innerHTML = '<option value="">— Select line —</option>';
  lineSel.disabled  = true;
  buyerInfo.classList.remove('show');
  bagsHint.textContent = '';
  bagsInput.value = '';
  bagsInput.removeAttribute('max');

  if (!contractId) return;

  const con   = PAGE_DATA.contracts.find(c => String(c.contract_id) === String(contractId));
  const buyer = con ? PAGE_DATA.buyers.find(b => String(b.buyer_id) === String(con.buyer_id)) : null;

  if (buyer && con) {
    buyerInfo.innerHTML =
      'On behalf of: <strong>' + esc(buyer.company_name) + '</strong>' +
      (buyer.contact_person ? ' · ' + esc(buyer.contact_person) : '') +
      '<br>Contract: <strong>' + esc(con.contract_number) + '</strong>' +
      ' · Status: <strong>' + esc(con.status) + '</strong>';
    buyerInfo.classList.add('show');
  }

  const lines = con && con.lines ? con.lines : [];
  lines.forEach(l => {
    const available = (l.contracted_bags || 0) - (l.drawn_bags || 0);
    if (available <= 0) return;
    const o = document.createElement('option');
    o.value = l.contract_line_id;
    o.dataset.available = available;
    o.dataset.bagSize   = l.bag_size || '';
    o.dataset.bagUnit   = l.bag_size_unit || 'kg';
    o.textContent = esc(l.sample_name) + ' · ' + available + ' bags available';
    lineSel.appendChild(o);
  });

  if (lineSel.options.length === 1) {
    lineSel.innerHTML = '<option value="">No lines with available bags</option>';
    lineSel.disabled  = true;
  } else {
    lineSel.disabled = false;
  }
}

// When line changes — update bags max + hint
document.getElementById('new-dd-line').onchange = function() {
  const bagsHint  = document.getElementById('new-dd-bags-hint');
  const bagsInput = document.getElementById('new-dd-bags');
  const selected  = this.options[this.selectedIndex];

  bagsInput.value = '';
  if (!this.value || !selected.dataset.available) {
    bagsHint.textContent = '';
    bagsInput.removeAttribute('max');
    return;
  }

  const available = parseInt(selected.dataset.available);
  const bagSize   = selected.dataset.bagSize;
  const bagUnit   = selected.dataset.bagUnit;
  bagsInput.max   = available;
  bagsHint.textContent = '(max ' + available +
    (bagSize ? ' · ' + bagSize + ' ' + bagUnit + '/bag' : '') + ')';
};

  const bags       = parseInt(document.getElementById('new-dd-bags').value);  // v2.1.3: no || 0
  const lineSel    = document.getElementById('new-dd-line');
  const selected   = lineSel.options[lineSel.selectedIndex];
  const available  = selected && selected.dataset.available ? parseInt(selected.dataset.available) : null;
  clearModalError('modal-new-dd');

  if (!contractId)                   { showModalError('modal-new-dd', 'Please select a contract.'); return; }
  if (!lineId)                       { showModalError('modal-new-dd', 'Please select a contract line.'); return; }
  if (isNaN(bags) || bags <= 0)      { showModalError('modal-new-dd', 'Bags must be a whole number greater than zero.'); return; }
  if (available !== null && bags > available) {
    showModalError('modal-new-dd', 'Requested bags (' + bags + ') exceed available (' + available + ').');
    return;
  }

  btn.disabled = true;
  try {
    const data = await API.post({
      action:           'saveDrawdown',
      contract_id:      contractId,
      contract_line_id: lineId,
      requested_bags:   bags,
      shipping_date:    document.getElementById('new-dd-date').value  || '',
      notes:            document.getElementById('new-dd-notes').value || '',
      status:           'Pending'
    });

    // Merge new drawdown + updated lines into PAGE_DATA
    if (data.drawdown) {
      const idx = PAGE_DATA.drawdowns.findIndex(d => String(d.drawdown_id) === String(data.drawdown.drawdown_id));
      if (idx >= 0) PAGE_DATA.drawdowns[idx] = data.drawdown;
      else PAGE_DATA.drawdowns.unshift(data.drawdown);
    }
    if (data.contract) {
      const ci = PAGE_DATA.contracts.findIndex(c => String(c.contract_id) === String(data.contract.contract_id));
      if (ci >= 0) PAGE_DATA.contracts[ci] = data.contract;
    }

    document.getElementById('modal-new-dd').classList.remove('open');
    renderTable();
    showToast('Drawdown created.', 'success');
  } catch (e) { showModalError('modal-new-dd', e.message || 'Failed to create drawdown.'); }
  finally { btn.disabled = false; }
};

// ── Helpers ───────────────────────────────────────────────────────────────────


// ── Drawdown lot summary ──────────────────────────────────────────────────────
// For a given drawdown, returns the lots fulfilling it:
//   Primary lot (from contract_line.inventory_lot_id) + substitution lots.
// Bags split: primary = requested - sub_total, each sub = substitution.bags_count.

function buildDrawdownLotSummary(drawdown) {
  // Cancelled drawdowns have no active lot commitment — show nothing.
  if (drawdown.status === 'Cancelled') return { lines: [] };

  const line    = drawdown.contract_line;
  const lines   = [];

  if (!line) return { lines: [] };

  const primaryLot = line.inventory_lot_id
    ? PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(line.inventory_lot_id))
    : null;

  // v2.1: Substitutions scoped to THIS drawdown only via drawdown_id.
  // Legacy records (drawdown_id='') are matched by contract_line_id as fallback.
  const drawdownIdStr = String(drawdown.drawdown_id);
  const drawdownSubs  = (PAGE_DATA.lot_substitutions || []).filter(s =>
    s.drawdown_id && String(s.drawdown_id) === drawdownIdStr
  );
  const legacySubs = drawdownSubs.length === 0
    ? (PAGE_DATA.lot_substitutions || []).filter(s =>
        !s.drawdown_id && String(s.contract_line_id) === String(line.contract_line_id)
      )
    : [];
  const subs = drawdownSubs.length > 0 ? drawdownSubs : legacySubs;
  const subTotal = subs.reduce((s, x) => s + (x.bags_count || 0), 0);

  // Primary lot bags = requested minus what substitutions cover
  const primaryBags = Math.max(0, (drawdown.requested_bags || 0) - subTotal);

  if (primaryLot && primaryBags > 0) {
    const loc = primaryLot.location_name || primaryLot.warehouse_name || '';
    lines.push({
      is_sub:     false,
      bags:       primaryBags,
      lot_name:   primaryLot.sample_name || '—',
      lot_number: primaryLot.lot_number  || '',
      location:   loc
    });
  } else if (!primaryLot && primaryBags > 0) {
    lines.push({ is_sub: false, bags: primaryBags, lot_name: 'No lot linked', lot_number: '', location: '' });
  }

  subs.forEach(s => {
    const replLot = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(s.replacement_lot_id));
    const loc = replLot ? (replLot.location_name || replLot.warehouse_name || '') : '';
    lines.push({
      is_sub:     true,
      bags:       s.bags_count,
      lot_name:   replLot ? replLot.sample_name : 'Lot ' + s.replacement_lot_id,
      lot_number: replLot ? (replLot.lot_number || '') : '',
      location:   loc
    });
  });

  return { lines: lines };
}

function toggleDdRow(drawdownId) {
  const k = String(drawdownId);
  if (expandedRows.has(k)) expandedRows.delete(k);
  else expandedRows.add(k);
  renderTable();
}


async function resendDrawdownEmail(drawdownId) {
  if (!confirm('Resend warehouse notification email for this drawdown?')) return;
  try {
    await API.post({ action: 'resendDrawdownEmail', drawdown_id: drawdownId });
    showToast('Notification email resent.', 'success');
  } catch (e) {
    showToast(e.message || 'Failed to resend email.', 'error');
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showModalError(modalId, message) {
  const errEl = document.querySelector('#' + modalId + ' .modal-error');
  if (!errEl) return;
  errEl.textContent = String(message || 'An error occurred.');
  errEl.classList.add('show');
}
function clearModalError(modalId) {
  const errEl = document.querySelector('#' + modalId + ' .modal-error');
  if (errEl) errEl.classList.remove('show');
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+(type||'');
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
