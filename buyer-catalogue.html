<!DOCTYPE html>
<!-- Version 1.22 | buyer-catalogue.html -->
<!-- v1.22: cache-bust static js include (?v) so browsers fetch fresh after deploys. -->
<!-- v1.21: Intent selector moved from submission card to header card (above lot list).
            Two-step UX: full cards on load → compact pill strip after selection.
            Dynamic intent list: Reserve options hidden when no lot has available bags.
            Submission card intent section removed — beans/notes/submit only.
            Fix: buyer no longer needs to scroll back up after changing intent to Reserve;
            lot reserve-row inputs are immediately visible in the lots below the intent strip.
            Single option still shown when only sample_only is available. -->
<!-- v1.20: Intent selector (sample_only/reserve/reserve_and_sample) — global mode controls
            whether reserve rows show; submit validates and routes correctly per intent.
            notes forwarded to GAS for email. lb/kg price fix in submit. -->
<!-- v1.17.4: Reserve Bags input — type="text" inputmode="numeric" for mobile. -->
<!-- Public page — token-authenticated. No login required. -->
<!-- Theme: Warm Precision v1.0 | accent=#c47a2b surface=#fdf8f2 border=#f0e8da -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Catalogue — Sample Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #fdf8f2; --surface2: #faf3ea;
      --border: #f0e8da; --border2: #e8d8c4; --accent: #c47a2b; --accent2: #a0611f;
      --text: #1a1a1a; --muted: #8a7060; --error: #c0392b; --success: #2e7d52;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Inter', sans-serif;
      --radius: 6px; --transition: 160ms ease;
    }
    body { background: var(--surface); color: var(--text); font-family: var(--font-sans); min-height: 100vh; padding: 2rem 1rem; }
    .wrap { max-width: 680px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 2rem; margin-bottom: 1.25rem; }
    .card-logo { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .card-title { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; margin-bottom: 0.25rem; }
    .card-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }

    /* Info block */
    .info-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.875rem 1rem; margin-bottom: 1.5rem; }
    .info-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 0.3rem 0; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 0.1rem; flex-shrink: 0; }
    .info-value { font-size: 0.82rem; color: var(--text); text-align: right; max-width: 65%; }

    /* Section label */
    .section-label { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .section-label span { color: var(--accent); }

    /* Lot cards */
    .lot-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 0.75rem; transition: border-color var(--transition); }
    .lot-card:hover { border-color: var(--border2); }
    .lot-card.selected { border-color: var(--accent); background: #fffcf7; }
    .lot-card-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border); cursor: pointer; }
    .lot-card.selected .lot-card-header { background: #fef5e7; }
    .lot-checkbox { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
    .lot-sample-id { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); font-weight: 500; }
    .lot-name { font-size: 0.85rem; color: var(--text); font-weight: 500; flex: 1; }
    .lot-body { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
    .lot-stat { padding: 0.6rem 1rem; border-right: 1px solid var(--border); }
    .lot-stat:last-child { border-right: none; }
    .lot-stat-label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .lot-stat-value { font-family: var(--font-mono); font-size: 0.82rem; color: var(--text); font-weight: 500; }
    .lot-stat-value.price { color: var(--accent); }

    /* Reserve row — shown below lot stats when lot is selected + intent includes reserve */
    .lot-reserve-row {
      display: none;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: #fffbf4;
      border-top: 1px solid var(--border);
    }
    .lot-card.selected .lot-reserve-row { display: flex; }
    .lot-reserve-label {
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); white-space: nowrap; flex-shrink: 0;
    }
    .lot-reserve-input {
      width: 100px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); font-family: var(--font-mono); font-size: 0.82rem;
      color: var(--text); padding: 0.3rem 0.6rem; outline: none;
      transition: border-color var(--transition);
    }
    .lot-reserve-input:focus { border-color: var(--accent); }
    .lot-reserve-hint { font-size: 0.75rem; color: var(--muted); line-height: 1.4; flex: 1; }
    /* v1.17: Direct reserve link — shown when reservation_token exists (post-Sent) */
    .lot-reserve-link {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em;
      color: var(--accent); text-decoration: none; border: 1px solid var(--accent);
      border-radius: var(--radius); padding: 0.3rem 0.65rem;
      transition: background var(--transition);
      white-space: nowrap; flex-shrink: 0;
    }
    .lot-reserve-link:hover { background: #fef5e7; }

    /* Form fields */
    .field { margin-bottom: 1.25rem; }
    label { display: block; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 0.45rem; }
    select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--font-sans); font-size: 0.85rem; padding: 0.65rem 0.875rem; outline: none; border-radius: var(--radius); transition: border-color var(--transition); }
    select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; line-height: 1.6; }

    /* Buttons */
    .btn { width: 100%; background: var(--accent); color: #fff; border: none; font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.875rem 1rem; cursor: pointer; border-radius: var(--radius); transition: opacity var(--transition); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:hover:not(:disabled) { opacity: 0.85; }

    /* States */
    #state-loading, #state-error, #state-success, #state-form { display: none; }
    .st-spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 2.5rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { font-family: var(--font-mono); font-size: 0.82rem; color: var(--error); text-align: center; padding: 1rem 0; line-height: 1.6; }
    .success-icon { font-size: 2.5rem; text-align: center; margin-bottom: 1rem; }
    .success-title { font-family: var(--font-mono); font-size: 1rem; font-weight: 600; text-align: center; color: var(--success); margin-bottom: 0.75rem; }
    .success-detail { font-size: 0.82rem; color: var(--muted); text-align: center; line-height: 1.7; }
    .success-detail strong { color: var(--text); }

    /* Toast */
    .st-toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.75rem 1.25rem; z-index: 9999; border-radius: var(--radius); animation: fadeIn 0.2s ease; }
    .st-toast--error { border-color: var(--error); color: var(--error); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Empty lots */
    .no-lots { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.82rem; }

    /* v1.17.3: reserve input validation states */
    .lot-reserve-input.input-error { border-color: var(--error); }
    .lot-reserve-hint.hint-error   { color: var(--error); font-weight: 500; }

    /* Tooltip — v1.16 */
    .tooltip-wrap { position: relative; display: inline-flex; align-items: center; gap: 0.35rem; }
    .tooltip-icon { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border2); color: var(--muted); font-size: 0.6rem; font-family: var(--font-mono); cursor: default; flex-shrink: 0; user-select: none; }
    .tooltip-icon:hover + .tooltip-box,
    .tooltip-icon:focus + .tooltip-box { opacity: 1; pointer-events: auto; }
    .tooltip-box { position: absolute; bottom: calc(100% + 6px); left: 0; background: var(--text); color: #fff; font-family: var(--font-sans); font-size: 0.75rem; line-height: 1.5; padding: 0.5rem 0.75rem; border-radius: var(--radius); opacity: 0; pointer-events: none; transition: opacity 120ms ease; z-index: 100; width: 230px; white-space: normal; }
    .tooltip-box::after { content: ''; position: absolute; top: 100%; left: 12px; border: 5px solid transparent; border-top-color: var(--text); }

    /* v1.21: Intent cards (Step 1 — full) */
    .intent-card-full {
      display: flex; align-items: flex-start; gap: 0.75rem;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 0.75rem 1rem; cursor: pointer; margin-bottom: 0.5rem;
      background: var(--bg); user-select: none;
      transition: border-color var(--transition), background var(--transition);
    }
    .intent-card-full:last-child { margin-bottom: 0; }
    .intent-card-full:hover { border-color: var(--border2); background: var(--surface); }
    .intent-card-full:hover .intent-card-radio { border-color: var(--accent); }
    .intent-card-radio {
      width: 16px; height: 16px; border: 2px solid var(--border2); border-radius: 50%;
      flex-shrink: 0; margin-top: 2px; transition: border-color var(--transition);
    }
    .intent-card-title { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; color: var(--text); margin-bottom: 0.15rem; }
    .intent-card-desc  { font-size: 0.74rem; color: var(--muted); line-height: 1.45; }

    /* v1.21: Intent strip (Step 2 — compact pills) */
    .strip-pills { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0; }
    .strip-pill {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em;
      padding: 0.35rem 0.875rem; border-radius: 20px;
      border: 1.5px solid var(--border2); background: var(--bg);
      color: var(--muted); cursor: pointer; white-space: nowrap;
      transition: all var(--transition);
    }
    .strip-pill:hover { border-color: var(--accent); color: var(--text); }
    .strip-pill.active { border-color: var(--accent); background: var(--accent); color: #ffffff; }

    /* v1.21: hide reserve rows globally when mode is sample_only */
    body.mode-sample .lot-reserve-row { display: none !important; }
  </style>
</head>
<body class="mode-sample">
  <div class="wrap">
    <div class="card-logo" style="margin-bottom:1.5rem">Sample Tracker</div>

    <!-- Loading -->
    <div id="state-loading">
      <div class="card"><div class="st-spinner"></div></div>
    </div>

    <!-- Error -->
    <div id="state-error">
      <div class="card">
        <div class="card-title">Link Invalid</div>
        <div class="error-msg" id="error-msg">This link has expired or is invalid.<br>Please contact us to request a new catalogue link.</div>
      </div>
    </div>

    <!-- Form -->
    <div id="state-form">

      <!-- Header card: info + intent + lots -->
      <div class="card">
        <div class="card-title" id="form-title">Coffee Sample Catalogue</div>
        <div class="card-sub" id="form-sub"></div>
        <div class="info-block">
          <div class="info-row">
            <span class="info-label">Warehouse</span>
            <span class="info-value" id="info-warehouse">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Send To</span>
            <span class="info-value" id="info-send-to">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Address</span>
            <span class="info-value" id="info-address">—</span>
          </div>
        </div>

        <!-- v1.21: Intent selector — moved here from submission card, above lot list -->
        <!-- Picking intent first means reserve-row inputs are immediately visible in lots below -->
        <div class="section-label" style="margin-bottom:0.75rem">What would you like to do?</div>

        <!-- Step 1: Full intent cards (dynamic, shown on load) -->
        <div id="intent-cards-full" style="margin-bottom:1.25rem"></div>

        <!-- Step 2: Compact strip (shown after first selection) -->
        <div id="intent-strip" style="display:none; margin-bottom:1.25rem">
          <div class="strip-pills" id="strip-pills"></div>
        </div>

        <!-- Lot selection (always visible — buyer browses while deciding) -->
        <div class="section-label" style="margin-top:0.25rem">
          <span>Available Lots</span>
          <span id="selected-count"></span>
        </div>
        <div id="lot-list"></div>
      </div>

      <!-- Submission card: beans + notes + submit only (no intent selector) -->
      <div class="card">
        <div class="field">
          <label for="sel-beans">Beans Type <span style="color:var(--error)">*</span></label>
          <select id="sel-beans">
            <option value="">— Select —</option>
          </select>
        </div>
        <div class="field">
          <label for="sel-notes">
            <span class="tooltip-wrap">
              Notes <span style="color:var(--muted);font-size:0.65rem;text-transform:none">(optional)</span>
              <span class="tooltip-icon" tabindex="0">?</span>
              <span class="tooltip-box">Include any special instructions — e.g. how many grams per lot, preferred packaging, or any other notes for our team.</span>
            </span>
          </label>
          <textarea id="sel-notes" rows="3" maxlength="500" placeholder="e.g. 200g per lot, vacuum packed…"></textarea>
        </div>
        <button class="btn" id="btn-submit" disabled>Request Samples</button>
      </div>
    </div>

    <!-- Success -->
    <div id="state-success">
      <div class="card">
        <div class="success-icon">✓</div>
        <div class="success-title" id="success-title">Request Submitted</div>
        <div class="success-detail" id="success-detail"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=1.2"></script>
  <script>
    // Version 1.21 | buyer-catalogue.html script
    // v1.21: Intent moved to top of header card (above lot list). Two-step UX — full cards
    //        on load → compact pill strip after selection. Dynamic intent list based on
    //        whether any lot has available_bags > 0. Submission card intent section removed.
    //        Fix: buyer picks intent once at top; lot reserve-row inputs are immediately
    //        visible below — no scrolling back up after changing to reserve mode.
    // v1.20: Intent selector; intent/notes/lb-kg fixes.
    // v1.17.4: type="text" inputmode="numeric" — mobile-safe integer enforcement.

    // ── Dependency check ──────────────────────────────────────────────────────
    if (typeof APP_CONFIG === 'undefined' || !APP_CONFIG.GAS_URL) {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-error').style.display   = 'block';
      document.getElementById('error-msg').textContent = 'Configuration error. Please contact support.';
      throw new Error('APP_CONFIG not loaded');
    }

    // ── State ─────────────────────────────────────────────────────────────────
    let PAGE_DATA         = null;
    let TOKEN             = null;
    let CATALOGUE_INTENT  = 'sample_only';   // default — reserve rows hidden on load
    let AVAILABLE_INTENTS = [];              // v1.21: dynamic
    let INTENT_CONFIRMED  = false;           // v1.21: true once buyer taps a card

    // ── v1.21: Build dynamic intent list ─────────────────────────────────────
    // sample_only always shown first (safest, default, no commitment).
    // Reserve options shown only when at least one lot has available bags.
    function buildAvailableIntents(hasAvailableLots) {
      var intents = [];
      intents.push({
        id:    'sample_only',
        title: 'Request Samples Only',
        desc:  'Receive physical samples to taste. No bags reserved — no commitment.'
      });
      if (hasAvailableLots) {
        intents.push({
          id:    'reserve',
          title: 'Reserve Bags',
          desc:  'Enter quantities to hold your allocation at your agreed price. No payment now.'
        });
        intents.push({
          id:    'reserve_and_sample',
          title: 'Reserve Bags + Request Samples',
          desc:  'Hold your allocation and receive physical samples alongside your order.'
        });
      }
      return intents;
    }

    // ── v1.21: Render full intent cards (Step 1) ─────────────────────────────
    function renderIntentCards() {
      var container = document.getElementById('intent-cards-full');
      container.innerHTML = '';
      AVAILABLE_INTENTS.forEach(function(intent) {
        var card = document.createElement('div');
        card.className = 'intent-card-full';
        card.innerHTML =
          '<div class="intent-card-radio"></div>' +
          '<div>' +
            '<div class="intent-card-title">' + esc(intent.title) + '</div>' +
            '<div class="intent-card-desc">'  + esc(intent.desc)  + '</div>' +
          '</div>';
        card.addEventListener('click', (function(id) {
          return function() { selectIntent(id); };
        })(intent.id));
        container.appendChild(card);
      });
    }

    // ── v1.21: Render compact strip pills (Step 2) ───────────────────────────
    function renderStripPills() {
      var container = document.getElementById('strip-pills');
      container.innerHTML = '';
      AVAILABLE_INTENTS.forEach(function(intent) {
        var pill = document.createElement('button');
        pill.className   = 'strip-pill' + (intent.id === CATALOGUE_INTENT ? ' active' : '');
        pill.textContent = intent.id === CATALOGUE_INTENT ? '✓ ' + intent.title : intent.title;
        pill.addEventListener('click', (function(id) {
          return function() { selectIntent(id); };
        })(intent.id));
        container.appendChild(pill);
      });
    }

    // ── v1.21: Select intent ──────────────────────────────────────────────────
    // Handles first tap (full cards → strip) and strip pill changes.
    function selectIntent(mode) {
      var firstSelection = !INTENT_CONFIRMED;
      CATALOGUE_INTENT  = mode;
      INTENT_CONFIRMED  = true;

      if (firstSelection) {
        document.getElementById('intent-cards-full').style.display = 'none';
        document.getElementById('intent-strip').style.display      = '';
      }

      renderStripPills();

      // Drive reserve-row visibility via body class (same CSS mechanism as v1.20)
      if (mode === 'sample_only') {
        document.body.classList.add('mode-sample');
      } else {
        document.body.classList.remove('mode-sample');
      }

      // Update submit button label if lots are already checked
      var btn     = document.getElementById('btn-submit');
      var checked = document.querySelectorAll('.lot-checkbox:checked').length;
      btn.disabled = checked === 0;
      if (checked > 0) btn.textContent = btnLabel(mode);
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showState(name) {
      ['loading','error','form','success'].forEach(function(s) {
        document.getElementById('state-' + s).style.display = s === name ? 'block' : 'none';
      });
    }

    function toast(msg, isError) {
      var el = document.createElement('div');
      el.className   = 'st-toast' + (isError ? ' st-toast--error' : '');
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 3500);
    }

    function btnLabel(mode) {
      if (mode === 'reserve')            return 'RESERVE BAGS';
      if (mode === 'reserve_and_sample') return 'RESERVE BAGS + REQUEST SAMPLES';
      return 'REQUEST SAMPLES';
    }

    async function post(payload) {
      const body = new URLSearchParams({ payload: JSON.stringify(payload) });
      const res  = await fetch(APP_CONFIG.GAS_URL, { method: 'POST', redirect: 'follow', body });
      if (!res.ok) throw new Error('Network error: ' + res.status);
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Unknown error');
      return data.data;
    }

    // ── Init — one API call: getCataloguePage ─────────────────────────────────
    (async () => {
      showState('loading');

      const params = new URLSearchParams(window.location.search);
      TOKEN = params.get('t');

      if (!TOKEN) {
        document.getElementById('error-msg').textContent = 'No catalogue token found. Please use the link from your email.';
        showState('error');
        return;
      }

      try {
        PAGE_DATA = await post({ action: 'getCataloguePage', token: TOKEN });
      } catch (err) {
        document.getElementById('error-msg').textContent = err.message || 'This link is invalid or has expired.';
        showState('error');
        return;
      }

      renderForm();
      showState('form');
    })();

    // ── Render form ───────────────────────────────────────────────────────────
    function renderForm() {
      document.getElementById('form-title').textContent =
        'Coffee Sample Catalogue — ' + esc(PAGE_DATA.buyer_company);
      document.getElementById('form-sub').textContent =
        'Choose what you\'d like to do, then select the lots you\'re interested in.';
      document.getElementById('info-warehouse').textContent = PAGE_DATA.warehouse_name || '—';
      document.getElementById('info-send-to').textContent   = PAGE_DATA.buyer_company  || '—';
      document.getElementById('info-address').textContent   = PAGE_DATA.buyer_address  || '—';

      // Beans options
      const beansSel = document.getElementById('sel-beans');
      (PAGE_DATA.beans_options || ['NO Sample','Green Sample','Roasted Sample']).forEach(function(b) {
        const opt = document.createElement('option');
        opt.value = b; opt.textContent = b;
        beansSel.appendChild(opt);
      });

      // v1.21: build dynamic intent list based on lot availability
      const lots            = PAGE_DATA.lots || [];
      const hasAvailableLots = lots.some(function(l) { return (l.available_bags || 0) > 0; });
      AVAILABLE_INTENTS     = buildAvailableIntents(hasAvailableLots);
      renderIntentCards();

      renderLots();
    }

    // ── Render lot cards ──────────────────────────────────────────────────────
    function renderLots() {
      const listEl = document.getElementById('lot-list');
      const lots   = PAGE_DATA.lots || [];

      if (!lots.length) {
        listEl.innerHTML = '<div class="no-lots">No lots available in this catalogue.</div>';
        return;
      }

      listEl.innerHTML = '';
      lots.forEach(function(lot) {
        const priceStr = lot.sale_price
          ? '$' + parseFloat(lot.sale_price).toFixed(2) + ' / ' + (lot.sale_price_unit || 'kg')
          : '—';
        const bagSize = lot.bag_size ? lot.bag_size + ' kg' : '—';
        const avail   = lot.available_bags !== null && lot.available_bags !== undefined
          ? lot.available_bags + ' bags' : '—';

        const reserveRowHtml = lot.reserve_link
          ? `<div class="lot-reserve-row">
               <span class="lot-reserve-label">Reserve</span>
               <a class="lot-reserve-link" href="${esc(lot.reserve_link)}" target="_blank">Reserve Bags →</a>
               <span class="lot-reserve-hint">Opens the reservation page for this lot.</span>
             </div>`
          : `<div class="lot-reserve-row">
               <span class="lot-reserve-label">Reserve Bags</span>
               <input type="text" inputmode="numeric" pattern="[0-9]*"
                 class="lot-reserve-input" id="reserve-${esc(lot.detail_id)}"
                 placeholder="0"
                 data-max="${lot.available_bags || 0}"
                 oninput="onReserveInput(this)"
                 title="Max ${lot.available_bags || 0} bags available" />
               <span class="lot-reserve-hint">Optional — enter a quantity to reserve bags now. Max: <strong>${lot.available_bags || 0} bags</strong>.</span>
             </div>`;

        const card = document.createElement('div');
        card.className  = 'lot-card';
        card.dataset.id = lot.detail_id;
        card.innerHTML  = `
          <div class="lot-card-header">
            <input type="checkbox" class="lot-checkbox" id="lot-cb-${esc(lot.detail_id)}"
              value="${esc(lot.detail_id)}" onchange="onLotCheck()" />
            <span class="lot-sample-id">${esc(lot.sample_id)}</span>
            <span class="lot-name">${esc(lot.sample_name)}</span>
          </div>
          <div class="lot-body">
            <div class="lot-stat">
              <div class="lot-stat-label">Available</div>
              <div class="lot-stat-value">${esc(avail)}</div>
            </div>
            <div class="lot-stat">
              <div class="lot-stat-label">Bag Size</div>
              <div class="lot-stat-value">${esc(bagSize)}</div>
            </div>
            <div class="lot-stat">
              <div class="lot-stat-label">Your Price</div>
              <div class="lot-stat-value price">${esc(priceStr)}</div>
            </div>
          </div>
          ${reserveRowHtml}`;

        card.querySelector('.lot-card-header').addEventListener('click', function(e) {
          if (e.target.type === 'checkbox') return;
          const cb = card.querySelector('.lot-checkbox');
          cb.checked = !cb.checked;
          onLotCheck();
        });

        listEl.appendChild(card);
      });
    }

    // ── Reserve bag input: live validation (v1.17.4) ──────────────────────────
    function onReserveInput(inp) {
      const hint = inp.closest('.lot-reserve-row') ? inp.closest('.lot-reserve-row').querySelector('.lot-reserve-hint') : null;
      const max  = parseInt(inp.dataset.max) || 0;

      const stripped = inp.value.replace(/[^0-9]/g, '');
      if (inp.value !== stripped) inp.value = stripped;

      if (stripped === '') {
        inp.classList.remove('input-error');
        if (hint) { hint.classList.remove('hint-error'); hint.textContent = 'Optional — enter a quantity to reserve bags now. Max: ' + max + ' bags.'; }
        return;
      }

      const parsed = parseInt(stripped, 10);

      if (parsed > max) {
        inp.value = String(max);
        inp.classList.add('input-error');
        if (hint) { hint.classList.add('hint-error'); hint.textContent = 'Only ' + max + ' bag' + (max === 1 ? '' : 's') + ' available — value reduced.'; }
        return;
      }

      if (parsed === 0) {
        inp.classList.add('input-error');
        if (hint) { hint.classList.add('hint-error'); hint.textContent = 'Enter at least 1 bag, or leave blank.'; }
        return;
      }

      inp.classList.remove('input-error');
      if (hint) { hint.classList.remove('hint-error'); hint.textContent = 'Reserving ' + parsed + ' bag' + (parsed === 1 ? '' : 's') + ' (max ' + max + ').'; }
    }

    function onLotCheck() {
      const checked = document.querySelectorAll('.lot-checkbox:checked');

      document.querySelectorAll('.lot-card').forEach(function(card) {
        const cb = card.querySelector('.lot-checkbox');
        card.classList.toggle('selected', cb && cb.checked);
        if (cb && !cb.checked) {
          const inp = card.querySelector('.lot-reserve-input');
          if (inp) inp.value = '';
        }
      });

      const countEl = document.getElementById('selected-count');
      countEl.textContent = checked.length ? checked.length + ' selected' : '';

      const btn = document.getElementById('btn-submit');
      btn.disabled = checked.length === 0;
      if (checked.length > 0) btn.textContent = btnLabel(CATALOGUE_INTENT);
    }

    // ── Submit — one API call: submitCatalogueSelection ───────────────────────
    document.getElementById('btn-submit').addEventListener('click', async () => {
      const selectedIds = Array.from(
        document.querySelectorAll('.lot-checkbox:checked')
      ).map(function(cb) { return cb.value; });

      const beans  = document.getElementById('sel-beans').value;
      const notes  = document.getElementById('sel-notes').value.trim();
      const intent = CATALOGUE_INTENT;

      if (!selectedIds.length) { toast('Select at least one lot.', true); return; }
      if (!beans)              { toast('Please select a beans type.', true); return; }

      const bags_to_reserve = {};
      let reserveError = null;

      if (intent !== 'sample_only') {
        selectedIds.forEach(function(dId) {
          const inp = document.getElementById('reserve-' + dId);
          if (!inp) return;
          const raw = inp.value.trim();
          if (raw === '' || raw === '0') return;

          const qty = parseInt(raw);
          if (isNaN(qty) || qty !== Math.floor(parseFloat(raw))) {
            const lot = (PAGE_DATA.lots || []).find(function(l) { return String(l.detail_id) === String(dId); });
            reserveError = 'Reserve quantity for "' + (lot ? lot.sample_name : dId) + '" must be a whole number.';
            return;
          }
          if (qty <= 0) return;

          const max = parseInt(inp.dataset.max) || 0;
          if (qty > max) {
            const lot = (PAGE_DATA.lots || []).find(function(l) { return String(l.detail_id) === String(dId); });
            reserveError = '"' + (lot ? lot.sample_name : dId) + '": only ' + max + ' bag' + (max === 1 ? '' : 's') + ' available (server will re-validate).';
            return;
          }
          bags_to_reserve[dId] = qty;
        });

        if (reserveError) { toast(reserveError, true); return; }

        if (intent === 'reserve' && Object.keys(bags_to_reserve).length === 0) {
          toast('Please enter a bag quantity for at least one lot, or choose "Request Samples Only".', true);
          return;
        }
      }

      const hasReservations = Object.keys(bags_to_reserve).length > 0;

      const btn = document.getElementById('btn-submit');
      btn.disabled    = true;
      btn.textContent = 'SUBMITTING…';

      try {
        const result = await post({
          action:              'submitCatalogueSelection',
          token:               TOKEN,
          selected_detail_ids: selectedIds,
          bags_to_reserve,
          beans,
          notes,
          intent
        });

        const titleMap = {
          reserve:            'Reservation Submitted',
          reserve_and_sample: 'Reservation & Sample Request Submitted',
          sample_only:        'Sample Request Submitted'
        };
        document.getElementById('success-title').textContent = titleMap[intent] || 'Request Submitted';

        let successHtml =
          'Thank you, <strong>' + esc(PAGE_DATA.buyer_name) + '</strong>.<br><br>' +
          'We have received your request for <strong>' + result.lot_count + ' lot' +
          (result.lot_count === 1 ? '' : 's') + '</strong>.<br>';

        if (hasReservations) {
          successHtml += '<strong>' + result.reserved_lot_count + ' lot' +
            (result.reserved_lot_count === 1 ? '' : 's') + '</strong> ' +
            'flagged for reservation — our team will confirm shortly.<br>';
        } else {
          successHtml += 'Our team will be in touch shortly to confirm and arrange dispatch.<br>';
        }

        successHtml +=
          '<br><span style="font-family:var(--font-mono);font-size:0.72rem;color:var(--muted)">Reference: Outbound #' +
          result.outbound_id + '</span>';

        document.getElementById('success-detail').innerHTML = successHtml;
        showState('success');
      } catch (err) {
        toast(err.message || 'Submission failed. Please try again.', true);
        btn.disabled    = false;
        btn.textContent = btnLabel(intent);
      }
    });
  </script>
</body>
</html>
