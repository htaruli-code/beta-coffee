<!DOCTYPE html>
<!-- Version 2.1.1 | inventory.html -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory — Sample Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#ffffff;--surface:#fdf8f2;--surface2:#f5ede0;--border:#f0e8da;--border2:#d9cab5;--accent:#c47a2b;--text:#1a1a1a;--muted:#8a7060;--error:#c0392b;--success:#2e7d52;--font-mono:'IBM Plex Mono',monospace;--font-sans:'Inter',sans-serif;--radius:4px;--transition:160ms ease;--nav-h:52px}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh}
    .nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
    .nav-brand{font-family:var(--font-mono);font-size:.75rem;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
    .nav-links{display:flex;gap:1.5rem}
    .nav-links a{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;transition:color var(--transition)}
    .nav-links a:hover,.nav-links a.active{color:var(--accent)}
    .nav-user{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);cursor:pointer}
    .nav-user:hover{color:var(--error)}
    .page{max-width:1300px;margin:0 auto;padding:2rem}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
    .page-title{font-family:var(--font-mono);font-size:1.1rem;font-weight:600}
    .page-sub{font-size:.8rem;color:var(--muted);margin-top:.2rem}
    .toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem}
    .btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--accent);color:#fff;border:none;font-family:var(--font-mono);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.55rem 1rem;cursor:pointer;border-radius:var(--radius);transition:background var(--transition)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
    .btn-sm{padding:.3rem .65rem;font-size:.7rem}
    input,select,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:.78rem;padding:.5rem .875rem;border-radius:var(--radius);outline:none;transition:border-color var(--transition);width:100%}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:.3rem;font-family:var(--font-mono)}
    .field{display:flex;flex-direction:column;flex:1;min-width:140px}
    .field-row{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
    .inv-table{width:100%;border-collapse:collapse;font-size:.78rem}
    .inv-table th{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:.4rem .6rem;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap}
    .inv-table td{padding:.55rem .6rem;border-bottom:1px solid var(--border);vertical-align:middle}
    .inv-table tr.lot-row:hover td{background:var(--surface)}
    .inv-table tr.bin-row td{background:#faf5ee;font-size:.72rem;padding:.28rem .6rem .28rem 2.8rem;border-bottom:1px dashed var(--border);color:var(--muted)}
    .num{text-align:right;font-family:var(--font-mono)}
    .avail-ok{color:var(--success);font-weight:600}
    .avail-low{color:#b45309;font-weight:600}
    .avail-zero{color:var(--error);font-weight:600}
    .sku-code-badge{font-family:var(--font-mono);font-size:.65rem;font-weight:600;color:var(--accent);background:#fff3e0;padding:.15rem .4rem;border-radius:3px;white-space:nowrap}
    .legacy-badge{font-family:var(--font-mono);font-size:.62rem;color:var(--muted);background:#f0e8da;padding:.15rem .4rem;border-radius:3px}
    .bin-toggle{font-family:var(--font-mono);font-size:.65rem;cursor:pointer;color:var(--accent);background:none;border:none;padding:0;text-decoration:underline}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
    .modal-overlay.open{display:flex}
    .modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;width:100%;max-width:620px;margin:auto}
    .modal-title{font-family:var(--font-mono);font-size:.9rem;font-weight:600;margin-bottom:1.25rem}
    .modal-footer{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem}
    .modal-section{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:1rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
    .modal-error{display:none;background:rgba(192,57,43,.08);border:1px solid var(--error);color:var(--error);font-family:var(--font-mono);font-size:.78rem;padding:.65rem .85rem;border-radius:var(--radius);margin-bottom:1rem}
    .modal-error.show{display:block}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;font-family:var(--font-mono);font-size:.78rem;padding:.75rem 1.25rem;border-radius:var(--radius);background:var(--text);color:#fff;opacity:0;transition:opacity .2s;pointer-events:none}
    .toast.show{opacity:1}.toast.error{background:var(--error)}.toast.success{background:var(--success)}
    .empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-family:var(--font-mono);font-size:.8rem}
    .loading{text-align:center;padding:3rem;font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}

    /* ── Drawdown panel (v2.1) ──────────────────────────────────────────────── */
    .inv-table tr.dd-section-row td { background: #f0f7f4; padding: 0; border-bottom: none; }
    .dd-panel { padding: 0.5rem 0.6rem 0.6rem 2.8rem; border-bottom: 1px solid var(--border); }
    .dd-panel-title { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; display: flex; align-items: center; justify-content: space-between; }
    .dd-line { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.7rem; padding: 0.22rem 0; border-bottom: 1px dashed var(--border); color: var(--muted); }
    .dd-line:last-child { border-bottom: none; }
    .dd-line .dd-bags { color: var(--text); font-weight: 600; }
    .dd-line .dd-buyer { color: var(--text); }
    .dd-badge { display: inline-block; font-family: var(--font-mono); font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.15rem 0.4rem; border-radius: 2px; }
    .dd-badge-pending    { background: #f0f0f0; color: #666; }
    .dd-badge-approved   { background: #fef9ec; color: #854f0b; }
    .dd-badge-dispatched { background: #eef4fd; color: #1a5ca8; }
    .dd-badge-delivered  { background: #edf7f0; color: #1e6640; }
    .dd-badge-cancelled  { background: #fdecea; color: #b00020; }
    .dd-sub-tag { font-size: 0.62rem; color: var(--accent); background: #fff3e0; padding: 0.1rem 0.35rem; border-radius: 2px; font-weight: 600; }
    .dd-toggle { font-family: var(--font-mono); font-size: 0.65rem; cursor: pointer; color: var(--success); background: none; border: none; padding: 0; text-decoration: underline; }
    .dd-empty { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

<nav class="nav">
  <span class="nav-brand" id="nav-brand">Sample Tracker</span>
  <div class="nav-links">
    <a href="purchase-orders.html" id="nav-po">Purchase Orders</a>
    <a href="shipments.html" id="nav-shipments">Shipments</a>
    <a href="inventory.html" id="nav-inventory" class="active">Inventory</a>
    <a href="inventory-locations.html" id="nav-locations">Locations</a>
    <a href="product-skus.html" id="nav-skus">SKUs</a>
    <a href="suppliers.html" id="nav-suppliers">Suppliers</a>
    <a href="contracts.html" id="nav-contracts">Contracts</a>
    <a href="drawdowns.html" id="nav-drawdowns">Drawdowns</a>
  </div>

</nav>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Inventory</div>
      <div class="page-sub">Lots received from PO lines. Expand a lot to see individual bin locations.</div>
    </div>
  </div>

  <div class="toolbar">
    <select id="filter-wh"   style="width:auto" onchange="renderTable()"><option value="">All Warehouses</option></select>
    <select id="filter-type" style="width:auto" onchange="renderTable()"><option value="">All Coffee Types</option></select>
    <select id="filter-sku"  style="width:auto" onchange="renderTable()"><option value="">All SKUs</option></select>
    <input  id="filter-search" type="text" placeholder="Search sample name…" style="width:200px" oninput="renderTable()" />
    <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-family:var(--font-mono);font-size:.72rem;color:var(--muted)">
      <input type="checkbox" id="filter-legacy" onchange="renderTable()" style="width:auto" />
      Show legacy (no bins)
    </label>
  </div>

  <div id="inv-table-wrap"><div class="loading">Loading inventory…</div></div>
</div>

<!-- Edit Lot Modal -->
<div class="modal-overlay" id="modal-lot">
  <div class="modal">
    <div class="modal-title" id="modal-lot-title">Edit Inventory Lot</div>
    <div class="modal-error" id="modal-lot-error"></div>
    <input type="hidden" id="lot-id" />

    <div class="field-row">
      <div class="field" style="flex:2">
        <label>Sample Name <span style="color:var(--error)">*</span></label>
        <input type="text" id="lot-name" placeholder="e.g. Natural Catuaí" />
      </div>
      <div class="field">
        <label>Lot Number</label>
        <input type="text" id="lot-number" placeholder="Internal ref" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Origin Sample Code</label>
        <input type="text" id="lot-origin-code" placeholder="Supplier ref (optional)" />
      </div>
      <div class="field">
        <label>Coffee Type</label>
        <select id="lot-coffee-type"></select>
      </div>
    </div>
    <div class="modal-section">Location</div>
    <div class="field-row">
      <div class="field">
        <label>Warehouse <span style="color:var(--error)">*</span></label>
        <select id="lot-warehouse" onchange="updateLocations()"></select>
      </div>
      <div class="field">
        <label>Location</label>
        <select id="lot-location"></select>
      </div>
    </div>
    <div class="modal-section">Quantity &amp; Cost</div>
    <div class="field-row">
      <div class="field">
        <label>Received Bags <span style="color:var(--error)">*</span></label>
        <input type="number" id="lot-bags" min="1" placeholder="0" />
      </div>
      <div class="field">
        <label>Bag Size</label>
        <input type="number" id="lot-bag-size" min="0" step="0.1" placeholder="60" />
      </div>

        <label>Cost / unit</label>
        <input type="number" id="lot-cost" min="0" step="0.01" placeholder="0.00" />

        <select id="lot-cost-unit"></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Received Date</label>
        <input type="date" id="lot-received-date" />
      </div>

        <label>Origin Country</label>
        <select id="lot-country"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-lot-cancel">Cancel</button>
      <button class="btn" id="btn-lot-save">Save Lot</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
if (typeof APP_CONFIG === 'undefined') throw new Error('config.js not loaded');
if (typeof Auth === 'undefined') throw new Error('auth.js not loaded');
if (typeof API  === 'undefined') throw new Error('api.js not loaded');
if (!Auth.requireAuth()) throw new Error('Unauthenticated');

let PAGE_DATA   = { inventory_lots: [], warehouses: [], locations: [], countries: [], coffee_types: [], weight_units: ['kg','lb'], drawdowns: [], contracts: [], buyers: [], lot_substitutions: [] };
let expandedLots     = new Set();
let expandedDrawdowns = new Set();

(async () => {
  const user    = Auth.getUser();
  const company = Auth.getCompany();
  document.getElementById('nav-brand').textContent = company ? company.company_name : 'Sample Tracker';
  document.getElementById('nav-user').textContent  = user ? user.name : '';
  document.getElementById('nav-user').onclick = () => { Auth.logout(); window.location = 'login.html'; };
  try {
    const data = await API.post({ action: 'getInventoryPage' });
    PAGE_DATA = data;
    populateFilters();
    renderTable();
  } catch (e) {
    console.error('Caught error:', e);
    document.getElementById('inv-table-wrap').innerHTML = '<div class="empty">Failed to load inventory.</div>';
    showToast('Failed to load data.', 'error');
  }
})();

function populateFilters() {
  const whEl = document.getElementById('filter-wh');
  whEl.innerHTML = '<option value="">All Warehouses</option>' +
    (PAGE_DATA.warehouses || []).map(w =>
      '<option value="' + w.warehouse_id + '">' + esc(w.warehouse_name) + '</option>'
    ).join('');

  const typeEl = document.getElementById('filter-type');
  typeEl.innerHTML = '<option value="">All Coffee Types</option>' +
    (PAGE_DATA.coffee_types || []).map(t =>
      '<option value="' + t + '">' + t + '</option>'
    ).join('');

  const skuSet = new Set();
  (PAGE_DATA.inventory_lots || []).forEach(l => { if (l.sku_code) skuSet.add(l.sku_code); });
  const skuEl = document.getElementById('filter-sku');
  skuEl.innerHTML = '<option value="">All SKUs</option>' +
    [...skuSet].sort().map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
}

function renderTable() {
  const wh         = document.getElementById('filter-wh').value;
  const type       = document.getElementById('filter-type').value;
  const sku        = document.getElementById('filter-sku').value;
  const search     = document.getElementById('filter-search').value.toLowerCase().trim();
  const showLegacy = document.getElementById('filter-legacy').checked;

  let lots = PAGE_DATA.inventory_lots || [];
  if (wh)     lots = lots.filter(l => String(l.warehouse_id) === wh);
  if (type)   lots = lots.filter(l => l.coffee_type === type);
  if (sku)    lots = lots.filter(l => l.sku_code === sku);
  if (search) lots = lots.filter(l => (l.sample_name || '').toLowerCase().includes(search));
  if (!showLegacy) lots = lots.filter(l => l.bins && l.bins.length > 0);

  const wrap = document.getElementById('inv-table-wrap');
  if (!lots.length) {
    wrap.innerHTML = '<div class="empty">No lots found.' +
      (!showLegacy ? ' <button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'filter-legacy\').checked=true;renderTable()">Show legacy lots</button>' : '') +
      '</div>';
    return;
  }

  const rows = [];
  lots.forEach(l => {
    const bins       = l.bins || [];
    const isLegacy   = bins.length === 0;
    const isExpanded = expandedLots.has(String(l.lot_id));
    const availClass = l.available_bags === 0 ? 'avail-zero' : l.available_bags < 5 ? 'avail-low' : 'avail-ok';
    const skuHtml    = l.sku_code
      ? '<span class="sku-code-badge">' + esc(l.sku_code) + '</span>'
      : (isLegacy ? '<span class="legacy-badge">legacy</span>' : '—');
    const binToggle  = !isLegacy
      ? '<button class="bin-toggle" onclick="toggleBins(' + l.lot_id + ')">' +
          (isExpanded ? '▲ ' : '▼ ') + bins.length + ' bin' + (bins.length !== 1 ? 's' : '') +
        '</button>'
      : '<span class="legacy-badge">no bins</span>';

    // Drawdown usage for this lot — primary lines + substitution lines
    const lotDrawdowns   = getLotDrawdowns(l.lot_id);
    const ddExpanded     = expandedDrawdowns.has(String(l.lot_id));
    const ddCount        = lotDrawdowns.length;
    const ddToggle       = '<button class="dd-toggle" onclick="toggleDrawdownPanel(' + l.lot_id + ')">' +
      (ddExpanded ? '▲ ' : '▼ ') + ddCount + ' drawdown' + (ddCount !== 1 ? 's' : '') +
      '</button>';

    rows.push('<tr class="lot-row">' +
      '<td>' + skuHtml + '</td>' +
      '<td>' + esc(l.sample_name) + '</td>' +
      '<td>' + esc(l.lot_number || '—') + '</td>' +
      '<td>' + esc(l.warehouse_name || '—') + '</td>' +
      '<td>' + esc(l.coffee_type || '—') + '</td>' +
      '<td class="num">' + l.received_bags + '</td>' +
      '<td class="num ' + availClass + '">' + l.available_bags + '</td>' +
      '<td class="num">' + l.bag_size + ' ' + esc(l.cost_price_unit || 'kg') + '</td>' +
      '<td class="num">' + (l.cost_price ? l.cost_price + ' / ' + esc(l.cost_price_unit || 'kg') : '—') + '</td>' +
      '<td>' + esc(l.received_date || '—') + '</td>' +
      '<td>' + binToggle + '</td>' +
      '<td>' + (ddCount > 0 ? ddToggle : '<span class="dd-empty">no drawdowns</span>') + '</td>' +
      '<td><button class="btn btn-ghost btn-sm" onclick="openLotModal(' + l.lot_id + ')">Edit</button></td>' +
    '</tr>');

    if (isExpanded && bins.length) {
      bins.forEach(b => {
        rows.push('<tr class="bin-row">' +
          '<td></td>' +
          '<td colspan="3">📦 ' + esc(b.bin_label || '—') + '</td>' +
          '<td colspan="3">' + esc(b.notes || '') + '</td>' +
          '<td></td><td></td>' +
          '<td class="num">' + b.qty_bags + ' bags</td>' +
          '<td colspan="3"></td>' +
        '</tr>');
      });
    }

    if (ddExpanded && ddCount > 0) {
      rows.push('<tr class="dd-section-row"><td colspan="13"><div class="dd-panel">' +
        buildLotDrawdownPanel(l.lot_id, lotDrawdowns) +
      '</div></td></tr>');
    }
  });

  wrap.innerHTML = '<table class="inv-table"><thead><tr>' +
    '<th>SKU</th><th>Sample</th><th>Lot #</th><th>Warehouse</th><th>Type</th>' +
    '<th class="num">Received</th><th class="num">Available</th>' +
    '<th class="num">Bag Size</th><th class="num">Cost</th>' +
    '<th>Date</th><th>Bins</th><th>Drawdowns</th><th></th>' +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}

function toggleBins(lotId) {
  const k = String(lotId);
  if (expandedLots.has(k)) expandedLots.delete(k);
  else expandedLots.add(k);
  renderTable();
}

function toggleDrawdownPanel(lotId) {
  const k = String(lotId);
  if (expandedDrawdowns.has(k)) expandedDrawdowns.delete(k);
  else expandedDrawdowns.add(k);
  renderTable();
}

// Returns all drawdowns that touch this lot — either as primary lot or as substitution replacement.
// v2.1.1: Uses drawdown_id on substitution records for exact matching.
// Legacy subs (drawdown_id='') fall back to contract_line_id matching.
function getLotDrawdowns(lotId) {
  const lid = String(lotId);

  // Primary: contract lines where inventory_lot_id === lotId
  const primaryLineIds = new Set(
    (PAGE_DATA.contracts || [])
      .flatMap(c => (c.lines || []))
      .filter(l => String(l.inventory_lot_id) === lid)
      .map(l => String(l.contract_line_id))
  );

  // Substitution records pointing to this lot as replacement
  const subs = (PAGE_DATA.lot_substitutions || []).filter(s => String(s.replacement_lot_id) === lid);

  // For each drawdown: is this lot involved either as primary or substitution?
  const result = [];

  (PAGE_DATA.drawdowns || []).forEach(d => {
    const clid       = String(d.contract_line_id);
    const ddIdStr    = String(d.drawdown_id);
    const isPrimary  = primaryLineIds.has(clid);

    // Substitution match: prefer drawdown_id match, fall back to line-level for legacy records
    const subMatch = subs.find(s =>
      (s.drawdown_id && String(s.drawdown_id) === ddIdStr) ||
      (!s.drawdown_id && String(s.contract_line_id) === clid)
    );

    if (!isPrimary && !subMatch) return; // this lot not involved in this drawdown

    result.push(Object.assign({}, d, {
      is_substitution: !isPrimary && !!subMatch,
      sub_bags_count:  subMatch ? subMatch.bags_count : null
    }));
  });

  return result.sort((a, b) => {
    const order = { 'Pending': 0, 'Approved': 1, 'Dispatched': 2, 'Delivered': 3, 'Cancelled': 4 };
    const ao = order[a.status] !== undefined ? order[a.status] : 5;
    const bo = order[b.status] !== undefined ? order[b.status] : 5;
    return ao !== bo ? ao - bo : (b.drawdown_id - a.drawdown_id);
  });
}

function buildLotDrawdownPanel(lotId, lotDrawdowns) {
  const pending    = lotDrawdowns.filter(d => d.status === 'Pending' || d.status === 'Approved').length;
  const dispatched = lotDrawdowns.filter(d => d.status === 'Dispatched' || d.status === 'Delivered').length;

  let title = '<div class="dd-panel-title"><span>Drawdown Activity';
  if (pending)    title += ' &nbsp;·&nbsp; <span style="color:var(--accent)">' + pending + ' in-flight</span>';
  if (dispatched) title += ' &nbsp;·&nbsp; <span style="color:var(--success)">' + dispatched + ' fulfilled</span>';
  title += '</span></div>';

  const lines = lotDrawdowns.map(d => {
    const badgeKey  = (d.status || 'pending').toLowerCase();
    const subTag    = d.is_substitution
      ? '<span class="dd-sub-tag">SUB ' + (d.sub_bags_count ? d.sub_bags_count + ' bags' : '') + '</span>'
      : '';
    return '<div class="dd-line">' +
      '<span class="dd-badge dd-badge-' + badgeKey + '">' + esc(d.status) + '</span>' +
      subTag +
      '<span class="dd-buyer">' + esc(d.buyer_name || '—') + '</span>' +
      '<span style="color:var(--muted)">·</span>' +
      '<span>' + esc(d.contract_number || '—') + '</span>' +
      '<span style="color:var(--muted)">·</span>' +
      '<span>' + esc((d.contract_line && d.contract_line.sample_name) || '—') + '</span>' +
      '<span style="color:var(--muted)">·</span>' +
      '<span class="dd-bags">' + (d.requested_bags || 0) + ' bags</span>' +
      (d.shipping_date ? '<span style="color:var(--muted)">ship ' + esc(d.shipping_date) + '</span>' : '') +
    '</div>';
  }).join('');

  return title + lines;
}

function updateLocations() {
  const whId = document.getElementById('lot-warehouse').value;
  const locs = (PAGE_DATA.locations || []).filter(l => String(l.warehouse_id) === String(whId) && l.is_active);
  document.getElementById('lot-location').innerHTML =
    '<option value="">— No specific location —</option>' +
    locs.map(l => '<option value="' + l.location_id + '">' + esc(l.facility_name) + '</option>').join('');
}

function openLotModal(lotId) {
  const lot = lotId ? (PAGE_DATA.inventory_lots || []).find(l => String(l.lot_id) === String(lotId)) : null;
  document.getElementById('modal-lot-title').textContent    = lot ? 'Edit Lot' : 'Add Lot';
  document.getElementById('lot-id').value                   = lot ? lot.lot_id           : '';
  document.getElementById('lot-name').value                 = lot ? lot.sample_name       : '';
  document.getElementById('lot-number').value               = lot ? lot.lot_number         : '';
  document.getElementById('lot-origin-code').value          = lot ? lot.origin_sample_code : '';
  document.getElementById('lot-bags').value                 = lot ? lot.received_bags       : '';
  document.getElementById('lot-bag-size').value             = lot ? lot.bag_size            : '';
  document.getElementById('lot-cost').value                 = lot ? lot.cost_price          : '';
  document.getElementById('lot-received-date').value        = lot ? lot.received_date       : '';

  document.getElementById('lot-coffee-type').innerHTML =
    '<option value="">— None —</option>' +
    (PAGE_DATA.coffee_types || []).map(t =>
      '<option value="' + t + '"' + (lot && lot.coffee_type === t ? ' selected' : '') + '>' + t + '</option>'
    ).join('');

  document.getElementById('lot-cost-unit').innerHTML =
    (PAGE_DATA.weight_units || ['kg','lb']).map(u =>
      '<option value="' + u + '"' + (lot && lot.cost_price_unit === u ? ' selected' : '') + '>' + u + '</option>'
    ).join('');

  document.getElementById('lot-warehouse').innerHTML =
    (PAGE_DATA.warehouses || []).map(w =>
      '<option value="' + w.warehouse_id + '"' +
        (lot && String(lot.warehouse_id) === String(w.warehouse_id) ? ' selected' : '') +
      '>' + esc(w.warehouse_name) + '</option>'
    ).join('');
  updateLocations();
  if (lot) document.getElementById('lot-location').value = lot.location_id || '';

  document.getElementById('lot-country').innerHTML =
    '<option value="">— Unknown —</option>' +
    (PAGE_DATA.countries || []).map(c =>
      '<option value="' + c.country_id + '"' +
        (lot && String(lot.origin_country_id) === String(c.country_id) ? ' selected' : '') +
      '>' + esc(c.country_name) + '</option>'
    ).join('');

  clearModalError('modal-lot');
  document.getElementById('modal-lot').classList.add('open');
}

document.getElementById('btn-lot-cancel').onclick = () =>
  document.getElementById('modal-lot').classList.remove('open');

document.getElementById('btn-lot-save').onclick = async () => {
  const btn = document.getElementById('btn-lot-save');
  btn.disabled = true;
  try {
    const data = await API.post({
      action:             'saveInventoryLot',
      lot_id:             document.getElementById('lot-id').value          || null,
      warehouse_id:       document.getElementById('lot-warehouse').value,
      location_id:        document.getElementById('lot-location').value    || '',
      sample_name:        document.getElementById('lot-name').value,
      lot_number:         document.getElementById('lot-number').value,
      origin_sample_code: document.getElementById('lot-origin-code').value,
      coffee_type:        document.getElementById('lot-coffee-type').value,
      received_bags:      document.getElementById('lot-bags').value,
      bag_size:           document.getElementById('lot-bag-size').value,
      cost_price:         document.getElementById('lot-cost').value,
      cost_price_unit:    document.getElementById('lot-cost-unit').value,
      received_date:      document.getElementById('lot-received-date').value,
      origin_country_id:  document.getElementById('lot-country').value    || ''
    });
    const whId = data.warehouse_id;
    PAGE_DATA.inventory_lots = (PAGE_DATA.inventory_lots || [])
      .filter(l => String(l.warehouse_id) !== String(whId))
      .concat(data.lots);
    document.getElementById('modal-lot').classList.remove('open');
    renderTable();
    showToast('Lot saved.', 'success');
  } catch (e) {
    console.error('Caught error:', e);
    showModalError('modal-lot', e.message || 'Save failed.');
  } finally {
    btn.disabled = false;
  }
};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type||'');
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}
function showModalError(modalId, msg) {
  const el = document.querySelector('#' + modalId + ' .modal-error');
  if (el) { el.textContent = String(msg || 'Error.'); el.classList.add('show'); }
}
function clearModalError(modalId) {
  const el = document.querySelector('#' + modalId + ' .modal-error');
  if (el) el.classList.remove('show');
}
</script>
</body>
</html>
