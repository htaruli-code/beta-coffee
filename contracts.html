<!DOCTYPE html>
<!-- Version 2.5.2 | contracts.html -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contracts — Sample Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #fdf8f2; --border: #f0e8da; --accent: #c47a2b;
      --text: #1a1a1a; --muted: #8a7060; --error: #c0392b; --success: #2e7d52;
      --font-mono: 'IBM Plex Mono', monospace; --font-sans: 'Inter', sans-serif;
      --radius: 4px; --transition: 160ms ease; --nav-h: 52px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
    .nav { position: sticky; top: 0; z-index: 100; height: var(--nav-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; }
    .nav-brand { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; transition: color var(--transition); }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-user { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); cursor: pointer; }
    .nav-user:hover { color: var(--error); }
    .page { max-width: 1300px; margin: 0 auto; padding: 2rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; }
    .page-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
    .toolbar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--accent); color: #fff; border: none; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 1rem; cursor: pointer; border-radius: var(--radius); transition: background var(--transition); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.7rem; }
    .btn-danger { background: var(--error); color: #fff; }
    input, select, textarea { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.5rem 0.875rem; border-radius: var(--radius); outline: none; transition: border-color var(--transition); width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }
    label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.3rem; font-family: var(--font-mono); }
    .field { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
    .field-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.75rem; gap: 1rem; }
    .card-title { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; }
    .card-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .card-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .badge { display: inline-block; font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.55rem; border-radius: 2px; }
    .badge-draft           { background: #f0f0f0; color: #666; }
    .badge-active          { background: #edf7f0; color: #1e6640; }
    .badge-partially-drawn { background: #fef9ec; color: #854f0b; }
    .badge-fully-drawn     { background: #eef4fd; color: #1a5ca8; }
    .badge-cancelled       { background: #fdecea; color: #b00020; }
    .lines-table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; font-size: 0.78rem; }
    .lines-table th { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); text-align: left; }
    .lines-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    .lines-table tr:last-child td { border-bottom: none; }
    .num { text-align: right; font-family: var(--font-mono); }
    .progress-bar { background: var(--border); border-radius: 2px; height: 4px; margin-top: 4px; }
    .progress-fill { background: var(--accent); border-radius: 2px; height: 4px; }
    .forward-tag { font-family: var(--font-mono); font-size: 0.62rem; background: #eef4fd; color: #1a5ca8; padding: 0.1rem 0.35rem; border-radius: 2px; margin-left: 0.3rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; width: 100%; max-width: 640px; margin: auto; }
    .modal-title { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; margin-bottom: 1.25rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.25rem; }
    .modal-section { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 1rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    .modal-error { display: none; background: rgba(192, 57, 43, 0.08); border: 1px solid var(--error); color: var(--error); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.65rem 0.85rem; border-radius: var(--radius); margin-bottom: 1rem; }
    .modal-error.show { display: block; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; font-family: var(--font-mono); font-size: 0.78rem; padding: 0.75rem 1.25rem; border-radius: var(--radius); background: var(--text); color: #fff; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; } .toast.error { background: var(--error); } .toast.success { background: var(--success); }
    .loading { text-align: center; padding: 3rem; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }

    /* ── Substitution panel ─────────────────────────────────────────────────── */
    .sub-panel { background: #fdf4e8; border-top: 1px solid var(--border); padding: 0.6rem 0.75rem; }
    .sub-panel-title { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; display: flex; align-items: center; justify-content: space-between; }
    .sub-row { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text); padding: 0.2rem 0; flex-wrap: wrap; }
    .sub-row .sub-label { color: var(--muted); }
    .sub-empty { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-style: italic; }

    /* ── Product Name SKU autocomplete (v2.5) ──────────────────────────────── */
    .sku-ac-wrap { position: relative; }
    .sku-ac-input-wrap { position: relative; }
    .sku-ac-dropdown {
      position: absolute; z-index: 300; background: var(--bg);
      border: 1px solid var(--border2); border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      max-height: 220px; overflow-y: auto;
      min-width: 100%; top: calc(100% + 2px); left: 0;
    }
    .sku-ac-item {
      padding: 0.45rem 0.75rem; cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
    }
    .sku-ac-item:last-child { border-bottom: none; }
    .sku-ac-item:hover, .sku-ac-item.ac-active { background: var(--surface); }
    .sku-ac-code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); font-weight: 600; }
    .sku-ac-name { color: var(--text); }
    .sku-ac-clear { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem;
      padding: 0; line-height: 1; display: none; }
    .sku-ac-clear.show { display: block; }
  </style>
</head>

<script>
// Version 2.5.2 | contracts.html
// v2.5.2: isNaN guards + sanitised numeric fields on contract line and substitution save.
//         dates via UI.formatDate. page-width 1300px.
const fmtDate = v => UI.formatDate(v);
// v2.5: Product Name autocomplete by SKU name/code.
// v2.3: Lot substitution panel — staff can record replacement lots per contract line.
// v2.2: 📧 Dashboard button removed — buyers now log in via OTP at buyer-dashboard.html
// v2.1: 📧 Dashboard button — sendBuyerDashboardLink emails personal token URL
if (typeof APP_CONFIG === 'undefined') throw new Error('config.js not loaded');
if (typeof Auth    === 'undefined') throw new Error('auth.js not loaded');
if (typeof API     === 'undefined') throw new Error('api.js not loaded');
if (!Auth.requireAuth()) throw new Error('Unauthenticated');

let PAGE_DATA = { contracts: [], buyers: [], inventory_lots: [], shipments: [], product_skus: [], contract_statuses: [], availability_types: [], weight_units: [] };

(async () => {
  const user = Auth.getUser(); const company = Auth.getCompany();
  document.getElementById('nav-brand').textContent = company ? company.company_name : 'Sample Tracker';
  document.getElementById('nav-user').textContent  = user ? user.name : '';
  document.getElementById('nav-user').onclick = () => { Auth.logout(); window.location = 'login.html'; };
  try {
    const data = await API.post({ action: 'getContractsPage' });
    PAGE_DATA = data;
    populateFilters();
    renderContracts();
  } catch (e) { showToast('Failed to load.', 'error'); }
})();

function populateFilters() {
  const fs = document.getElementById('filter-status');
  PAGE_DATA.contract_statuses.forEach(s => {
    const o = document.createElement('option'); o.value = s; o.textContent = s; fs.appendChild(o);
  });
  const fb = document.getElementById('filter-buyer');
  PAGE_DATA.buyers.forEach(b => {
    const o = document.createElement('option'); o.value = b.buyer_id; o.textContent = b.company_name; fb.appendChild(o);
  });
  fs.onchange = fb.onchange = renderContracts;
}

function renderContracts() {
  const sf = document.getElementById('filter-status').value;
  const bf = document.getElementById('filter-buyer').value;
  let cons = PAGE_DATA.contracts;
  if (sf) cons = cons.filter(c => c.status === sf);
  if (bf) cons = cons.filter(c => String(c.buyer_id) === String(bf));

  const el = document.getElementById('contract-list');
  if (!cons.length) { el.innerHTML = '<div class="empty">No contracts found.</div>'; return; }

  el.innerHTML = cons.map(con => {
    const buyer     = PAGE_DATA.buyers.find(b => String(b.buyer_id) === String(con.buyer_id));
    const lines     = con.lines || [];
    const total     = calcTotal(lines);
    const badgeKey  = con.status.toLowerCase().replace(/ /g, '-');
    const lineRows  = lines.map(l => {
      const pct     = l.contracted_bags > 0 ? Math.min(100, Math.round(l.drawn_bags / l.contracted_bags * 100)) : 0;
      const subVal  = fmt(l.contracted_bags * l.bag_size * l.unit_price);
      const fwdTag  = l.availability_type === 'forward' ? '<span class="forward-tag">FWD</span>' : '';
      const subs    = l.substitutions || [];
      const origLot = PAGE_DATA.inventory_lots.find(lot => String(lot.lot_id) === String(l.inventory_lot_id));

      // Build substitution rows
      const subRowsHtml = subs.map(s => {
        const replLot  = PAGE_DATA.inventory_lots.find(lot => String(lot.lot_id) === String(s.replacement_lot_id));
        const replLabel = replLot
          ? esc(replLot.sample_name) + ' <span style="color:var(--muted)">(Lot ' + s.replacement_lot_id + ' · ' + replLot.available_bags + ' avail)</span>'
          : 'Lot ' + s.replacement_lot_id;
        // v2.4: show drawdown_id context; legacy subs have no drawdown_id
        const ddTag = s.drawdown_id
          ? '<span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--muted)">DD-' + s.drawdown_id + '</span>'
          : '<span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--muted);font-style:italic">legacy</span>';
        return '<div class="sub-row">' +
          ddTag +
          '<span class="sub-label">↳</span>' +
          '<span>' + replLabel + '</span>' +
          '<span class="sub-label">·</span>' +
          '<strong>' + s.bags_count + ' bags</strong>' +
          (s.reason ? '<span class="sub-label"> — ' + esc(s.reason) + '</span>' : '') +
          '<button class="btn btn-ghost btn-sm" style="margin-left:auto;padding:0.15rem 0.5rem" ' +
            'onclick="openSubModal(' + l.contract_line_id + ',' + (l.inventory_lot_id||0) + ',' + s.substitution_id + ',' + (s.drawdown_id||'null') + ')">Edit</button>' +
          '<button class="btn btn-danger btn-sm" style="padding:0.15rem 0.5rem" ' +
            'onclick="deleteSub(' + s.substitution_id + ')">Del</button>' +
        '</div>';
      }).join('');

      const origLotLabel = origLot
        ? esc(origLot.sample_name) + ' (Lot ' + l.inventory_lot_id + ' · ' + origLot.available_bags + ' avail)'
        : l.inventory_lot_id ? 'Lot ' + l.inventory_lot_id : 'No lot linked';

      // Substitution panel — only shown when a lot is linked
      const subPanel = l.inventory_lot_id
        ? '<tr><td colspan="8" style="padding:0">' +
            '<div class="sub-panel">' +
              '<div class="sub-panel-title">' +
                '<span>Lot Substitutions' + (subs.length ? ' (' + subs.length + ')' : '') + '</span>' +
                '<button class="btn btn-ghost btn-sm" ' +
                  'onclick="openSubModal(' + l.contract_line_id + ',' + l.inventory_lot_id + ')">+ Substitute Lot</button>' +
              '</div>' +
              '<div style="font-family:var(--font-mono);font-size:0.68rem;color:var(--muted);margin-bottom:' + (subs.length ? '0.4rem' : '0') + '">' +
                'Original: ' + origLotLabel +
              '</div>' +
              (subs.length ? subRowsHtml : '<span class="sub-empty">No substitutions recorded.</span>') +
            '</div>' +
          '</td></tr>'
        : '';

      return '<tr>' +
        '<td>' + esc(l.sample_name) + fwdTag + '</td>' +
        '<td class="num">' + l.contracted_bags + '</td>' +
        '<td class="num">' + l.drawn_bags + '</td>' +
        '<td class="num">' + (l.contracted_bags - l.drawn_bags) + '</td>' +
        '<td class="num">' + (l.unit_price ? l.unit_price + '/' + esc(l.price_unit) : '—') + '</td>' +
        '<td class="num">' + subVal + '</td>' +
        '<td style="min-width:100px">' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<div style="font-size:0.65rem;color:var(--muted);text-align:right">' + pct + '%</div>' +
        '</td>' +
        '<td>' +
          '<button class="btn btn-ghost btn-sm" onclick="openLineModal(' + con.contract_id + ',' + l.contract_line_id + ')">Edit</button>' +
          '<button class="btn btn-danger btn-sm" onclick="deleteLine(' + con.contract_id + ',' + l.contract_line_id + ')">Del</button>' +
        '</td>' +
      '</tr>' + subPanel;
    }).join('');

    return `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${esc(con.contract_number)} <span class="badge badge-${badgeKey}">${esc(con.status)}</span></div>
          <div class="card-sub">${buyer ? esc(buyer.company_name) : '—'} · ${fmtDate(con.contract_date)} · ${lines.length} line${lines.length!==1?'s':''} · <strong>${total}</strong></div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="openLineModal(${con.contract_id})">+ Line</button>
          <button class="btn btn-ghost btn-sm" onclick="openContractModal(${con.contract_id})">Edit</button>
        </div>
      </div>
      ${lines.length ? `<table class="lines-table">
        <thead><tr><th>Sample</th><th class="num">Contracted</th><th class="num">Drawn</th><th class="num">Remaining</th><th class="num">Price</th><th class="num">Value</th><th>Progress</th><th></th></tr></thead>
        <tbody>${lineRows}</tbody>
      </table>` : '<div style="font-size:0.75rem;color:var(--muted)">No lines yet.</div>'}
    </div>`;
  }).join('');
}

function calcTotal(lines) {
  if (!lines.length) return '—';
  const kg = lines.filter(l => l.price_unit === 'kg').reduce((s,l) => s + l.contracted_bags * l.bag_size * l.unit_price, 0);
  const lb = lines.filter(l => l.price_unit === 'lb').reduce((s,l) => s + l.contracted_bags * l.bag_size * l.unit_price, 0);
  const parts = [];
  if (kg) parts.push(fmt(kg) + ' /kg');
  if (lb) parts.push(fmt(lb) + ' /lb');
  return parts.join(' + ') || '—';
}

// ── Lot Substitution Modal ────────────────────────────────────────────────────

function openSubModal(contractLineId, originalLotId, substitutionId, drawdownId) {
  const sub  = substitutionId
    ? (PAGE_DATA.contracts.flatMap(c => c.lines||[])
        .find(l => String(l.contract_line_id) === String(contractLineId))
        ?.substitutions || [])
      .find(s => String(s.substitution_id) === String(substitutionId))
    : null;

  const line    = PAGE_DATA.contracts.flatMap(c => c.lines||[])
                    .find(l => String(l.contract_line_id) === String(contractLineId));
  const origLot = PAGE_DATA.inventory_lots.find(l => String(l.lot_id) === String(originalLotId));

  // ── Compute max substitutable (mirrors server logic in handleSaveLotSubstitution) ──
  // pending_approved = drawn_bags minus what has already been dispatched/delivered
  // dispatched_delivered = lot.received_bags - lot.available_bags
  // maxSubstitutable = max(0, pending_approved - lot.available_bags)
  // i.e. how many in-flight bags cannot be covered by the primary lot
  let maxSubstitutable = null;
  if (line && origLot) {
    const dispatchedDelivered = (origLot.received_bags || 0) - (origLot.available_bags || 0);
    const pendingApproved     = Math.max(0, (line.drawn_bags || 0) - dispatchedDelivered);
    maxSubstitutable          = Math.max(0, pendingApproved - (origLot.available_bags || 0));
  }

  // Existing substitution bags from OTHER records on this line (excluding this one if editing)
  const existingSubs    = line ? (line.substitutions || []) : [];
  const existingSubId   = sub ? String(sub.substitution_id) : null;
  const otherSubBags    = existingSubs
    .filter(s => String(s.substitution_id) !== existingSubId)
    .reduce((sum, s) => sum + (s.bags_count || 0), 0);
  // Remaining gap after existing substitutions
  const remainingGap    = maxSubstitutable !== null ? Math.max(0, maxSubstitutable - otherSubBags) : null;

  document.getElementById('modal-sub-title').textContent = sub ? 'Edit Substitution' : 'Add Lot Substitution';
  document.getElementById('sub-id').value               = sub ? sub.substitution_id  : '';
  document.getElementById('sub-drawdown-id').value     = drawdownId || (sub ? sub.drawdown_id : '') || '';
  document.getElementById('sub-contract-line-id').value = contractLineId;
  document.getElementById('sub-original-lot-id').value  = originalLotId || '';
  document.getElementById('sub-bags').value             = sub ? sub.bags_count : '';
  document.getElementById('sub-reason').value           = sub ? sub.reason     : '';
  document.getElementById('sub-bags-hint').textContent  = '';

  // Store maxSubstitutable on the input for save validation
  document.getElementById('sub-bags').dataset.maxSub = remainingGap !== null ? remainingGap : '';

  // Show original lot name + gap context
  document.getElementById('sub-original-lot-label').textContent =
    origLot ? origLot.sample_name + ' (Lot ' + originalLotId + ')' : 'Lot ' + originalLotId;

  // Gap info block — show how many bags need substitution
  const gapInfo = document.getElementById('sub-gap-info');
  if (gapInfo) {
    if (maxSubstitutable !== null && maxSubstitutable > 0) {
      gapInfo.innerHTML = 'Gap to cover: <strong>' + maxSubstitutable + ' bags</strong>' +
        (otherSubBags > 0 ? ' &nbsp;·&nbsp; Already assigned: <strong>' + otherSubBags + '</strong>' +
          ' &nbsp;·&nbsp; Remaining: <strong>' + remainingGap + '</strong>' : '');
      gapInfo.style.display = 'block';
      gapInfo.style.color   = 'var(--accent)';
    } else if (maxSubstitutable === 0) {
      gapInfo.textContent   = 'Primary lot covers all active drawdowns — no substitution needed.';
      gapInfo.style.display = 'block';
      gapInfo.style.color   = 'var(--success)';
    } else {
      gapInfo.style.display = 'none';
    }
  }

  // Replacement lot dropdown — show all active lots except original
  // Cap each option's effective max at min(lot.available_bags, remainingGap)
  const replSel = document.getElementById('sub-replacement-lot');
  replSel.innerHTML = '<option value="">— Select replacement lot —</option>' +
    PAGE_DATA.inventory_lots
      .filter(l => String(l.lot_id) !== String(originalLotId) && l.is_active !== false)
      .map(l => {
        const lotAvail    = l.available_bags || 0;
        const effectiveMax = remainingGap !== null ? Math.min(lotAvail, remainingGap) : lotAvail;
        return `<option value="${l.lot_id}"
          data-available="${lotAvail}"
          data-effective-max="${effectiveMax}"
          ${sub && String(sub.replacement_lot_id) === String(l.lot_id) ? 'selected' : ''}>
          ${esc(l.sample_name)} · ${lotAvail} avail
        </option>`;
      }).join('');

  // Update bags hint when lot changes — use effectiveMax, not raw available
  replSel.onchange = function() {
    const opt          = replSel.options[replSel.selectedIndex];
    const effectiveMax = opt && opt.dataset.effectiveMax ? parseInt(opt.dataset.effectiveMax) : null;
    const lotAvail     = opt && opt.dataset.available    ? parseInt(opt.dataset.available)    : null;
    document.getElementById('sub-bags').max = effectiveMax || '';

    let hint = '';
    if (effectiveMax !== null && lotAvail !== null) {
      hint = '(max ' + effectiveMax + ' bags';
      if (effectiveMax < lotAvail) hint += ' — limited by gap';
      hint += ')';
    }
    document.getElementById('sub-bags-hint').textContent = hint;
  };
  if (sub) replSel.onchange();

  clearModalError('modal-sub');
  document.getElementById('modal-sub').classList.add('open');
}

document.getElementById('btn-sub-cancel').onclick = () =>
  document.getElementById('modal-sub').classList.remove('open');

document.getElementById('btn-sub-save').onclick = async function() {
  const btn           = this;
  const lineId        = document.getElementById('sub-contract-line-id').value;
  const origLotId     = document.getElementById('sub-original-lot-id').value;
  const replLotId     = document.getElementById('sub-replacement-lot').value;
  const bags          = parseInt(document.getElementById('sub-bags').value);  // v2.5.2: no || 0 — catch NaN
  const maxBags       = parseInt(document.getElementById('sub-bags').max) || null;
  clearModalError('modal-sub');

  const maxSub  = document.getElementById('sub-bags').dataset.maxSub !== ''
    ? parseInt(document.getElementById('sub-bags').dataset.maxSub) : null;
  if (!replLotId) { showModalError('modal-sub', 'Please select a replacement lot.'); return; }
  if (isNaN(bags) || bags <= 0) { showModalError('modal-sub', 'Bags must be a whole number greater than zero.'); return; }
  if (maxBags !== null && bags > maxBags) {
    showModalError('modal-sub', 'Bags (' + bags + ') exceed available on replacement lot (' + maxBags + ').');
    return;
  }
  if (maxSub !== null && bags > maxSub) {
    showModalError('modal-sub', 'Bags (' + bags + ') exceed the substitution gap (' + maxSub + ' bags needed).');
    return;
  }

  btn.disabled = true;
  try {
    const data = await API.post({
      action:             'saveLotSubstitution',
      substitution_id:    document.getElementById('sub-id').value || null,
      contract_line_id:   lineId,
      original_lot_id:    origLotId,
      replacement_lot_id: replLotId,
      bags_count:         bags,
      reason:             document.getElementById('sub-reason').value,
      drawdown_id:        document.getElementById('sub-drawdown-id').value || null
    });
    // Merge substitutions + updated line into PAGE_DATA
    mergeSubs(data);
    if (data.contract_line) mergeLine(data.contract_line);
    // Refresh lot available_bags in PAGE_DATA
    if (data.original_lot)    mergeLot(data.original_lot);
    if (data.replacement_lot) mergeLot(data.replacement_lot);
    document.getElementById('modal-sub').classList.remove('open');
    renderContracts();
    showToast('Substitution saved.', 'success');
  } catch (e) { showModalError('modal-sub', e.message || 'Save failed.'); }
  finally { btn.disabled = false; }
};

async function deleteSub(substitutionId) {
  if (!confirm('Remove this substitution?')) return;
  try {
    const data = await API.post({
      action:          'deleteLotSubstitution',
      substitution_id: substitutionId
    });
    mergeSubs(data);
    if (data.contract_line) mergeLine(data.contract_line);
    if (data.original_lot)    mergeLot(data.original_lot);
    if (data.replacement_lot) mergeLot(data.replacement_lot);
    renderContracts();
    showToast('Substitution removed.', 'success');
  } catch (e) { showModalError('modal-sub', e.message || 'Delete failed.'); }
}

function mergeSubs(data) {
  if (!data.contract_line_id || !data.substitutions) return;
  PAGE_DATA.contracts.forEach(c => {
    (c.lines || []).forEach(l => {
      if (String(l.contract_line_id) === String(data.contract_line_id)) {
        l.substitutions = data.substitutions;
      }
    });
  });
}

function mergeLot(updatedLot) {
  if (!updatedLot) return;
  const idx = PAGE_DATA.inventory_lots.findIndex(l => String(l.lot_id) === String(updatedLot.lot_id));
  if (idx >= 0) PAGE_DATA.inventory_lots[idx] = updatedLot;
}

function mergeLine(updatedLine) {
  // Merges drawn_bags and other scalar fields from the server response back into PAGE_DATA.
  // Preserves substitutions[] already merged by mergeSubs (server returns them separately).
  if (!updatedLine) return;
  PAGE_DATA.contracts.forEach(c => {
    (c.lines || []).forEach((l, i) => {
      if (String(l.contract_line_id) === String(updatedLine.contract_line_id)) {
        // Merge scalar fields — keep substitutions[] from mergeSubs, not server's line copy
        c.lines[i] = Object.assign({}, updatedLine, { substitutions: l.substitutions });
      }
    });
  });
}

// ── Product Name SKU Autocomplete ────────────────────────────────────────────
let skuAcIndex = -1;

function skuAcInput(input) {
  const q      = input.value.trim().toLowerCase();
  const ddEl   = document.getElementById('l-name-dropdown');
  const clrBtn = document.getElementById('l-name-clear');

  // Clear hidden fields when user types (de-select previous SKU)
  document.getElementById('l-sku-id').value   = '';
  document.getElementById('l-sku-code').value = '';
  clrBtn.className = q ? 'sku-ac-clear show' : 'sku-ac-clear';
  skuAcIndex = -1;

  if (!q) { ddEl.style.display = 'none'; return; }

  const skus = (PAGE_DATA.product_skus || []).filter(s =>
    (s.sku_name || '').toLowerCase().includes(q) ||
    (s.sku_code || '').toLowerCase().includes(q)
  ).slice(0, 10);

  if (!skus.length) { ddEl.style.display = 'none'; return; }

  ddEl.innerHTML = skus.map((s, i) =>
    `<div class="sku-ac-item" data-idx="${i}" data-sku-id="${s.sku_id}" data-sku-code="${esc(s.sku_code)}" data-sku-name="${esc(s.sku_name)}"
      onmousedown="skuAcSelect(event)">${'<span class="sku-ac-name">' + esc(s.sku_name) + '</span>'} &nbsp;<span class="sku-ac-code">(${esc(s.sku_code)})</span></div>`
  ).join('');
  ddEl.style.display = 'block';
}

function skuAcSelect(e) {
  e.preventDefault();
  const item  = e.currentTarget;
  const name  = item.dataset.skuName;
  const code  = item.dataset.skuCode;
  const id    = item.dataset.skuId;
  document.getElementById('l-name').value      = name;
  document.getElementById('l-sku-id').value    = id;
  document.getElementById('l-sku-code').value  = code;
  document.getElementById('l-name-clear').className = 'sku-ac-clear show';
  document.getElementById('l-name-dropdown').style.display = 'none';
  skuAcIndex = -1;
}

function skuAcKeydown(e) {
  const ddEl  = document.getElementById('l-name-dropdown');
  const items = ddEl.querySelectorAll('.sku-ac-item');
  if (!items.length || ddEl.style.display === 'none') return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    skuAcIndex = Math.min(skuAcIndex + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    skuAcIndex = Math.max(skuAcIndex - 1, 0);
  } else if (e.key === 'Enter' && skuAcIndex >= 0) {
    e.preventDefault();
    items[skuAcIndex].dispatchEvent(new MouseEvent('mousedown'));
    return;
  } else if (e.key === 'Escape') {
    ddEl.style.display = 'none'; skuAcIndex = -1; return;
  } else { return; }

  items.forEach((el, i) => el.classList.toggle('ac-active', i === skuAcIndex));
  if (skuAcIndex >= 0) items[skuAcIndex].scrollIntoView({ block: 'nearest' });
}

function clearSkuAc() {
  document.getElementById('l-name').value     = '';
  document.getElementById('l-sku-id').value   = '';
  document.getElementById('l-sku-code').value = '';
  document.getElementById('l-name-clear').className = 'sku-ac-clear';
  document.getElementById('l-name-dropdown').style.display = 'none';
  document.getElementById('l-name').focus();
}

// Close dropdown on outside click
document.addEventListener('click', function(e) {
  const wrap = document.querySelector('.sku-ac-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const ddEl = document.getElementById('l-name-dropdown');
    if (ddEl) ddEl.style.display = 'none';
  }
});

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(n) { return parseFloat(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function showModalError(modalId, message) {
  const errEl = document.querySelector('#' + modalId + ' .modal-error');
  if (!errEl) return;
  errEl.textContent = String(message || 'An error occurred.');
  errEl.classList.add('show');
}
function clearModalError(modalId) {
  const errEl = document.querySelector('#' + modalId + ' .modal-error');
  if (errEl) errEl.classList.remove('show');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+(type||'');
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
